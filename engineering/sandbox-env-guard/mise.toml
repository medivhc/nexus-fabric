# ============================================================================
# sandbox-env-guard — 沙箱环境守卫方案 (mise 驱动)
# ----------------------------------------------------------------------------
# 作用：
#   1. agent 进入沙箱/项目目录时自动探测环境能力（mise enter hook）
#   2. 输出结构化 JSON 能力矩阵 (.env-report/env-report.json)
#   3. harness-select 依据能力矩阵筛选【本次应运行 / 应跳过】的测试
# 设计原则（对齐 nexus-fabric AGENTS.md）：仓库即 API、机器约束、
# 独立验证、持久化证据。环境能力是 Evidence 的绑定维度之一。
# ============================================================================

[tools]
# 本方案脚本为 Python，不依赖 mise 管理 rust；环境 rust 由 rustup 提供。
# 若希望 mise 统一管理工具版本，取消下一行注释（将自动安装/切换 1.93.0，走国内镜像）：
# rust = "1.93.0"

# ---------------------------------------------------------------------------
# 任务：环境探测
# ---------------------------------------------------------------------------
# 跨平台说明：本任务命令用于 Unix shell（bash/zsh/sh），统一用 `python`。
# Windows 没有 `python`，只有 `py` 启动器，故 Windows 用户请用 `scripts/guard.ps1`
# （自动探测 py -3 / py / python3），不要直接 `mise run guard`。
# 脚本本身是纯 Python，不含 bash 语法，guard.ps1 在 PowerShell 下即可运行，无需 bash。
[tasks.check-env]
description = "探测沙箱环境能力，输出结构化 JSON 报告到 stdout 与 .env-report/env-report.json"
# 显式用 --out-dir（优先于环境变量 ENV_REPORT_DIR），让输出位置在命令行可见。
# 退出码：0=正常 / 1=无法写出报告（环境状态未知，不得继续）
run = "python scripts/env-check --out-dir .env-report"

# ---------------------------------------------------------------------------
# 任务：测试筛选（harness 消费入口）
# ---------------------------------------------------------------------------
# 经 scripts/guard-plan 包装：把 harness-select 的退出码显式翻译成可判定结论，
# 避免调用方（agent/CI）把 BLOCKED 与「脚本崩溃」混为一谈。退出码严格透传。
#
# 退出码契约（显式说明，非默认传播）：
#   0   OK      test-plan 已产出（.env-report/test-plan.json）
#   1   ERROR   参数或 IO 错误：map / env-report 缺失或不可解析
#   2   BLOCKED --scenarios-dir 下未发现任何 scenario toml，守卫拒绝产出
#               test-plan（绝不降级为「用 map pattern 冒充测试 id」）。
#               处置：修正 --scenarios-dir 路径；不得为变绿削弱 map / gate。
[tasks.test-plan]
description = "依据环境能力矩阵筛选本次应运行的测试，输出 .env-report/test-plan.json"
run = "python scripts/guard-plan --env-report .env-report/env-report.json --map test-capability-map.toml --out .env-report/test-plan.json --scenarios-dir samples/scenarios"

# ---------------------------------------------------------------------------
# 组合任务：完整守卫流程
# ---------------------------------------------------------------------------
# 用 mise 的 `depends` 串联，而不是 `cmd1 && cmd2`——
# `&&` 在 bash/cmd 可用但 PowerShell 5.x 不支持，depends 与 shell 无关。
[tasks.guard]
description = "完整守卫流程：环境探测 -> 测试筛选"
depends = ["check-env", "test-plan"]

# ---------------------------------------------------------------------------
# 任务：守卫自回归测试（darwin 工作流「实测表现」维度）
# ---------------------------------------------------------------------------
[tasks.test]
description = "运行守卫自回归套件：用确定性能力矩阵 fixture 实测 harness-select 门控"
run = "python scripts/run_tests.py"

# ---------------------------------------------------------------------------
# 任务：Windows 侧的同一套回归测试（无需 bash / 无需 mise）
# ---------------------------------------------------------------------------
# run_tests.ps1 只负责定位 Python 3.11+（Windows 常只有 `py` 启动器），
# 断言仍由 run_tests.py 执行 —— 保证与 `mise run test` 跑的是同一套门控契约。
# 退出码透传：0=全绿 / 1=失败 / 2=BLOCKED
[tasks.test-win]
description = "Windows 入口：自动探测 py -3 / python / python3 后运行守卫自回归套件"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_tests.ps1"

# ---------------------------------------------------------------------------
# 任务：执行桥接（判定 -> 执行 -> 证据）
# ---------------------------------------------------------------------------
# guard-plan 只产出 test-plan（"能跑哪些"）；guard-verify 真正驱动执行
# selected 里的测试，并把结果写成 evidence（.env-report/verify-results.json）。
# 退出码：0=无FAIL / 1=有FAIL / 2=BLOCKED / 3=参数或IO错误
[tasks.verify]
description = "执行 test-plan 中 selected 的测试并产出证据"
run = "python scripts/guard-verify.py --scenarios-dir samples/scenarios"

# 只列计划不执行（快，适合 PR smoke test）
[tasks.verify-dry]
description = "dry-run：只打印将执行的测试清单，不实际运行"
run = "python scripts/guard-verify.py --scenarios-dir samples/scenarios --dry-run"

# ---------------------------------------------------------------------------
# Hook：agent 进入项目目录时自动运行环境探测
# 生效前提：在 shell rc 启用 mise shell hook（`eval "$(mise activate bash)"` /
# `mise activate zsh`），并对本项目执行 `mise trust`（mise 安全模型默认不执行
# 未信任项目的 hook / task）。enter hook 在部分 mise 版本为实验特性，需 experimental。
# ---------------------------------------------------------------------------
[hooks]
enter = "mise run check-env"

[settings]
experimental = true
