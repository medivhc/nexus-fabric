[package]
name = "nexus-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# MIT OR Apache-2.0 (in policies/dependencies.toml allowlist); default-features = false
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
nexus-connectivity = { path = "../../crates/nexus-connectivity" }
nexus-platform = { path = "../../crates/nexus-platform" }
nexus-dns = { path = "../../crates/nexus-dns" }
nexus-projection = { path = "../../crates/nexus-projection" }
# dev-dependencies（仅单测；不进二进制）
# sha2 已在工作区依赖树内（nexus-auth 使用），声明为 dev-dependency 不引入新包；
# 见 policies/dependencies.toml 的 sha2 条目（MIT OR Apache-2.0）。
[dev-dependencies]
sha2 = { version = "0.10", default-features = false }
