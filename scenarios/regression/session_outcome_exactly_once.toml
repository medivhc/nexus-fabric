schema_version = 1
id = "regression.session-outcome-exactly-once"
title = "取消、成功、断链竞争时 TerminalOutcome 只提交一次"
evidence_strength = "E3"

[given]
race = ["worker_success", "cancel_requested", "network_disconnect"]

[when]
action = "run_race_many_times"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "lifecycle_phase"
equals = "Disposed"
