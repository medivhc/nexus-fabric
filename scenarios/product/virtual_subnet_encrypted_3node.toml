schema_version = 1
id = "product.virtual-subnet-encrypted-3node"
title = "加密虚拟子网三节点链路转发（A—B—C，B 每跳重加密）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-virtual-subnet-networking"

[given]
command = "virtual subnet encrypted 3node"
network = "none (in-memory carrier, offline deterministic)"
encryption = "X25519 ephemeral handshake + ChaCha20Poly1305 link frames (PRODUCT §12.6)"

# 可执行 E4：三节点 A(10.0.0.1)—B(10.0.0.2)—C(10.0.0.3) 链，A 与 C 不直连。
# 全节点 enable_encryption；A↔B、B↔C 各自完成 ephemeral 握手（A 发起 A↔B，
# B 发起 B↔C）；A 向 C 发一个 IP 包：A 用 A↔B 会话加密 → B 解密后按 §12.5
# 路由语义用 B↔C 会话重新加密转发 → C 解密写 VPI。断言：C 收到原始 payload、
# B bytes_forwarded>0、wire 无明文泄漏（密文不含 "->" 路由头与 payload 原文）、
# 重放同一密文被拒、各节点加密模式开启。
[when]
command = "cargo run --quiet -p nexus --example virtual_subnet_encrypted_3node -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "virtual subnet encrypted 3node"

[[expect]]
field = "c_vpi_payload"
equals = "ping-from-a-to-c"

[[expect]]
field = "c_vpi_len"
equals = 16

[[expect]]
field = "b_bytes_forwarded_ok"
equals = true

[[expect]]
field = "a_encrypted"
equals = true

[[expect]]
field = "b_encrypted"
equals = true

[[expect]]
field = "c_encrypted"
equals = true

[[expect]]
field = "a_b_state"
equals = "Connected"

[[expect]]
field = "c_b_state"
equals = "Connected"

[[expect]]
field = "wire_plaintext_leak"
equals = false

[[expect]]
field = "replay_rejected"
equals = true
