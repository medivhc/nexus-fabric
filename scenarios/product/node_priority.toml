schema_version = 1
id = "product.node-priority"
title = "节点优先级：按优先级/延迟/带宽选择最优路由"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-node-priority"

[given]
priority_node_a = 10
priority_node_b = 5
latency_slow_ms = 100
latency_fast_ms = 10
bandwidth_low_mbps = 100
bandwidth_high_mbps = 1000

[when]
command = "cargo run --quiet -p nexus --example node_priority -- --json"

[[expect]]
field = "registered.node_a"
equals = 10

[[expect]]
field = "registered.node_b"
equals = 5

# 优先级压倒延迟：priority=5（高延迟）仍胜出
[[expect]]
field = "priority_overrides_latency.selected_node_id"
equals = "node-b"

[[expect]]
field = "priority_overrides_latency.selected_priority"
equals = 5

# 同优先级选低延迟
[[expect]]
field = "same_priority_lower_latency.selected_node_id"
equals = "fast"

[[expect]]
field = "same_priority_lower_latency.selected_latency_ms"
equals = 10

# 同优先级同延迟选高带宽
[[expect]]
field = "same_priority_same_latency_higher_bandwidth.selected_node_id"
equals = "high-bw"

[[expect]]
field = "same_priority_same_latency_higher_bandwidth.selected_bandwidth_mbps"
equals = 1000

# 空候选列表返回 None
[[expect]]
field = "empty_candidates.selected_node_id"
equals = null

# 越界优先级被拒绝
[[expect]]
field = "invalid_priority_rejected"
equals = true
