schema_version = 1
id = "product.dijkstra-fib"
title = "去中心化选路：LSDB → TopoView → Dijkstra 最短路 → FIB（dst → Vec<NextHop>）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-dijkstra-fib"
carrier = "v9-connectivity"

[given]
topology = "4 nodes: A-B(10ms), B-D(10ms), A-C(50ms), C-D(10ms), B-C(10ms); links advertised in LSA neighbors"
cost = "link cost = max(latency_ms, 1)"
fib_shape = "dst vip -> Vec<NextHop>; single next_hop this phase"
atomicity = "Fib::compute full recompute + whole replacement with generation"

# 可执行 E4：进程内四节点（A 视角算路）
#   topo_built            LSDB（含链路）→ TopoView 建图成功
#   shortest_paths_ok     A→C 经 B（20ms < 50ms 直连），A→D 经 B（20ms 最短）
#   fib_shape_ok          每 dst 恰 1 条 NextHop（Vec 形状），peer 为第二跳
#   generation_bumped     重算后 generation 递增、旧 FIB 不被原地修改
[when]
command = "cargo run --quiet -p nexus --example dijkstra_fib -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "topo_built"

[[expect]]
field = "events.1"
equals = "shortest_paths_ok"

[[expect]]
field = "events.2"
equals = "fib_shape_ok"

[[expect]]
field = "events.3"
equals = "generation_bumped"

[[expect]]
field = "fib.a_to_c_via"
equals = "node-b"

[[expect]]
field = "fib.a_to_d_via"
equals = "node-b"

[[expect]]
field = "fib.entry_shape"
equals = "vec_single"
