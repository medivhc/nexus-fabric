schema_version = 1
id = "product.pipeline-compression"
title = "数据面管线：真实 gzip 经隧道端到端往返，可压缩负载正压缩率，不可压缩负载无损"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-dataplane-pipeline"
carrier = "v9-connectivity"

[given]
algorithm = "gzip"
level = 6
min_original_bytes = 64

[when]
command = "cargo run --quiet -p nexus --example pipeline_compression -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "pipeline-compression"

# 可压缩负载（重复字节）经隧道真实 gzip 往返后逐字节一致
[[expect]]
field = "compressible_roundtrip_ok"
equals = true

# 不可压缩负载（高熵随机）经隧道往返后逐字节一致
[[expect]]
field = "incompressible_roundtrip_ok"
equals = true

# 可压缩负载确实被真实压缩（统计压缩率 > 0）
[[expect]]
field = "compressible_ratio_positive"
equals = true

# 算法标签为 gzip
[[expect]]
field = "algorithm_tag"
equals = "gzip"
