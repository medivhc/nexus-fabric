schema_version = 1
id = "product.n3-nonzero-exit"
title = "非零测试退出码保真且区分结果交付"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd
carrier = "n1-fabric"

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "允许码为 [0] 的真实命令退出 7，收集 stdout/stderr 与所需报告并读取任务。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- nonzero-exit"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "task.outcome"
equals = "Failed"

[[expect]]
field = "task.error.code"
equals = "WorkloadExit"

[[expect]]
field = "task.execution.exit_code"
equals = 7

[[expect]]
field = "task.execution.workload_succeeded"
equals = false

[[expect]]
field = "task.execution.result_confirmed"
equals = true

[[expect]]
field = "task.delivery.state"
equals = "Complete"

[[expect]]
field = "observed.command_start_count"
equals = 1
