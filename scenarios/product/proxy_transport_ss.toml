schema_version = 1
id = "product.proxy-transport-ss"
title = "ProxyTransport：QUIC over Shadowsocks 会话（T1/T3/T4/T6）"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#3.5"
carrier = "n1-fabric"

[given]
topology = "self-built minimal ss server (SsStream seal/open); A dials B via ss handshake; QUIC over AEAD-sealed length-prefixed TCP (T1)"
payload_stream = "64KB deterministic bytes"

# 可执行 E4：自研最小 ss server（流式 SIP004：AEAD 流 → open → parse_request →
# 回 seal(b"ss-proxy-ok") → 解密后中继成帧字节到 B）→ A 经 ss 建 QUIC 到 B →
# 64KB 回显并校验完整 →
# 输出 stats JSON，断言 proxy_relayed_bytes > 0（T1/T6）且 proxy 只见密文（T3/X2）。
[when]
command = "cargo run --quiet -p nexus-proxy-transport --example proxy_ss_quic -- --json"

# 冻结期望（T1/T3/T6）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "roundtrip_ok"
equals = true

# 64KB 必须完整走 ss 隧道（relayed 字节数被实测到）。
[[expect]]
field = "proxy_relayed_bytes"
non_empty = true

# ss server 只看到 AEAD 记录与 QUIC 密文：明文载荷匹配次数必须为 0（T3/X2）。
[[expect]]
field = "proxy_saw_plaintext_bytes"
equals = 0
