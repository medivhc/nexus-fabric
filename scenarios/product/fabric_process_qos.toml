schema_version = 1
id = "product.fabric-process-qos"
title = "进程归因与 QoS 标记：流建立时归因一次，按流缓存为 FlowLabels"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6.3"
carrier = "n1-fabric"

[given]
topology = "single node, Linux (/proc), real TCP loopback"
packets = "deterministic: example's own TCP client connection"

# 可执行 E4：example 在本机跑（Linux）：
# - TcpListener bind 127.0.0.1:0；当前进程用 TcpStream connect 到它
# - 对该连接（client 的 local_addr → server 的 local_addr）做进程归因，
#   断言 process_name 非空（应为本 example 进程的 comm 名）
# - QosConfig { "<observed process_name>": High } → 断言分类为 High
# - unknown 用例：对不存在的五元组（127.0.0.1:1 → 127.0.0.1:2）归因，
#   断言 pid/process_name 均为 None，且 QosConfig 分类为 Normal
# - 非 Linux 平台：归因恒返回 unknown，example 输出
#   {"verdict":"SKIP","reason":"..."} 而非 FAIL
# - 只用公开 API + 可观测输出，无"上帝之手"。
# PASS 路径的字段（process_name 非空、qos_class=High、unknown 用例）由实现者
# 在 Linux 真机上验证；本 scenario 只门禁"不 FAIL"（非 Linux 允许 SKIP）。
[when]
command = "cargo run --quiet -p nexus-projection --example process_qos -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
one_of = ["PASS", "SKIP"]
