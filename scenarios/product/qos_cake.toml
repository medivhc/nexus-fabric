schema_version = 1
id = "product.qos-cake"
title = "CAKE-like QoS 调度器（DRR 公平队列 + 严格优先级 + 整形 + 流回收）"
evidence_strength = "E4"
requirement = "docs/DAEMON_ARCHITECTURE.md#11"

[given]
quantum = 1514
flow_timeout_secs = 60
clock = "injectable fake clock (explicit Duration; no sleep, no tokio)"
shaping = "rate 1000 B/s, burst 1000 (token bucket, per-egress)"

[when]
command = "nexus-harness run qos-cake --json"

# (a) 公平性：A(4x1500B) 与 B(12x500B) 同为 Medium、持续 backlog
#     -> 各出队 6000B，共 16 包（DRR 按字节公平）
[[expect]]
field = "fairness.flow_a_bytes"
equals = 6000

[[expect]]
field = "fairness.flow_b_bytes"
equals = 6000

[[expect]]
field = "fairness.total_packets"
equals = 16

# (b) 严格优先级：High(3x100B, dport=53) 全部先出，Medium(3x100B) 后出
#     注：场景求值器的 equals 仅支持标量，故出队顺序编码为字符串签名
[[expect]]
field = "priority.order_signature"
equals = "HHHLLL"

# (c) 整形：t=0 出 1000B（burst）后令牌空 -> dequeue 阻塞；
#     t=1s 令牌恢复 1000 -> 再出一包
[[expect]]
field = "shaping.first_burst_bytes"
equals = 1000

[[expect]]
field = "shaping.blocked_when_tokens_empty"
equals = true

[[expect]]
field = "shaping.resumed_after_1s"
equals = true

# (d) 流回收：t=0 建流 X 入队；t=61s reap -> 回收 1 个，流表为空
[[expect]]
field = "reap.reaped_count"
equals = 1

[[expect]]
field = "reap.flows_remaining"
equals = 0

# (e) daemon.toml [qos] 解析映射（apps/nexusd）
[[expect]]
field = "config.enabled"
equals = true

[[expect]]
field = "config.mesh_upload_mbps"
equals = 100

[[expect]]
field = "config.proxy_upload_mbps"
equals = 50

[[expect]]
field = "config.quantum"
equals = 1514

#     注：equals 仅支持标量，端口列表编码为逗号分隔字符串
[[expect]]
field = "config.high_priority_ports"
equals = "22,53,3389"
