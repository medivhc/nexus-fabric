schema_version = 1
id = "product.fib-manager-shared"
title = "FibManager 多线程共享：并发读 + 写触发重算"
evidence_strength = "E4"
requirement = "PRODUCT.md#12.54-fib-manager-shared"
carrier = "v9-connectivity"

[given]
topology = "diamond: A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms)"
shared = "SharedFibManager = Arc<RwLock<FibManager<Ecmp>>>; std::sync only"
api = "SharedFibManager::new/read/maybe_recompute; Clone shares ownership"

# 可执行 E4：多线程共享验证
#   concurrent_read  4 线程 × 50 次并发读，无 panic
#   write_recompute  写触发重算，generation 1→2
[when]
command = "cargo run --quiet -p nexus --example fib_manager_shared -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "concurrent_read"

[[expect]]
field = "events.1"
equals = "write_recompute"

[[expect]]
field = "shared.generation"
equals = 2
