schema_version = 1
id = "product.proxy-fwd"
title = "Proxy 生产转发：TUN 包经代理协议真实转发（P1-P5）"
evidence_strength = "E4"
requirement = "apps/nexusd/MODULE.md#proxy-fwd"

[given]
delivery = "real-proxy"
# 本地真实代理服务器（测试桩）：SOCKS5 CONNECT+UDP ASSOCIATE / ss AEAD / trojan
# TUN 包经 ProxyEngine 真实走代理协议到目标

[when]
command = "cargo run --quiet -p nexusd --example proxy_fwd_e4"

# 冻结期望：TCP 经 SOCKS5 代理完成 HTTP 往返；UDP 经代理往返；
# proxy_forwarded 非零；失败路径计数不崩。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "tcp.http_ok"
equals = true

[[expect]]
field = "udp.echo_ok"
equals = true

[[expect]]
field = "stats.proxy_forwarded"
non_empty = true

[[expect]]
field = "stats.proxy_dropped_no_proxy"
equals = 0

[[expect]]
field = "daemon_alive"
equals = true
