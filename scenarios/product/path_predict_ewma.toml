schema_version = 1
id = "product.path-predict-ewma"
title = "路径层 EWMA 预测：RTT 爬升序列，分数单调下降（趋势感知最小验证）"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#4.6"

[given]
input = "RTT climbing sequence: 10ms -> 50ms -> 100ms -> 200ms -> 500ms, loss 0%, fed via on_stats"
mechanism = "Ewma (alpha 0.3) per path; PathManager::score() returns smoothed value"
honest_boundary = "趋势降权（第 2 层）、历史模式（第 3 层）后置；本场景只验证第 1 层实时 EWMA 跟随"

# 可执行 E4：example 直接驱动 Ewma 类型 + PathManager。
# - 对 Ewma 喂 RTT 爬升对应的瞬时分数序列，断言 value 单调下降。
# - 对 PathManager::on_stats 喂同样序列，断言 score() 跟随下降。
# - 无样本路径 score() 为 None（S7 unknown 诚实性）。
[when]
command = "cargo run --quiet -p nexus-path --example path_predict_ewma -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

# EWMA 跟随 RTT 爬升单调下降（预测第 1 层的最小可验证行为）。
[[expect]]
field = "ewma.monotonic_decreasing"
equals = true

# PathManager::score() 同步下降（预测是打分的输入）。
[[expect]]
field = "score.decreased"
equals = true

# 无样本 = unknown（S7），不编造分数。
[[expect]]
field = "score.unknown_is_none"
equals = true
