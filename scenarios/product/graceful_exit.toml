schema_version = 1
id = "product.graceful-exit"
title = "节点优雅退出：Active→Draining→Exiting→Exited 状态机与宽限期排空"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-graceful-exit"
carrier = "v9-connectivity"

[given]
grace_period_ms = 1000
notify_peers = true
wait_for_drain = true

[when]
command = "cargo run --quiet -p nexus --example graceful_exit -- --json"

# 初始处于 Active
[[expect]]
field = "initial_state"
equals = "active"

# begin_draining 后进入 Draining
[[expect]]
field = "after_begin_draining"
equals = "draining"

# 开启 notify_peers 时记录 2 个对端
[[expect]]
field = "notified_peer_count"
equals = 2

# 仍有连接且在宽限期内 → 仍为 Draining（未排空）
[[expect]]
field = "still_draining_while_active"
equals = "draining"

# 连接排空后 → Exiting
[[expect]]
field = "after_drained"
equals = "exiting"

# 再推进一次 → Exited（终态）
[[expect]]
field = "after_exited"
equals = "exited"

# 宽限期超时即使仍有连接也强制 Exiting
[[expect]]
field = "timeout_forces_exiting"
equals = "exiting"

# 关闭 notify_peers 时不记录任何对端
[[expect]]
field = "notify_off_records_none"
equals = 0

# 非法配置（grace_period_ms=0）被拒绝
[[expect]]
field = "invalid_config_rejected"
equals = true
