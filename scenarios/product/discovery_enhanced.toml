schema_version = 1
id = "product.discovery-enhanced"
title = "节点发现增强：去重 upsert、策略门控、超时清理与上限驱逐"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-discovery-enhanced"
carrier = "v9-connectivity"

[given]
interval_ms = 1000
timeout_ms = 5000
max_peers = 3

[when]
command = "cargo run --quiet -p nexus --example discovery_enhanced -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "discovery-enhanced"

# 同 node_id upsert：不新增重复项
[[expect]]
field = "upsert_count"
equals = 1

# upsert 后 endpoint 被刷新
[[expect]]
field = "upsert_endpoint"
equals = "10.0.0.2:2"

# 停用策略的 advertise 被静默忽略（未记录）
[[expect]]
field = "disabled_strategy_recorded"
equals = false

# 超时清理：删除过期邻居条数
[[expect]]
field = "pruned"
equals = 1

# 清理后剩余邻居数
[[expect]]
field = "after_prune_count"
equals = 1

# 表满驱逐：最旧邻居被驱逐
[[expect]]
field = "evicted_old_present"
equals = false

# 新邻居已插入
[[expect]]
field = "new_peer_present"
equals = true

# 快照按 node_id 升序确定性输出
[[expect]]
field = "snapshot_first"
equals = "alpha"

# FromStr 大小写不敏感解析
[[expect]]
field = "parsed_strategy"
equals = "multicast"

# 非法策略字符串被拒
[[expect]]
field = "invalid_strategy_rejected"
equals = true
