schema_version = 1
id = "product.flow-session-mapping"
title = "TUN 数据面流→会话映射：首包走 §10 链建会话，已建流走快路径（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#tun-ingress-session-chain"

[given]
# 可执行 E4（example flow_session_mapping --json，进程内闭环，mock TUN）：
# - syn_creates_session：首个 TCP SYN 触发 SessionManager 创建会话（Allocating），
#   重传 SYN 不重复建；
# - policy_planner_consulted：PolicyEngine::evaluate 与 plan_from_snapshot 被调用，
#   DecisionTrace 可见；
# - tcp_early_data_buffered：建会话期间上行数据被缓冲，会话 Active 后 flush，
#   对端收到完整字节；
# - udp_bounded_buffer：UDP 首包触发建会话，超 bound（32 包/64KB）的包被丢弃且有计数，
#   会话仍正常建立；
# - session_fail_resets_tcp：上游建连失败 → 本地 TCP 收到 RST（不静默黑洞）；
# - idle_timeout_drains：空闲超时流进 Draining，会话数回落，无泄漏；
# - no_planner_in_hot_path：已建流的后续包不调 Planner（调用计数器证明）；
# - path_switch_transparent：底层路径 direct→relay 切换时流表项不变、不断流。
#
# requirement-change 语义（v9 §10 TUN ingress 链）：
# 首包异步建会话改变了"逐包即时转发"的可观察语义；
# dataplane_unified 等老场景的相关期望同步修订（见 ARCHITECTURE.md#tun-ingress）。

[when]
command = "cargo run --quiet -p nexusd --example flow_session_mapping -- --json"

# 首个 SYN 触发会话创建，且只创建一次。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "flow.session_created_on_syn"
equals = true

[[expect]]
field = "flow.sessions_created_for_retransmitted_syn"
equals = 1

# Policy 与 Planner 被咨询，DecisionTrace 可见。
[[expect]]
field = "flow.policy_planner_consulted"
equals = true

[[expect]]
field = "flow.decision_trace_non_empty"
equals = true

# 建会话期间 TCP 早期数据被缓冲，Active 后 flush，对端收到完整字节。
[[expect]]
field = "flow.tcp_early_data_buffered"
equals = true

[[expect]]
field = "flow.tcp_flushed_bytes_complete"
equals = true

# UDP 有界缓冲：超 bound 丢弃有计数，会话仍建立。
[[expect]]
field = "flow.udp_session_created"
equals = true

[[expect]]
field = "flow.udp_dropped_over_bound_count"
non_empty = true

# 建连失败 → TCP RST，不静默黑洞。
[[expect]]
field = "flow.session_fail_resets_tcp"
equals = true

# 空闲超时 → Draining，会话数回落。
[[expect]]
field = "flow.idle_timeout_drains"
equals = true

[[expect]]
field = "flow.sessions_after_idle_timeout"
equals = 0

# 已建流后续包不调 Planner。
[[expect]]
field = "flow.no_planner_in_hot_path"
equals = true

# 路径切换对流映射层透明。
[[expect]]
field = "flow.path_switch_transparent"
equals = true

# 架构不变量：nexus-network 不反向依赖 nexus-flow-session；
# nexus-flow-session 只依赖 {domain, policy, planner, session, network}。
[[expect]]
field = "architecture.flow_session_dependency_direction_ok"
equals = true
