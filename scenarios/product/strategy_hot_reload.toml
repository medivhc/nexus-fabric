schema_version = 1
id = "product.strategy-hot-reload"
title = "策略热切换：运行时换策略无需重启"
evidence_strength = "E4"
requirement = "PRODUCT.md#12.58-strategy-hot-reload"

[given]
topology = "diamond: A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms)"
switch = "SharedFibManager<RoutingStrategy>::set_strategy(Shortest -> Ecmp)"
fail_closed = "invalid strategy parse fails, FIB unchanged"

# 可执行 E4：热切换验证
#   initial_shortest   初始 Shortest：A->D 1 条下一跳
#   hot_switch_to_ecmp 切换到 ECMP：A->D 2 条下一跳，generation 1->2
#   invalid_rejected   非法策略被拒绝，FIB 保持 ECMP
[when]
command = "cargo run --quiet -p nexus --example strategy_hot_reload -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "initial_shortest"

[[expect]]
field = "events.1"
equals = "hot_switch_to_ecmp"

[[expect]]
field = "events.2"
equals = "invalid_rejected"

[[expect]]
field = "hot_reload.generation"
equals = 2

[[expect]]
field = "hot_reload.next_hops"
equals = 2
