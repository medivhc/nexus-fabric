schema_version = 1
id = "product.daemon-run-workspace-flow"
title = "nexus run workspace 暂无路由 → 显式 UNSUPPORTED"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"
carrier = "v9-connectivity"

[given]
daemon = "nexusd"
resource = "workspace"
auth = "pre-shared-token"
transport = "tcp-length-prefix-frame"

# 可执行 E4：`nexus run workspace --json` 暂无执行路由，输出结构化拒绝 JSON。
# requirement-change 2026-10-02（用户已批准）：2026-10-01 CLI 统一（01e5114）删除了
# `nexusd run` 的完整演示事件链（workspace_commit_applied 等）；新 `nexus run` 是
# thin wrapper，workspace 资源暂无路由，直接返回结构化 UNSUPPORTED（exit 0）。
# 旧事件链期望已失效，以新 CLI 真实行为为准。
[when]
command = "cargo run --quiet -p nexus -- run workspace --json"

# 冻结期望（2026-10-02）：无路由资源显式拒绝——verdict=FAIL +
# error.code=UNSUPPORTED，error.message 明确指出不支持的资源（禁止静默降级）。
[[expect]]
field = "verdict"
equals = "FAIL"

[[expect]]
field = "error.code"
equals = "UNSUPPORTED"

[[expect]]
field = "error.message"
equals = "unsupported feature: run workspace"
