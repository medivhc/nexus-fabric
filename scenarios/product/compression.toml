schema_version = 1
id = "product.compression"
title = "数据压缩：算法选择、自适应门控与压缩统计"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-compression"

[given]
algorithm = "gzip"
level = 6
min_original_bytes = 64

[when]
command = "cargo run --quiet -p nexus --example compression -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "compression"

# None 算法对大报文也不压缩，tag=0
[[expect]]
field = "none_no_compress"
equals = true

# 32 字节 < 64 阈值 -> 自适应透传（仍记 gzip 标签）
[[expect]]
field = "below_threshold_passthrough"
equals = true

# 2048 字节 >= 64 -> 标记 compressed，且 roundtrip 一致
[[expect]]
field = "above_threshold_compressed"
equals = true

# 标签往返
[[expect]]
field = "tag_roundtrip"
equals = "gzip"

# 统计：两帧（1 压 1 透传）
[[expect]]
field = "blocks"
equals = 2

[[expect]]
field = "original_total"
equals = 2080

# 骨架身份透传 -> 压缩率 0
[[expect]]
field = "ratio"
equals = 0.0

# 未知 tag 拒绝
[[expect]]
field = "unknown_tag_rejected"
equals = true
