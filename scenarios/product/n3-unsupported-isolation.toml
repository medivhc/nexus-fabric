schema_version = 1
id = "product.n3-unsupported-isolation"
title = "隔离或硬配额不可用不能裸机降级"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "Provider 缺失请求的 container 隔离或硬配额能力；观察拒绝和 OS 启动记录。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- unsupported-isolation"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "error.code"
equals = "UNSUPPORTED_CAPABILITY"

[[expect]]
field = "observed.command_start_count"
equals = 0

[[expect]]
field = "observed.host_fallback_count"
equals = 0
