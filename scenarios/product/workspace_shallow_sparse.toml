schema_version = 1
id = "product.workspace-shallow-sparse"
title = "Workspace 存储治理（v9 §20）：Shallow Sync + Sparse Replica + On-demand Deepening"
evidence_strength = "E4"
requirement = "v9 §20 Shallow Metadata Sync / Sparse Replica / On-demand Deepening"

[given]
description = "远端 5 个提交 → shallow clone（depth=2）只取最近 2 代 → 按需 deepening 拉取老提交对象 → sparse clone 只取 docs/ 路径"

[when]
command = "cargo run --quiet -p nexus-workspace --example workspace_shallow -- --json"

# 冻结期望（语义来源：v9 §20）：
# - Shallow clone 只持有最近 N 代的 commit（本地 DAG 不含更老提交）
# - Head 文件可读；老提交文件本地缺失（不是静默失败，是明确缺失）
# - On-demand deepening 后老提交文件可读（增量拉取，不改变 CommitId）
# - Sparse clone 只持有指定路径前缀的对象
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "shallow_commit_count"
equals = 2

[[expect]]
field = "head_file_readable"
equals = true

[[expect]]
field = "old_file_missing_before_deepen"
equals = true

[[expect]]
field = "old_file_readable_after_deepen"
equals = true

[[expect]]
field = "deepened_commit_id_unchanged"
equals = true

[[expect]]
field = "sparse_docs_present"
equals = true

[[expect]]
field = "sparse_other_absent"
equals = true
