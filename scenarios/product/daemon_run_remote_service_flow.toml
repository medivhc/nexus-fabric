schema_version = 1
id = "product.daemon-run-remote-service-flow"
title = "nexus thin-client run service：进程内 SDK 执行远程服务闭环"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
daemon = "nexusd"
resource = "service"
auth = "pre-shared-token"
transport = "tcp-length-prefix-frame"

# 可执行 E4：`nexus run service --json` 经 thin wrapper 调进程内 SDK 执行，
# 输出单个 JSON 对象。
# requirement-change 2026-10-02（用户已批准）：2026-10-01 CLI 统一（01e5114）删除了
# `nexusd run` 的完整演示事件链（remote_provider_resolved… 等）；新 `nexus run service`
# 是 thin wrapper，只输出精简的执行摘要。旧事件链期望已失效，以新 CLI 真实行为为准。
[when]
command = "cargo run --quiet -p nexus -- run service --json"

# 冻结期望（2026-10-02）：thin wrapper 执行摘要——verdict=PASS，
# run.resource=service，run.outcome=Completed，connectivity Connected，
# session_id 非空（每次运行随机生成，只断言非空）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "run.resource"
equals = "service"

[[expect]]
field = "run.outcome"
equals = "Completed"

[[expect]]
field = "run.connectivity.status"
equals = "Connected"

[[expect]]
field = "run.session_id"
non_empty = true
