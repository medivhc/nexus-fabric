schema_version = 1
id = "product.daemon-run-remote-service-flow"
title = "nexus thin-client run service：进程内 SDK 执行远程服务闭环（诚实化）"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
daemon = "nexusd"
resource = "service"
auth = "pre-shared-token"
transport = "tcp-length-prefix-frame"

# 可执行 E4：`nexus run service --json` 经 thin wrapper 调进程内 SDK 执行，
# 输出单个 JSON 对象。
# requirement-change 2026-10-03（D4 裁决，用户已拍板 N2 规划）：
# `nexus run` 诚实化——返回的 session_id / plan_id / outcome 必须取自底层
# flow 报告的真实值，禁止伪造。
# 旧行为（2026-10-02 冻结）：session_id 为每次随机生成的 `sess-{nanos}` mock
# （代码注释明写 "Generate a mock session ID for now"），outcome 硬编码
# "Completed"，flow 报告被丢弃（`let _report = ...`）。
# 新行为：session_id = flow 内 SessionOwner 的真实 id（确定性
# "sess-remote-service-1"，非随机）；outcome = Owner 唯一提交的
# TerminalOutcome；plan_id = 由 plan 内容（provider_id/placement/path）
# 经 FNV-1a 确定性派生（D3 方向；P0-3 正式 PlanId 落地前为展示用派生值）。
# 旧证据（mock session_id 时代）已 STALE，以本次为准。
[when]
command = "cargo run --quiet -p nexus -- run service --json"

# 冻结期望（2026-10-03，诚实化后）：
# - verdict=PASS，run.resource=service，run.outcome=Completed（Owner 真实提交）
# - run.session_id 精确等于 flow 的真实 SessionId（确定性常量，非随机 mock；
#   精确匹配即证明"来自真实 flow 而非伪造"）
# - run.plan_id 精确等于 FNV-1a("node-b|remote-provider|<path>")（确定性派生）
# - run.connectivity.status=Connected（flow 真实 TCP 建连成功才返回 Ok）
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "run.resource"
equals = "service"

[[expect]]
field = "run.session_id"
equals = "sess-remote-service-1"

[[expect]]
field = "run.plan_id"
equals = "acdc6605a0789fbc"

[[expect]]
field = "run.outcome"
equals = "Completed"

[[expect]]
field = "run.connectivity.status"
equals = "Connected"
