schema_version = 1
id = "product.n3-artifact-missing"
title = "退出零但缺少必需产物不能成功"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd
carrier = "n1-fabric"

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "命令退出 0，没有创建 accepted outputs 中 required=true 的文件。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- artifact-missing"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "task.outcome"
equals = "Failed"

[[expect]]
field = "task.error.code"
equals = "ArtifactMissing"

[[expect]]
field = "task.execution.exit_code"
equals = 0

[[expect]]
field = "task.delivery.state"
equals = "Failed"
