schema_version = 1
id = "product.cli-connectivity-probe"
title = "nexus CLI 前端：connectivity probe 接线到 observability 快照（--json）"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "link probe ready (in-memory LinkProbe, direct ok / relay mixed)"
cli_frontend = "nexus CLI 前端解析 probe <target> 后路由到 observability 快照"

[when]
command = "cargo run --quiet -p nexus -- connectivity probe 8.8.8.8 --json"

# 冻结期望：CLI 前端此前对该命令返回 UNSUPPORTED；现输出每候选探测结果与激活选择。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "connectivity probe"

[[expect]]
field = "probed_count"
equals = 4

[[expect]]
field = "results.0.candidate"
non_empty = true

[[expect]]
field = "results.0.ok"
equals = true

[[expect]]
field = "selected"
non_empty = true
