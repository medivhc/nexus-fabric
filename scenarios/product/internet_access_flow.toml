schema_version = 1
id = "product.internet-access-flow"
title = "InternetAccess 从 Ingress 经 SessionManager/Policy/Planner 创建网络会话"
evidence_strength = "E4"
requirement = "PRODUCT.md#network"
carrier = "v9-connectivity"

[given]
ingress = "portable-flow-context"
destination = "https://example.invalid/"
policy = "Balanced"

# 可执行 E4：组合根（apps/nexus 的 example）按 Ingress -> Policy -> Planner ->
# Session 的顺序驱动 portable-core，并输出单个 JSON 对象供 harness 按路径求值。
[when]
command = "cargo run --quiet -p nexus --example internet_access_flow -- --json"

# 冻结期望（与初版静态契约同语义，转为可机检路径）：四个事件必须按序出现。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "flow_submitted_to_session_manager"

[[expect]]
field = "events.1"
equals = "policy_evaluated"

[[expect]]
field = "events.2"
equals = "plan_selected"

[[expect]]
field = "events.3"
equals = "session_created"

# Planner 必须真实选出 Provider/Placement/Path，而不是占位空值。
[[expect]]
field = "plan.provider_id"
non_empty = true

[[expect]]
field = "plan.placement"
non_empty = true

[[expect]]
field = "plan.path"
non_empty = true

# Session 创建后处于 Active，尚未提交终态（Outcome 由 Owner 唯一写入）。
[[expect]]
field = "session.phase"
equals = "Active"

[[expect]]
field = "session.outcome"
equals = "Unfinished"

# 架构不变量：nexus-network 不得依赖 nexus-ingress（ARCHITECTURE §3 禁止边）。
[[expect]]
field = "architecture.network_depends_on_ingress"
equals = false
