schema_version = 1
id = "product.internet-access-flow"
title = "InternetAccess 从 Ingress 经 SessionManager/Policy/Planner 创建网络会话"
evidence_strength = "E4"
requirement = "PRODUCT.md#network"

[given]
ingress = "portable-flow-context"
destination = "https://example.invalid/"
policy = "Balanced"

[when]
action = "submit_flow"

[[expect]]
event = "flow_submitted_to_session_manager"

[[expect]]
event = "policy_evaluated"

[[expect]]
event = "plan_selected"

[[expect]]
event = "session_created"

[[expect]]
not_dependency = "nexus-network->nexus-ingress"
