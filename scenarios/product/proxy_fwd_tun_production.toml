schema_version = 1
id = "product.proxy-fwd-tun-production"
title = "TUN 生产 TCP Proxy 经 Dataplane::process_one()+MockTun 真实转发"
evidence_strength = "E4"
requirement = "apps/nexusd/MODULE.md#proxy-fwd"

[given]
# 可执行 E4（example proxy_fwd_tun_production --json，进程内闭环，mock TUN）：
# - 真实 Dataplane::process_one() 装配，不是 ProxyEngine 直调；
# - 本地 TCP echo + SOCKS5 CONNECT 桩；
# - 注入 SYN/ACK/DATA 后不再注入任何上行包，下行响应仍须到达（常态 poll）；
# - 第二个 Dataplane 不注入 engine，Proxy SYN 后须抓到 RST + counter。

[when]
command = "cargo run --quiet -p nexusd --example proxy_fwd_tun_production -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "tcp.http_ok"
equals = true

[[expect]]
field = "zero_uplink_downlink_ok"
equals = true

[[expect]]
field = "stats.proxy_forwarded"
non_empty = true

[[expect]]
field = "stats.proxy_tcp_bytes"
non_empty = true

[[expect]]
field = "no_engine.rst_ok"
equals = true

[[expect]]
field = "daemon_alive"
equals = true
