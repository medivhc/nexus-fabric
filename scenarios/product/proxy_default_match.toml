schema_version = 1
id = "product.proxy-default-match"
title = "未命中任何具体规则 -> MATCH 兜底规则出站"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"
carrier = "v9-connectivity"

[given]
inbound = "socks5 (reuse nexus-ingress Socks5Handshake)"
rule_table = "static ordered: DOMAIN-SUFFIX example.com -> direct; IP-CIDR 10.0.0.0/8 -> relay-group; MATCH -> fallback-outbound"
flow = "CONNECT unknown.example.org:443"
matching = "first-match; unknown.example.org not in suffix/cidr -> MATCH"

# 可执行 E4：组合根 example 驱动 SOCKS5 握手完成（目的为 unknown.example.org），
# 经 RuleEngine 执行顺序匹配；该域名不命中 DOMAIN-SUFFIX example.com 规则，
# 也不是 IP literal，最终命中表尾 MATCH 兜底规则，动作链首动作
# SELECT_OUTBOUND 指向 fallback-outbound。
# 断言确定性字段：verdict、matched_rule、rule_kind、selected_outbound_tag。
[when]
command = "cargo run --quiet -p nexus --example proxy_default_match -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "flow_origin"
equals = "socks5"

[[expect]]
field = "matched_rule"
equals = "rule-match"

[[expect]]
field = "rule_kind"
equals = "match"

[[expect]]
field = "selected_outbound_tag"
equals = "fallback-outbound"

[[expect]]
field = "first_action"
equals = "select_outbound"
