schema_version = 1
id = "product.plugin-dial-ss"
title = "插件接入真实拨号：ss 出站配 xor 插件 dial，线字节被混淆且业务数据正确"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#7.3"
carrier = "v9-connectivity"

[given]
topology = "自研 echo server（真机 127.0.0.1:0，扮演 plugin-aware ss 节点）；client 用 ss OutboundConfig{obfs=xor} 经 dial_with_obfs 拨号"
packets = "deterministic: client 经 wrapped 流发 N=65536 字节；server 从 raw 流读线字节 W，断言 W != 明文 P；server 用同 key xor 包裹后回显；client 读回显 E，断言 E == P"

# 可执行 E4：example 在真机跑：
# - 构造 OutboundConfig{kind=shadowsocks, locator=<server_addr>, obfs=Some("xor"),
#   obfs_key=Some(<key>)}；从中取出 (addr, obfs, params) 调 dial_with_obfs。
# - server: TcpListener::bind(127.0.0.1:0)；accept 得 raw 流；
#   从 raw 流读 N 字节 W，断言 W != P（混淆在线上生效）；
#   再用 xor（同 key）wrap 该流，回显解密后的内容。
# - client: dial_with_obfs(server_addr, Some("xor"), params)；发 P；
#   经 wrapped 流读回显 E；断言 E == P。
# - 断言可观测：dial_ok("xor") == 1（P5）。
# - 只用公开 API + 可观测输出，无"上帝之手"。
# - TCP loopback 不可用（沙箱）→ {"verdict":"SKIP","reason":"..."}，exit 0。
# PASS 路径的字段由实现者在真机上验证；本 scenario 只门禁"不 FAIL"。
[when]
command = "cargo run --quiet -p nexus --example plugin_dial_ss -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
one_of = ["PASS", "SKIP"]
