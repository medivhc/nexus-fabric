schema_version = 1
id = "product.observability-compute-jobs"
title = "§9 可观察性：compute jobs 输出作业会话阶段快照"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "compute sessions ready (submitted via in-memory transport)"
observability = "job phase/result snapshot via nexus-compute"

[when]
command = "cargo run --quiet -p nexusd -- compute jobs --json"

# 冻结期望：内存帧通道显式提交作业并取回结果 -> Active（带结果）；
# 关闭会话 -> Closed；命令以 PASS 输出作业列表（requirement-change：2026-09-18）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "compute jobs"

[[expect]]
field = "jobs.0.id"
non_empty = true

[[expect]]
field = "jobs.0.phase"
one_of = ["Active", "Closed"]

[[expect]]
field = "jobs.1.phase"
one_of = ["Active", "Closed"]

[[expect]]
field = "active_count"
equals = 1

[[expect]]
field = "closed_count"
equals = 1
