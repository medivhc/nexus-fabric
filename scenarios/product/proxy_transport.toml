schema_version = 1
id = "product.proxy-transport"
title = "ProxyTransport：QUIC over SOCKS5 CONNECT（X1–X6）"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#3.5"

[given]
topology = "self-built minimal SOCKS5 server; A dials B via SOCKS5 CONNECT; QUIC over length-prefixed TCP (X1)"
payload_stream = "64KB deterministic bytes"

# 可执行 E4：自研最小 SOCKS5 server -> A 经代理 CONNECT 到 B ->
# connect_with_transport 建 QUIC -> 64KB 回显并校验完整 ->
# 输出 stats JSON，断言 proxy_relayed_bytes > 0（X1/X2/X6）。
[when]
command = "cargo run --quiet -p nexus-proxy-transport --example proxy_quic -- --json"

# 冻结期望（X1/X2/X4/X6）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "roundtrip_ok"
equals = true

# 64KB 必须完整走代理隧道（relayed 字节数被实测到）。
[[expect]]
field = "proxy_relayed_bytes"
non_empty = true

# 代理只看到密文：server 侧记录的明文载荷匹配次数必须为 0（X2）。
[[expect]]
field = "proxy_saw_plaintext_bytes"
equals = 0
