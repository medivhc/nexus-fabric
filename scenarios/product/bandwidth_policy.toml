schema_version = 1
id = "product.bandwidth-policy"
title = "带宽分配策略：按组/按节点配额、优先级与超额处理"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-bandwidth-policy"
carrier = "v9-connectivity"

[given]
group_quota_bytes_per_sec = 1000
per_node_quota_bytes_per_sec = 600
nodes = [
  { node_id = "a", group = "A", priority = "high" },
  { node_id = "b", group = "A", priority = "normal" },
  { node_id = "c", group = "B", priority = "normal" },
]

[when]
command = "cargo run --quiet -p nexus --example bandwidth_policy -- --json"

# 进程内全闭环：policy group=1000B/s、node=600B/s；
# a(High,A)/b(Normal,A)/c(Normal,B)；t=0 Grant -> 组配额耗尽 Drop -> 未注册 Drop ->
# Queue 策略 Queued -> t=1 跨秒重置后再 Grant。

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "bandwidth-policy"

# t=0：a(High) 申请 500，组内有配额 -> granted。
[[expect]]
field = "first_alloc"
equals = "granted"

[[expect]]
field = "first_alloc_bytes"
equals = 500

# t=0：b(Normal) 申请 600，组 A 仅剩 500 < 600 -> dropped（组配额不足）。
[[expect]]
field = "over_quota"
equals = "dropped"

# 未注册节点 -> dropped。
[[expect]]
field = "unregistered_node"
equals = "dropped"

# Queue 策略下组配额不足 -> queued（不记账）。
[[expect]]
field = "queued_path"
equals = "queued"

[[expect]]
field = "queued_count"
equals = 1

# t=1 跨秒重置配额恢复 -> granted。
[[expect]]
field = "after_second_reset"
equals = "granted"

# 组 A 在 t=0 已用 500（b 被丢弃不记账）。
[[expect]]
field = "group_used_after"
equals = 500

# t=1 重置后 b 放行 600 -> 组 A 在 t=1 已用 600。
[[expect]]
field = "group_used_after_reset"
equals = 600

# 策略参数透传。
[[expect]]
field = "policy.group_quota_bytes_per_sec"
equals = 1000

[[expect]]
field = "policy.per_node_quota_bytes_per_sec"
equals = 600
