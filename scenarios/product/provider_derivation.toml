schema_version = 1
id = "product.provider-derivation"
title = "Provider 派生：direct 不入 Registry，ss/trojan 字段映射（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-tun-transparent-inbound"

[given]
# 可执行 E4（example provider_derivation --json）：outbounds=direct(d), ss(p1), trojan(p2)。

[when]
command = "cargo run --quiet -p nexusd --example provider_derivation -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "provider_count"
equals = 2

[[expect]]
field = "tags"
equals = ["p1", "p2"]

[[expect]]
field = "placements"
equals = ["shadowsocks", "trojan"]

[[expect]]
field = "direct_in_registry"
equals = false
