schema_version = 1
id = "product.connection-pool"
title = "连接池：复用空闲连接、上限保护与空闲超时回收"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-connection-pool"

[given]
pool = { max_idle = 2, max_total = 3, idle_timeout_ms = 1000 }
node_a = "node-a"
node_b = "node-b"
node_c = "node-c"
node_d = "node-d"
clock_idle_advance_ms = 2000

[when]
command = "cargo run --quiet -p nexus --example connection_pool -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

# 首次 acquire 新建连接，conn_id 自增从 1 开始
[[expect]]
field = "acquire_first.conn_id"
equals = 1

# release 后再 acquire 同 key 复用同一条空闲连接（conn_id 不变）
[[expect]]
field = "reuse.same_conn_id"
equals = true

[[expect]]
field = "reuse.conn_id"
equals = 1

# 达到 max_total 后再 acquire 新 key 返回 Exhausted
[[expect]]
field = "exhausted"
equals = true

# max_idle 上限生效：归还 3 条后最旧一条被淘汰，空闲数收敛到 max_idle=2
[[expect]]
field = "after_max_idle.idle_count"
equals = 2

# 推进逻辑时钟超过 idle_timeout_ms 后 evict_idle 淘汰全部剩余空闲
[[expect]]
field = "evicted_count"
equals = 2

# 快照计数
[[expect]]
field = "final_snapshot.idle_count"
equals = 0

[[expect]]
field = "final_snapshot.active_count"
equals = 0

[[expect]]
field = "final_snapshot.created_total"
equals = 3

# 非法配置被拒绝（max_total < 1）
[[expect]]
field = "invalid_config_rejected"
equals = true
