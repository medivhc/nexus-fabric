schema_version = 1
id = "product.workspace-sync-resume"
title = "大对象 sync 中断续传：kill -9 后重跑续传完成"
evidence_strength = "E4"
requirement = "v9 §17/§18 + C2-D5（OBJECT-DATA 去 hex 改二进制分块 OBJECT-CHUNK/OBJECT-END）+ C2-D6（非原子、幂等、可续；fetch 每批 persist）"

[given]
description = "A 有一个 >1MB 的大对象；B 发起 sync；传输中途（约 50% chunks 后）模拟 kill -9 中断（丢弃传输态）；B 重跑 sync"

[when]
command = "cargo run --quiet -p nexusd --example workspace_sync_e4 -- --scenario resume --json"

# 冻结期望：
# - 对象以二进制分块传输（无 hex，单帧不大对象）；
# - 中断后重跑只传缺失的 chunks（已落盘 chunk 不重传）；
# - 最终对象字节完整，manifest 哈希一致；
# - 中断前已 fetch 的 commits 不用重拉（BFS 跳过）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "chunking.binary_chunks_used"
equals = true

[[expect]]
field = "chunking.no_hex_frames"
equals = true

[[expect]]
field = "resume.chunks_skipped"
equals = true

[[expect]]
field = "resume.object_bytes_complete"
equals = true

[[expect]]
field = "resume.manifest_hash_match"
equals = true
