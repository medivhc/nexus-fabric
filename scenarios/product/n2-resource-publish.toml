schema_version = 1
id = "product.n2-resource-publish"
title = "nexus resource publish：发布资源（默认 Workspace 内部范围，可撤销）"
evidence_strength = "E4"
requirement = "PRODUCT.md#16-n2-resource-access"
carrier = "v9-connectivity"

[given]
# P0-0 契约冻结（2026-10-03）：`nexus resource publish` 在 P0-2/P0-4 实现，
# 此处先冻结期望。
# requirement-change 注释：本场景为新契约（contract-first）；当前实现尚无
# `resource` 子命令，预期 Red（FAIL：unknown command，exit 2，无 JSON 输出）。
# D2：名字解析与广告传输分离；广告经控制面信封交换，请求方缓存＋TTL 刷新；
# P0 只用 static 子集。白皮书 §7.3：资源发布默认 Workspace 内部范围；
# 发布入口必须能够撤销，并显示其当前生效状态。
# E4 前置条件（P0-6 明确）：`nexus node init`（无身份则 publish 报 NO_IDENTITY）。
# 声明为 fixture（幂等：已初始化则直接通过），即 E4 环境声明的机器可读形式。
fixture = [
  "cargo run --quiet -p nexus -- node init --json",
]
[when]
command = "cargo run --quiet -p nexus -- resource publish --name dev-svc --kind service --json"

# 冻结期望（实现后必须满足）：
# - verdict=PASS；resource.name=dev-svc（发布成功）
# - resource.published=true（当前生效状态显式可查）
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "resource.name"
equals = "dev-svc"

[[expect]]
field = "resource.published"
equals = true
