schema_version = 1
id = "product.tun-outbound-anytls-flow"
title = "真实 TUN + sing-box 1.13.16 AnyTLS 参照端：出站真流量成功且无直连"
evidence_strength = "E4"
requires_root = true
requirement = "apps/nexusd/MODULE.md#proxy-fwd"
carrier = "external"

[given]
# 可执行 E4（scripts/e4/tun_outbound_ref_flow.sh anytls）：
# - 与 VLESS 场景同一拓扑；proxy.yaml 选中 kind=anytls（每流一个 session：
#   一条 TLS + client_handshake + client_open_stream）；
# - 真实 TUN + 生产 Dataplane::process_one() 常态驱动；
# - 参照端 sing-box 1.13.16，TLS 自签仅回环；客户端在独立 netns；
# - 请求/响应 sha256 必须一致（client.sha_match）。

[when]
command = "scripts/e4/tun_outbound_ref_flow.sh anytls"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "tun.created"
equals = true

[[expect]]
field = "outbound.kind"
equals = "anytls"

[[expect]]
field = "outbound.tag"
equals = "proxy"

[[expect]]
field = "client.status"
equals = 200

[[expect]]
field = "client.request_sha256"
non_empty = true

[[expect]]
field = "client.response_sha256"
non_empty = true

[[expect]]
field = "client.sha_match"
equals = true

[[expect]]
field = "stats.proxy_forwarded"
non_empty = true

[[expect]]
field = "stats.proxy_tcp_bytes"
non_empty = true

[[expect]]
field = "ref.target_seen"
equals = true

[[expect]]
field = "ref.version"
equals = "1.13.16"

[[expect]]
field = "ref.sha256"
equals = "8da901e7b6eb0d2f6f6e701f19d5f78af235d038ae078b37a70739db5895d262"

[[expect]]
field = "no_direct"
equals = true
