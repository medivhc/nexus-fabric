schema_version = 1
id = "product.remote-compute-job-flow"
title = "Node A 经远程闭环向 Node B 提交计算作业并取回结果帧"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
node_a = "requester"
node_b = "provider"
resource = "compute"
discovery = "static"
auth = "pre-shared-token"
transport = "tcp-length-prefix-frame"

# 可执行 E4：组合根（apps/nexus 的 example）跨节点驱动计算资源远程流水线
# Resolve -> Plan -> Session -> Connectivity -> Auth -> Compute -> Observe，
# 输出单个 JSON 对象供 harness 按路径求值。
[when]
command = "cargo run --quiet -p nexus --example remote_compute_job_flow -- --json"

# 冻结期望：远程计算流水线事件链按序出现（Discovery -> 规划 -> 会话 -> 建连 -> 作业提交 -> 完成）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "remote_provider_resolved"

[[expect]]
field = "events.1"
equals = "plan_selected"

[[expect]]
field = "events.2"
equals = "session_created"

[[expect]]
field = "events.3"
equals = "connectivity_established"

[[expect]]
field = "events.4"
equals = "compute_job_submitted"

[[expect]]
field = "events.5"
equals = "remote_access_completed"

# 静态发现解析出 Node B 的 Endpoint（Identity != Locator）。
[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "discovery.endpoint"
non_empty = true

# Transport 冻结为 TCP + u32 大端长度前缀帧。
[[expect]]
field = "transport.kind"
equals = "tcp-frame"

# 认证门控在作业帧前通过（预共享 Token 校验成功，产出 Principal）。
[[expect]]
field = "auth.gate"
equals = "token_verified"

[[expect]]
field = "auth.principal"
non_empty = true

# Planner 真实决策：Provider = Node B（远程执行器），Placement/Path 非空。
[[expect]]
field = "plan.provider_id"
equals = "node-b"

[[expect]]
field = "plan.placement"
non_empty = true

[[expect]]
field = "plan.path"
non_empty = true

# Session 双轨：业务完成后 Owner 唯一提交 Completed，物理排空到 Disposed。
[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Completed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

# 计算会话：真实作业提交/结果往返，Active 且取回结果与作业标识。
[[expect]]
field = "compute.phase"
equals = "Active"

[[expect]]
field = "compute.job_id"
non_empty = true

[[expect]]
field = "compute.result"
equals = "42"

# 架构不变量：nexus-compute 不因远程能力新增架构边（MODULE Allowed Dependencies 不变）。
[[expect]]
field = "architecture.network_depends_on_ingress"
equals = false
