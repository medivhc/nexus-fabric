schema_version = 1
id = "product.proxy-http-mixed-inbound"
title = "HTTP/混合代理入站：同端口首字节分流 HTTP 代理（绝对 GET + CONNECT 隧道）与 SOCKS5 共存"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
inbound = "mixed (same TCP port: 0x05 -> SOCKS5, otherwise -> HTTP proxy)"
egress = "real-outbound-connect (loopback origin)"
origin = "loopback 127.0.0.1 local HTTP server replying 200"

# 可执行 E4：本地 HTTP origin + Nexus 混合入站单会话闭环（accept 3 次，每会话一种协议）。
# (i) HTTP 绝对形式 GET 经混合端口 -> origin 200；
# (ii) 同端口 CONNECT 隧道 -> 200 Connection Established -> 隧道内 GET 200；
# (iii) 同端口 SOCKS5 握手 -> CONNECT -> GET 200（mixed 共存零回归）。
[when]
command = "cargo run --quiet -p nexus --example proxy_http_mixed_inbound -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "client.http_forward_ok"
equals = true

[[expect]]
field = "client.http_forward_status"
equals = "HTTP/1.1 200 OK"

[[expect]]
field = "client.http_connect_reply"
equals = "HTTP/1.1 200 Connection Established"

[[expect]]
field = "client.http_connect_tunnel_ok"
equals = true

[[expect]]
field = "client.socks5_ok"
equals = true

[[expect]]
field = "routing.selected_outbound_tag"
equals = "direct"

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Completed"
