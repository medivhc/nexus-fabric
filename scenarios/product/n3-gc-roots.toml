schema_version = 1
id = "product.n3-gc-roots"
title = "重启后运行输入与待交付产物仍受 GC 保护"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd
carrier = "n1-fabric"

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "创建超过保留期且不在当前 Head 的输入和未交付输出，重启存储/Owner，GC 后读取。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- gc-roots"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "observed.snapshot_readable_after_gc"
equals = true

[[expect]]
field = "observed.pending_artifact_readable_after_gc"
equals = true

[[expect]]
field = "observed.roots_restored_before_gc"
equals = true

[[expect]]
field = "observed.pins_released_after_finalization"
equals = true

[[expect]]
field = "observed.explicit_retained_snapshot_readable"
equals = true
