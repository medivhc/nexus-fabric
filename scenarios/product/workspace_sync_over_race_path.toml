schema_version = 1
id = "product.workspace-sync-over-race-path"
title = "Workspace sync 走 active_conn：relay→direct 切换中 sync 中断后重跑幂等"
evidence_strength = "E4"
requirement = "v9 §17/§18 + C2-D1（复用 NatSwitching::active_conn 当前优选连接；路径竞速对 sync 透明，Identity≠Locator）"
carrier = "n1-fabric"

[given]
description = "双端经 NAT 穿透 + 路径竞速建立连接（初始 active=relay）；A 发起大对象 sync；中途 PathManager 将 active 切换为 direct（模拟 direct 竞速胜出）；sync 中断；A 重跑 sync"

[when]
command = "cargo run --quiet -p nexusd --example workspace_sync_e4 -- --scenario race-path --json"

# 冻结期望：
# - sync 始终走 active_conn，不自己选路、不另建连接；
# - 路径切换对 sync 层透明（sync 不感知 direct/relay，只看到连接）；
# - 中断后重跑幂等：已 fetch 的 commits/objects 不重复拉取（BFS 跳过已有）；
# - 最终双端一致，manifest 哈希一致。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "sync.used_active_conn_only"
equals = true

[[expect]]
field = "sync.no_extra_connection"
equals = true

[[expect]]
field = "resume.skipped_existing_commits"
equals = true

[[expect]]
field = "resume.final_heads_converged"
equals = true

[[expect]]
field = "resume.manifest_hash_match"
equals = true
