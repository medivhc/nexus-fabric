schema_version = 1
id = "product.n3-authorization"
title = "执行侧拒绝越权及跨 Workspace 产物读取"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd
carrier = "n1-fabric"

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "分别用无 grant 的主体提交，以及另一 Workspace 的主体获取已登记 Artifact，检查两次审计。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- authorization"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "submit.error.code"
equals = "AUTH_DENIED"

[[expect]]
field = "get.error.code"
equals = "AUTH_DENIED"

[[expect]]
field = "observed.unauthorized_command_start_count"
equals = 0

[[expect]]
field = "observed.leaked_artifact_bytes"
equals = 0

[[expect]]
field = "observed.audit_denials"
equals = 2
