schema_version = 1
id = "product.strategy-extended"
title = "策略集成：k-shortest/disjoint 解析与装配"
evidence_strength = "E4"
requirement = "PRODUCT.md#12.53-strategy-extended"

[given]
topology = "diamond: A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms)"
strategy = "RoutingStrategy::KShortest{k} / Disjoint; parse('k-shortest:3'), parse('disjoint')"
api = "RoutingStrategy::parse; PathComputer delegation"

# 可执行 E4：策略解析 + 装配验证
#   parse_kshortest   "k-shortest:3" -> KShortest{k:3}
#   parse_disjoint    "disjoint" -> Disjoint
#   reject_invalid    "k-shortest:0" -> InvalidParameter
#   delegate_compute  策略装配后算路：K2 得 2 条，Disjoint 得 2 条
[when]
command = "cargo run --quiet -p nexus --example strategy_extended -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "parse_kshortest"

[[expect]]
field = "events.1"
equals = "parse_disjoint"

[[expect]]
field = "events.2"
equals = "reject_invalid"

[[expect]]
field = "events.3"
equals = "delegate_compute"
