schema_version = 1
id = "product.n2-use-probe-honesty"
title = "use 宣告访问入口前真实探测：不可达时 reachable=false + warning（如实回报）"
evidence_strength = "E4"
requirement = "PRODUCT.md#16-n2-resource-access"
carrier = "v9-connectivity"

[given]
# N2 收尾补场景（2026-10-12，post-freeze coverage addition；不属于 P0-0 冻结集）。
# 契约依据：n2-use-loop 冻结注释"N2 P1-9 起同字段还带 reachable/probe，
# 如实回报连通性探测结果"+ use_cli 契约"探测结果必须如实出现在输出里，
# 不再'未经确认就宣告可访问'"。
# 既有 n2-use-loop 只断言 `use.access.endpoint` 非空；本场景锁定探测的
# **诚实面**：发布一个必然拨号不通的数据面端点（127.0.0.1:1；loopback
# 必 refuse，与 n2-provider-offline 夹具的 `n2adm://127.0.0.1:1` 同法），
# use 仍 PASS（探测结果不改变 verdict；预期以静态种子语义为准），
# 但 `access.reachable=false` 且 `access.warning` 非空——不可达必须显式
# 回报，不得隐藏或伪称可访问。
fixture = [
  "cargo run --quiet -p nexus -- node init --json",
  "cargo run --quiet -p nexus -- resource publish --name probe-svc --kind service --locator 127.0.0.1:1 --json",
]

[when]
command = "cargo run --quiet -p nexus -- use probe-svc --json"

# 冻结期望：
# - verdict=PASS（访问建立成功；探测结果如实旁注，不改变 verdict）
# - use.access.reachable=false（必然不可达端点的真实探测结果）
# - use.access.warning 非空（不可达时的显式告警，不得静默）
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "use.access.reachable"
equals = false

[[expect]]
field = "use.access.warning"
non_empty = true