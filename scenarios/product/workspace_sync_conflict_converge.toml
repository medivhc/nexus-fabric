schema_version = 1
id = "product.workspace-sync-conflict-converge"
title = "冲突收敛：先 resolve 者赢，双端最终单 head"
evidence_strength = "E4"
requirement = "v9 §18 + C2-D7（先 resolve 者赢；协议传播 resolution；conflict-state 交换帧；禁止双端各解各的）"

[given]
description = "A/B 离线各改同一文件 conflict.txt（分叉）；A sync B → 产生 ConflictObject（heads 不变）；A 和 B 同时 resolve（先后相差极小）；再双向 sync"

[when]
command = "cargo run --quiet -p nexusd --example workspace_sync_e4 -- --scenario conflict-converge --json"

# 冻结期望：
# - 首次 sync 产生 ConflictObject，heads 保持 2 个（不自动合并）；
# - 双端同时 resolve 后，再 sync 只剩 1 个 head（先 resolve 者的 merge commit 胜出）；
# - 后 resolve 者的本地 merge commit 被放弃（不产生 conflict-of-conflict）；
# - conflict-state 交换帧被正确处理（resolved 状态传播）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "conflict.object_created"
equals = true

[[expect]]
field = "conflict.heads_before_resolve"
equals = 2

[[expect]]
field = "converge.final_heads"
equals = 1

[[expect]]
field = "converge.first_resolver_wins"
equals = true

[[expect]]
field = "converge.no_conflict_of_conflict"
equals = true
