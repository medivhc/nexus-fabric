schema_version = 1
id = "product.remote-service-access-flow"
title = "Node A 经静态发现/规划/会话/建连/Token 门控/Transport 访问 Node B 的 Service 资源"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
node_a = "requester"
node_b = "provider"
resource = "service"
discovery = "static"
auth = "pre-shared-token"
transport = "tcp-length-prefix-frame"

# 可执行 E4：组合根（apps/nexus 的 example）跨节点驱动
# Resolve -> Plan -> Session -> Connectivity -> Auth -> Execute -> Observe 流水线，
# 输出单个 JSON 对象供 harness 按路径求值。
[when]
command = "cargo run --quiet -p nexus --example remote_service_access_flow -- --json"

# 冻结期望：远程流水线事件链按序出现（Discovery 解析 -> 规划 -> 会话 -> 建连 -> 服务连接 -> 完成）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "remote_provider_resolved"

[[expect]]
field = "events.1"
equals = "plan_selected"

[[expect]]
field = "events.2"
equals = "session_created"

[[expect]]
field = "events.3"
equals = "connectivity_established"

[[expect]]
field = "events.4"
equals = "service_connected"

[[expect]]
field = "events.5"
equals = "remote_access_completed"

# 静态发现解析出 Node B 的 Endpoint（Identity != Locator：PeerId 与 Endpoint 分离）。
[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "discovery.endpoint"
non_empty = true

# Transport 冻结为 TCP + u32 大端长度前缀帧。
[[expect]]
field = "transport.kind"
equals = "tcp-frame"

# 认证门控在业务帧前通过（预共享 Token 校验成功，产出 Principal）。
[[expect]]
field = "auth.gate"
equals = "token_verified"

[[expect]]
field = "auth.principal"
non_empty = true

# Planner 真实决策：Provider = Node B（远程提供方），Placement/Path 非空。
[[expect]]
field = "plan.provider_id"
equals = "node-b"

[[expect]]
field = "plan.placement"
non_empty = true

[[expect]]
field = "plan.path"
non_empty = true

# Session 双轨：业务完成后 Owner 唯一提交 Completed，物理排空到 Disposed。
[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Completed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

# Service 会话：connect 语义建立并进入 Active（forward 后置）。
[[expect]]
field = "service.phase"
equals = "Active"

# 架构不变量：nexus-network 不得依赖 nexus-ingress（ARCHITECTURE §3 禁止边）。
[[expect]]
field = "architecture.network_depends_on_ingress"
equals = false
