schema_version = 1
id = "product.n2-session-close"
title = "nexus session close <id>：关闭会话（终态 Cancelled，可观测）"
evidence_strength = "E4"
requirement = "PRODUCT.md#16-n2-resource-access"

[given]
# P0-0 契约冻结（2026-10-03）：`nexus session close` 在 P0-4 实现，此处先冻结期望。
# requirement-change 注释：本场景为新契约（contract-first）；当前实现尚无
# `session close` 子命令，预期 Red（FAIL：unknown command，exit 2，无 JSON 输出）。
# D1：Session 生命周期由 daemon 内唯一 SessionManager 持有；
# 终态语义（D7 修正）：用户主动关闭 → Cancelled（Owner 唯一提交）；
# TerminalOutcome（Completed/Failed/Cancelled）最多提交一次；
# Outcome 确定后仍可继续 cleanup，物理生命周期最终到 Disposed。
# E4 前置：daemon 内存在 Active 的 Session sess-n2-e4-2。
session_id = "sess-n2-e4-2"

[when]
command = "cargo run --quiet -p nexus -- session close sess-n2-e4-2 --json"

# 冻结期望（实现后必须满足）：
# - verdict=PASS；session.id 精确回显；session.outcome=Cancelled
#   （主动关闭的终态，非 Failed）
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "session.id"
equals = "sess-n2-e4-2"

[[expect]]
field = "session.outcome"
equals = "Cancelled"
