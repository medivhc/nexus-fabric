schema_version = 1
id = "product.observability-status"
title = "§9 可观察性：nexusd status 总览（DNS 快照 + 建连链路 + 规划决策 + 平台能力）"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
command = "status"
backed_by = "dns_status/connectivity_status/plan_explain/platform_capabilities snapshots"

[when]
command = "cargo run --quiet -p nexusd -- status --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "summary.plan_selected_provider"
equals = "p1"

[[expect]]
field = "summary.typed_plan_extension"
equals = true

[[expect]]
field = "summary.capabilities"
non_empty = true
