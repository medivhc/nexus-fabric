schema_version = 1
id = "product.pipeline-fragmentation"
title = "数据面管线：报文超过 MTU 被分片，对端重组后逐字节完整一致"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-dataplane-pipeline"
carrier = "v9-connectivity"

[given]
max_fragment_size = 64
packet_bytes = 200

[when]
command = "cargo run --quiet -p nexus --example pipeline_fragmentation -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "pipeline-fragmentation"

# 200 字节报文经分片→重组后完整一致投递到对端 VPI
[[expect]]
field = "reassembled_ok"
equals = true

[[expect]]
field = "reassembled_len"
equals = 200

# 发送侧确实产生了多片（>1）
[[expect]]
field = "fragments_sent"
equals = 4
