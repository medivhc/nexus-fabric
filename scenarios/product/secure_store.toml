schema_version = 1
id = "product.secure-store"
title = "加密持久化：DPAPI + machine-id 派生 AEAD 文件 store（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-secure-store"
carrier = "v9-connectivity"

[given]
machine_id_ok = "0123456789abcdef0123456789abcdef"
machine_id_bad = "xyz"

# 可执行 E4（example secure_store --json，进程内闭环）：
# - dpapi.put_get_roundtrip：Windows DPAPI 真机 put/get 往返（无需管理员）；
#   get 缺失键 → Ok(None)（missing_key=true）。
# - linux.machine_id_parse：合法 32 hex 解析通过 / 非法字符或长度 → 结构化错。
# - linux.aead_roundtrip：ring ChaCha20-Poly1305 加解密往返（平台无关）。
# - linux.file_encrypted：加密文件头 NEXSEC1 magic + 密文 != 明文。

[when]
command = "cargo run --quiet -p nexus --example secure_store -- --json"

[[expect]]
field = "dpapi.put_get_roundtrip"
equals = true

[[expect]]
field = "dpapi.missing_key"
equals = true

[[expect]]
field = "linux.machine_id_parse_ok"
equals = true

[[expect]]
field = "linux.machine_id_parse_bad"
equals = "INVALID_MACHINE_ID"

[[expect]]
field = "linux.aead_roundtrip"
equals = true

[[expect]]
field = "linux.file_magic"
equals = "NEXSEC1"

[[expect]]
field = "linux.ciphertext_differs"
equals = true
