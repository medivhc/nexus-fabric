schema_version = 1
id = "product.geosite-nex-roundtrip"
title = "geosite.nex 二进制格式 roundtrip：构造 → 解析 → 注入 → 路由断言"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
command = "geosite.nex format roundtrip"
format = "magic NXGEOSITE\\0 + u32 count + name_len(4) + name + domain_count(4) + domain_len(4)*n + domain*n"
network = "none (offline)"

# 可执行 E4：example 在内存按 §11.13 格式 v1 构造 geosite.nex 字节（cn/ads），
# 经 nexus-proxy::geosite_nex::parse 解析为 RuleData.geosite，注入 RuleEngine：
# cn 域名命中 geosite 规则、未命中域名与 IP 流量走 MATCH；并断言解析出的
# 域名数与输入一致（roundtrip 完整性）。
[when]
command = "cargo run --quiet -p nexus --example geosite_nex_roundtrip -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "geosite.nex roundtrip"

[[expect]]
field = "case_cn.matched_rule"
equals = "rule-geosite-cn"

[[expect]]
field = "case_cn.rule_kind"
equals = "geosite"

[[expect]]
field = "case_miss.matched_rule"
equals = "rule-match"

[[expect]]
field = "case_domain.matched_rule"
equals = "rule-match"

[[expect]]
field = "parsed_cn_domains"
equals = 2

[[expect]]
field = "parsed_ads_domains"
equals = 1
