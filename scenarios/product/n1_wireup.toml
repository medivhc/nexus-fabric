schema_version = 1
id = "product.n1-wireup"
title = "N1 组网接入：TUN Mesh 包真发进 N1 网络（E4）"
evidence_strength = "E4"
requirement = "apps/nexusd/MODULE.md#W1-W4"
carrier = "n1-fabric"

[given]
# 可执行 E4（example n1_wireup --json，进程内闭环）：
# - mock_tun：内存 channel 模拟 TUN；
# - mock_n1：内存 N1MeshBridge 实现（路由表 10.99.0.0/16 → peer-A）；
# - mesh_send：目的 IP 10.99.0.5 的包 → Mesh 分类 → N1 真发 → mesh_forwarded=1，
#   且 mock N1 收到该包（内容一致）；
# - mesh_no_route：目的 IP 10.100.0.5（无路由）→ mesh_dropped_no_n1=1；
# - mesh_no_conn：有路由但无连接 → mesh_dropped_no_n1=1；
# - n1_recv：mock N1 注入包 → 写回 TUN → tun_written=1；
# - proxy_unaffected：Proxy 分类不受 N1 影响（proxy_forwarded 计数不变）。

[when]
command = "cargo run --quiet -p nexusd --example n1_wireup -- --json"

[[expect]]
field = "n1.mesh_forwarded"
equals = 1

[[expect]]
field = "n1.mesh_dropped_no_n1"
equals = 2

[[expect]]
field = "n1.tun_written"
equals = 1

[[expect]]
field = "n1.n1_received_bytes"
equals = 64

[[expect]]
field = "n1.proxy_forwarded"
equals = 1
