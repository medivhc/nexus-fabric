schema_version = 1
id = "product.n3-cancel-race"
title = "自然退出与取消竞态只有一次真实终态"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "执行退出已经 durable 后递交 cancel，产物登记后查询；取消不得覆盖退出和结果。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- cancel-race"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "cancel.cancellation.state"
equals = "TooLate"

[[expect]]
field = "task.execution.exit_code"
equals = 0

[[expect]]
field = "task.outcome"
equals = "Completed"

[[expect]]
field = "observed.terminal_commit_count"
equals = 1
