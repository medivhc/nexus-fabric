schema_version = 1
id = "product.n1-connectivity-roam-realnet"
title = "N1 真实网络漫游：双真实接口，B 端删 WiFi 次 IP 后传输不中断、CID 不变"
evidence_strength = "E5"
requirement = "v9 §1/§8/§10/§12 N1 Universal Connectivity；白皮书 §6；M1–M7；用户关键验收场景（2026-09-29）"
carrier = "n1-fabric"

[given]
topology = "xc-pc-linux 真机；双真实物理接口（无 netns/veth）：A 绑 172.168.12.97:9000（enp5s0 有线），B 绑 172.168.9.99（wlp6s0 WiFi 次 IP，需预配）；各自建 TUN（nrtun0/nrtun1）、配 VPI 子网 10.144.0.0/24"
peers = "静态配置：PeerId（ed25519）+ 已知 locator（M3 首期）；Identity≠Locator"
bearer = "IP 包走 FabricConn unreliable datagram（M2）；Link 保活走可靠双向流；每对端一个 Connection，按 PeerId 索引，与地址解耦（M4）"
roam = "文件传输中途删除 B 端 wlp6s0 次 IP（真实`ip addr del`，模拟手机关闭 WiFi）；B 主动 rebind()（wildcard，内核按路由选源，源端口必变）→ 从新地址发迁移触发包 → A 被动迁移（M5）"
driver_discipline = "example 只做外部可观察操作（配次 IP、发包、删 IP、读统计、输出 JSON）；禁止直接调内部函数补状态（教训 e4-must-use-production-path）"
realness = "真实物理网卡（enp5s0/wlp6s0）+ 真实 IP + 真实内核路由；非 netns、非 veth、非 loopback。源 IP 选择说明：rebind 用 wildcard，内核对本地目标可能选源=目标 IP，但源端口必变（随机），4-tuple 变化仍触发 QUIC 被动迁移"

# 可执行 E5：A→B 经 VPI 子网 TCP 传 10MB 确定性文件 -> 中途删 B WiFi 次 IP
# -> rebind 恢复 -> 传输完成 -> 校验文件哈希、CID 不变、确实发生过 rebind。
[when]
command = "cargo run --quiet -p nexus-network --example n1_roam_realnet -- --json"

# 冻结期望（与 E4 同标准）。
[[expect]]
field = "verdict"
equals = "PASS"

# 数据面：10MB 文件完整到达（哈希一致，不重不漏）。
[[expect]]
field = "transfer.hash_match"
equals = true

# M4：rebind 不换 CID（连接与地址解耦）。
[[expect]]
field = "connection.id_unchanged"
equals = true

# 反空转断言：必须真实发生过 rebind，否则 PASS 无意义。
[[expect]]
field = "link.rebind_occurred"
equals = true

# 首版宽松门限：只要求"不断"（与 E4 一致；真实网络 RTT 更小，预期远低于门限）。
[[expect]]
field = "transfer.stalled_within_budget"
equals = true
