schema_version = 1
id = "product.smart-retry"
title = "智能重试：指数退避、错误分类与熔断器"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-smart-retry"

[given]
max_attempts = 3
initial_delay_ms = 100
backoff_factor = 2
failure_threshold = 2
circuit_open_ms = 1000

[when]
command = "cargo run --quiet -p nexus --example smart_retry -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "smart-retry"

# 指数退避序列：attempt 1/2/3
[[expect]]
field = "backoff_1"
equals = 100

[[expect]]
field = "backoff_2"
equals = 200

[[expect]]
field = "backoff_3"
equals = 400

# 超过 max_attempts -> StopRetry
[[expect]]
field = "stop_reason"
equals = "max_attempts exceeded"

# 连续失败达阈值 -> 熔断 Open
[[expect]]
field = "circuit_after_threshold"
equals = "open"

# 冷却期内 -> CircuitOpen，retry_after=500
[[expect]]
field = "circuit_retry_after"
equals = 500

# 冷却期过 -> 放行一次 AllowAttempt
[[expect]]
field = "after_cooldown_decision"
equals = "allow-attempt"

# record_success -> 熔断回 Closed
[[expect]]
field = "success_resets_circuit"
equals = "closed"
