schema_version = 1
id = "product.proxy-subscription-online-update"
title = "订阅节点在线更新：loopback HTTP 订阅源拉取 -> §11.8 解析 -> 合并 -> 热生效，失败回退不清空"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"
carrier = "v9-connectivity"

[given]
source = "loopback HTTP subscription source (mutable body, can be made to fail)"
reuse = "§11.8 parse_clash_subscription + §12.15 HotReloadManager hot-apply"
offline = "127.0.0.1 only, no public network"

# 可执行 E4：本地 HTTP server 提供可变 base64 订阅；SubscriptionRuntime 起始含 1 个
# 本地手写 direct 节点。Attempt1 拉取 2 节点订阅 -> 热生效，有效节点 1+2=3；
# Attempt2 制造拉取失败 -> 回退，有效节点保持 3（不清空），HotReload revision 不推进；
# Attempt3 拉取 3 节点订阅（含 1 条未知协议行）-> 整体替换订阅集，有效节点 1+3=4，
# rejected=1，revision 推进到 2。
[when]
command = "cargo run --quiet -p nexus --example proxy_subscription_online_update -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "proxy subscription online update"

[[expect]]
field = "attempt1_ok"
equals = true

[[expect]]
field = "attempt1_node_count_after"
equals = 3

[[expect]]
field = "attempt1_rejected"
equals = 0

[[expect]]
field = "attempt2_ok"
equals = false

[[expect]]
field = "attempt2_node_count_after"
equals = 3

[[expect]]
field = "attempt3_ok"
equals = true

[[expect]]
field = "attempt3_node_count_after"
equals = 4

[[expect]]
field = "attempt3_rejected"
equals = 1

[[expect]]
field = "hot_reload_revision"
equals = 2

[[expect]]
field = "final_node_count"
equals = 4
