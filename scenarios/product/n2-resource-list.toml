schema_version = 1
id = "product.n2-resource-list"
title = "nexus resource list：目录列出有权发现的资源（可发现≠可使用）"
evidence_strength = "E4"
requirement = "PRODUCT.md#16-n2-resource-access"
carrier = "v9-connectivity"

[given]
# P0-0 契约冻结（2026-10-03）：`nexus resource list` 在 P0-2/P0-4 实现，
# 此处先冻结期望。
# requirement-change 注释：本场景为新契约（contract-first）；当前实现尚无
# `resource` 子命令，预期 Red（FAIL：unknown command，exit 2，无 JSON 输出）。
# D2：资源目录提供稳定标识、可读名称、资源类型、使用接口、权限、提供方和
# 有效的可用状态；用户只看到其有权发现的资源；可发现与可使用分别授权
# （discoverable_by vs use_grants 双层授权字段）；资源健康、节点在线和
# 执行容量分别表达；过期广告拒绝（AdvertisementExpired）。
# E4 前置：node-b 已注册至少一个 Service 资源（dev-svc）。
[when]
command = "cargo run --quiet -p nexus -- resource list --json"

# 冻结期望（实现后必须满足）：
# - verdict=PASS；resources 为非空数组（至少含 E4 前置播种的 dev-svc）
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "resources"
non_empty = true
