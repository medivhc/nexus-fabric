schema_version = 1
id = "product.daemon-run-with-command"
title = "nexus run service -- <cmd>：N3 任务语义诚实拒绝，不假执行"
evidence_strength = "E4"
requirement = "PRODUCT.md#16-n2-resource-access"
carrier = "v9-connectivity"

[given]
daemon = "nexusd"
resource = "service"

# 可执行 E4：`nexus run service -- echo hello --json` 必须返回结构化拒绝，
# 而不是把 `--` 静默忽略后假执行。
# requirement-change 2026-10-03（D4 裁决，用户已拍板 N2 规划）：
# 白皮书 A.1 的 `run --resource … -- <cmd>` 是任务提交语义（带输入快照、
# 退出码、产物），归 N3；N2 的 `nexus run` 遇到带 `--` 命令的调用返回结构化
# `UNSUPPORTED{feature:"run-with-command", layer:"N3"}`，不假执行。
# 旧行为：`--` 及其后的命令被静默忽略，按普通 `run service` 假执行并返回
# verdict=PASS（旧证据已 STALE）。
# N2 的资源访问入口为 `nexus use`（P0-4 实现，PRODUCT §16）。
[when]
command = "cargo run --quiet -p nexus -- run service -- echo hello --json"

# 冻结期望（2026-10-03）：
# - verdict=FAIL（请求被显式拒绝，非静默降级；exit 0 = 请求已被处理）
# - error.code=UNSUPPORTED，error.feature 精确为 "run-with-command"，
#   error.layer 精确为 "N3"（任务提交语义归 N3）
[[expect]]
field = "verdict"
equals = "FAIL"

[[expect]]
field = "error.code"
equals = "UNSUPPORTED"

[[expect]]
field = "error.feature"
equals = "run-with-command"

[[expect]]
field = "error.layer"
equals = "N3"
