schema_version = 1
id = "product.n2-use-rejects-command"
title = "nexus use -- <cmd>：N3 任务语义诚实拒绝，不假执行"
evidence_strength = "E4"
requirement = "PRODUCT.md#16-n2-resource-access"

[given]
# N2 收尾补场景（2026-10-12，post-freeze coverage addition；不属于 P0-0 冻结集）。
# 契约依据：§16.2 N2/N3 分界（"白皮书 A.1 的 `run --resource … -- <cmd>`
# 是任务提交语义，归 N3"）+ D4 诚实化（带 `--` 命令的调用返回结构化
# UNSUPPORTED{feature,layer}，而非静默忽略后假执行）。
# `run` 面的同族期望已由 product.daemon-run-with-command 冻结；本场景锁定
# `use` 面：N2 资源访问入口不执行命令，`use -- <cmd>` 必须结构化拒绝。
# 期望对当前实现冻结（命令未执行、未建连即拒绝）。

[when]
command = "cargo run --quiet -p nexus -- use dev-svc -- echo hello --json"

# 冻结期望：
# - verdict=FAIL（显式拒绝，非静默降级）
# - error.code=UNSUPPORTED，error.feature 精确为 "use-with-command"，
#   error.layer 精确为 "N3"（任务提交语义归 N3）
[[expect]]
field = "verdict"
equals = "FAIL"

[[expect]]
field = "error.code"
equals = "UNSUPPORTED"

[[expect]]
field = "error.feature"
equals = "use-with-command"

[[expect]]
field = "error.layer"
equals = "N3"