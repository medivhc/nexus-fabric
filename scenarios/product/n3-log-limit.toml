schema_version = 1
id = "product.n3-log-limit"
title = "日志达到配额仍 drain 并保留真实退出码"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "真实程序持续输出超出 log_bytes，查询 offset/eof/truncated 和进程终态。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- log-limit"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "logs.truncated"
equals = true

[[expect]]
field = "logs.eof"
equals = true

[[expect]]
field = "observed.logged_bytes_within_limit"
equals = true

[[expect]]
field = "observed.offset_reread_equal"
equals = true

[[expect]]
field = "task.execution.exit_code"
equals = 0

[[expect]]
field = "task.outcome"
equals = "Completed"
