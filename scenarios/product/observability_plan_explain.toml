schema_version = 1
id = "product.observability-plan-explain"
title = "§9 可观察性：plan explain 输出 Plan + DecisionTrace 结构化拒绝原因"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"
carrier = "n1-fabric"

[given]
planner = "filter/score (kube-scheduler inspired)"
decision_trace = "considered candidates with structured reject labels"

[when]
# CLI 统一重构（01e5114）后观察命令走 daemon LocalAPI；harness 不负责起 daemon，
# 故用 localapi_probe 自包含起临时 daemon 查一次（等价于旧 `nexusd <cmd> --json` 进程内快照）。
command = "cargo run --quiet -p nexusd --example localapi_probe -- --path /localapi/v0/plan/explain"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "plan.provider"
equals = "p1"

[[expect]]
field = "trace.selected"
equals = "p1"

[[expect]]
field = "trace.considered.1.rejected_reason"
equals = "missing_capability"
