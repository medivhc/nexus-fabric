schema_version = 1
id = "product.outbound-warning-config-check"
title = "出站 interop 警示（config check 载体）：SS partial / VMess broken 有警示行，VLESS verified 无警示"
evidence_strength = "E3"
requirement = "apps/nexus/MODULE.md#出站-interop-标注步骤-3"

[given]
# 可执行 E3（example outbound_warning_config_check --json）：
# - 临时配置目录：VLESS（verified）/ Shadowsocks（partial / USABLE_WITH_GAPS）/
#   VMess（synthetic broken / NOT_IN_MATRIX / NOT_USABLE）；
# - 调用生产校验函数 `nexus::outbound_check::check`（CLI `config check` 的实现体）；
# - `nexus` 真实二进制路径另由 apps/nexus/tests/outbound_config_check_cli.rs 覆盖。
# 文案与 label 全部来自 check-in 的 docs/protocols/interop/verdicts.json。

[when]
command = "cargo run --quiet -p nexusd --example outbound_warning_config_check -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "static_valid"
equals = true

[[expect]]
field = "exit_code"
equals = 0

[[expect]]
field = "invalid_exit_code"
equals = 1

[[expect]]
field = "invalid_error_code"
equals = "PROXY_YAML_INVALID"

[[expect]]
field = "vless_label"
equals = "verified"

[[expect]]
field = "ss_label"
equals = "partial"

[[expect]]
field = "ss_claim"
equals = "USABLE_WITH_GAPS"

[[expect]]
field = "vmess_label"
equals = "broken"

[[expect]]
field = "ss_warning_line"
non_empty = true

[[expect]]
field = "vmess_warning_line"
non_empty = true

[[expect]]
field = "vless_warning_line"
equals = false

[[expect]]
field = "manifest_run_id"
equals = "protocol-interop-fixes-1"
