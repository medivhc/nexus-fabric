schema_version = 1
id = "product.virtual-subnet-holepunch"
title = "tunnel 级双向打洞状态机：成功直连 / 失败 Relay 回退（HolePuncher 挂接，数据面闭环双路径）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-holepunch-tunnel"
carrier = "v9-connectivity"

[given]
subnet_cidr = "10.0.0.0/24"
node_a_virtual_ip = "10.0.0.1"
node_b_virtual_ip = "10.0.0.2"
b_target = "mem-b"
a_initial = "mem-a"
relay_locator = "relay://relay.example.org:443"

# 可执行 E4：单进程双 tunnel（MemoryCarrier 回环）驱动打洞状态机双路径并输出 JSON。
# 成功路径：A.begin_hole_punch(B, "mem-b") → A 置 Probing（HolePunchStarted）→
#   B 收 ph 帧自动回 pa + 学习来源 → A 收 pa 落账（locator=target + Connected）→
#   数据帧 A→B→A 往返成功。
# 失败路径：C 对无监听 target begin_hole_punch → 尝试耗尽 → HolePunchFailed →
#   （配置 relay locator）自动 fallback_to_relay → locator=relay + Connected +
#   帧经 relay 送达（保底）。
# 中间态断言：probe 后 peer_state == Probing（在成功/失败落账前可见）。
# 真实 UDP 双进程打洞（来源学习/回程）由 E5 example udp_peer_holepunch 覆盖。
[when]
command = "cargo run --quiet -p nexus --example virtual_subnet_holepunch -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "virtual subnet holepunch"

# --- 成功路径 ---
[[expect]]
field = "success.probe_state_seen"
equals = "Probing"

[[expect]]
field = "success.state"
equals = "Connected"

[[expect]]
field = "success.locator"
equals = "mem-b"

[[expect]]
field = "success.roundtrip"
equals = true

# --- 失败路径（Relay 回退）---
[[expect]]
field = "fallback.state"
equals = "Connected"

[[expect]]
field = "fallback.locator"
equals = "relay://relay.example.org:443"

[[expect]]
field = "fallback.sent_via_relay"
equals = true

[[expect]]
field = "fallback.probe_state_seen"
equals = "Probing"
