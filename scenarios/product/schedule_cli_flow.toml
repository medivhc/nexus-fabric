schema_version = 1
id = "product.schedule-cli"
title = "计划任务 CLI：at/every 注册、过去时间拒绝、取消、列表、tick 到期触发、持久化重载"
evidence_strength = "E4"
requirement = "PRODUCT.md#14-schedule"
carrier = "v9-connectivity"

[when]
command = "cargo run --quiet -p nexus --example schedule_cli_flow -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "at.register_ok"
equals = true

[[expect]]
field = "at.invalid_past_rejected"
equals = true

[[expect]]
field = "every.register_ok"
equals = true

[[expect]]
field = "cancel.ok"
equals = true

[[expect]]
field = "cancel.not_found"
equals = true

[[expect]]
field = "list.after_register"
equals = 2

# PRODUCT §14.1：`schedule list` 列出全部条目（含已取消，state=Cancelled 仍列出）。
[[expect]]
field = "list.after_cancel"
equals = 2

[[expect]]
field = "tick.fired_once"
equals = true

[[expect]]
field = "persist.reload_preserved"
equals = true
