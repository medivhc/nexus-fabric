schema_version = 1
id = "product.remote-presence-network-unknown-rollback"
title = "Node A 经网络发现协议查询未发布 Peer，返回 PeerUnknown 并结构化拒绝"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"
carrier = "v9-connectivity"

[given]
requester = "node-a"
provider = "node-b"
resource = "service"
discovery = "network-presence"
expectation = "structured-rejection"

# 可执行 E4：Node A 经 DiscoveryTransport 发送 Discover 请求帧查询未发布 Presence 的
# Peer，Node B 的 PresenceServer 查询注册中心未命中，回 PeerUnknown 帧；PresenceClient
# 解码后返回 PeerUnknown 错误（不得缓存、不得使用）——失败发生在 Discovery 阶段
# （未到 Plan/Session/Connectivity），流程输出结构化拒绝（PEER_UNKNOWN），不进入资源访问。
[when]
command = "cargo run --quiet -p nexus --example remote_presence_network_unknown_rollback -- --json"

# 冻结期望：网络发现模式；协议往返 frames = discover -> peer_unknown；
# 解析失败事件；错误码 PEER_UNKNOWN；无 Session 建立。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "discovery.mode"
equals = "network"

[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "discovery.frames.0"
equals = "discover"

[[expect]]
field = "discovery.frames.1"
equals = "peer_unknown"

[[expect]]
field = "events.0"
equals = "presence_resolution_failed"

[[expect]]
field = "error.code"
equals = "PEER_UNKNOWN"

[[expect]]
field = "presence.cached"
equals = false

[[expect]]
field = "session.established"
equals = false
