schema_version = 1
id = "product.disjoint"
title = "Disjoint 不交路径：Suurballe 求 2 条边不交最短路"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-disjoint"

[given]
topology = "A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms), B-C(5ms)"
api = "Disjoint::new(); PathComputer::compute_paths returns 0/1/2 edge-disjoint paths"
algorithm = "Suurballe's 2 edge-disjoint shortest paths; O(E log V)"

# 可执行 E4：Suurballe 不交路径
#   disjoint_found         A->D 得 2 条边不交
#   disjoint_no_shared_edge 两条无共享有向边
#   single_when_bridge     桥接拓扑只返回 1 条
#   unreachable_empty      不可达返回空
[when]
command = "cargo run --quiet -p nexus --example disjoint -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "disjoint_found"

[[expect]]
field = "events.1"
equals = "disjoint_no_shared_edge"

[[expect]]
field = "events.2"
equals = "single_when_bridge"

[[expect]]
field = "events.3"
equals = "unreachable_empty"

[[expect]]
field = "disjoint.path_count"
equals = 2
