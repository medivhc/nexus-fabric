schema_version = 1
id = "product.gateway-file-config"
title = "文件服务配置接线：默认关断、关断不免责、开起来必须自洽且可启动引擎"
evidence_strength = "E4"
requirement = "PRODUCT.md#18-gateway-file-service"

[given]
config_source = "gateway.json"
file_channel = "unwired-at-transport-layer"

[when]
command = "cargo run --quiet -p nexus-web-gateway --example gateway_file_contract -- --case config --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "case"
equals = "config"

# ---- 关断开关：默认必须是关 ----------------------------------------------------
# 老配置里没有 `files` 段等价于 `enabled = false`：向后兼容不能变成"新模块默认上线"。
[[expect]]
field = "absent_section_is_disabled"
equals = true

# 关断时不构造引擎（结构性关断，不是"构造了但每个动词自己判断"）。wire 层还没有调用方，
# 所以"动词被拒"这一格要到 M2 接线才有真对象；这里钉的是"没有可寻址的引擎"。
[[expect]]
field = "disabled_yields_no_engine"
equals = true

# ---- 关断不免责（评审链反复抓的形状：把开关当免检牌）--------------------------
# 表自洽性检查与开关无关：一份"关掉但坏掉"的配置会在下一次打开时静默上线。
# 这里刻意让 max_ack_bytes > max_inflight_bytes_per_session（G12 的配对规则）。
[[expect]]
field = "disabled_still_rejects_inconsistent_table"
equals = true

# 同一棵开关下的低边：零上限等于把那道门拆了，关断状态下也必须拒。
[[expect]]
field = "disabled_still_rejects_zero_ceiling"
equals = true

# ---- 打开时的必备项 ------------------------------------------------------------
[[expect]]
field = "enabled_without_token_rejected"
equals = true

# 只含空白的令牌与空令牌同罪：比较会拿它去匹配一个同样空白出示的串。
[[expect]]
field = "whitespace_only_token_rejected"
equals = true

[[expect]]
field = "enabled_without_roots_rejected"
equals = true

[[expect]]
field = "blank_root_alias_rejected"
equals = true

[[expect]]
field = "duplicate_root_alias_rejected"
equals = true

# 引擎自己会拒重复别名与不存在的目录；配置层必须在启动前把它挡下来，
# 否则"配置通过、启动失败"分成两段，运维面上等价于随机启动失败。
[[expect]]
field = "missing_root_path_rejected"
equals = true

# ---- 数值面：镜像必须精确，交叉规则必须在真实配置路径上跑一遍 -----------------
# 探针把配置里的每个数值与 FileLimits 的字段逐个比对，任何"顺手写的默认值"都会红。
[[expect]]
field = "limits_round_trip_is_exact"
equals = true

# 令牌/时长单位换算：配置面用秒（和 ssh 段一致），引擎面用 Duration。
[[expect]]
field = "durations_map_to_engine_units"
equals = true

# `lockout_window` 在引擎层没有下界（夹具需要毫秒级窗口才能测过期/衰减），
# 但**配置层有**：亚秒窗口会同时缩短锁定与放宽涓流门槛（G15 代价 (2) 的一物两用）。
# 这一条把 G15 未证事项里"随 files 配置接线一起处理"的那半落到真实配置面上。
# 钉的是"配置层答的话"：探针要求错误串里含 `files.lockout_window_secs`（不是开头——
# `GatewayError::Config` 的 Display 会加 `config error: ` 前缀）。只看 `is_err()` 不够——
# 委托给引擎的零时长检查在窗口=0 时也会拒，删掉配置层这条下界时对象照样绿
#（变异 MC01 在第一版只断言 `is_err()` 的对象上实测 0 红）。
[[expect]]
field = "sub_second_window_rejected_by_config"
equals = true

# 高边同样在配置面复现，且**分两层各钉一次**：配置层看 `files.lockout_window_secs`
# 前缀的错误串，引擎层由探针直接调 `FileLimits::validate`（不经委托）。这样删任一层的
# 24 h 都会红；引擎那条另有 `file_service` 的 `every_validate_rule_has_a_red_test` 表格行。
[[expect]]
field = "over_24h_window_rejected_by_config"
equals = true

# 评审 r14 W-1：`idle_timeout` 的两侧界先前**没有**带层标签的对象——评审方自己设计的配方
# NEW20（拆掉配置层那条 idle 24h 上界）实测 0 条单测红、0 条期望翻转，因为委托让引擎那条
# `idle_timeout must be <= 24h` 替配置层答了话。补两条，红因同样要求串里含
# `files.idle_timeout_secs`（下界那条还要求"1 秒本身可用"，否则红的是别的规则）。
[[expect]]
field = "idle_floor_rejected_by_config_layer"
equals = true

[[expect]]
field = "idle_ceiling_rejected_by_config_layer"
equals = true

# 评审 r15 的 R15B 形状：把上界写成 `>=`（恰好 24h 也拒）时，"越界必须被拒"那几格照样绿——
# 配置层与引擎层这两道界的判定集合相同，删一侧不改判定。所以**边界值可用**要自己的对象。
# 这两条是加法，不动任何已冻结的期望。
[[expect]]
field = "window_ceiling_boundary_is_usable"
equals = true

[[expect]]
field = "idle_ceiling_boundary_is_usable"
equals = true

# 评审 r16 W-1：下界那一侧先前没有**独立**的"边界值可用"格——MC24（把 `< 1` 写成 `<= 1`，
# 连合法的 1 秒一起误杀）只翻动名字讲的是"拒绝"的那一格，等于把反向改动混进同一个名字。
# 可用与拒绝是两件事，各配一格，四格补齐成对称。
[[expect]]
field = "window_floor_boundary_is_usable"
equals = true

[[expect]]
field = "idle_floor_boundary_is_usable"
equals = true

# 单源额度的两条交叉界（G12）走的是引擎层 validate，这里证明配置路径真的调到了它。
[[expect]]
field = "source_budget_below_pair_threshold_rejected"
equals = true

[[expect]]
field = "source_budget_above_table_capacity_rejected"
equals = true

# ---- 合法配置必须真的能起来 ----------------------------------------------------
# 先钉反面：**不合法的开启态表不能起出引擎**。`GatewayConfig::file_engine()` 里那句
# `self.validate()?` 在这一条写出来之前没有任何对象——把变异 MC07（删掉那句）打在
# 第一版场景上，实测 0 条单测红、0 条期望翻转，也就是"先检验再构造"只活在注释里。
# 期望同时要求错误串带委托标签 `files limits`，这样红的原因是"缝检验了"而不是
# "别处碰巧也拒了"。
[[expect]]
field = "invalid_table_yields_no_engine"
equals = true

# 评审 r13 W-1：上面那条的红是**词法**的——`FileEngine::new` 第一句就复检 limits，
# 所以删掉缝里 `self.validate()?` 之后坏数值表仍然被拒，只是错误串换了标签。缝真正
# 不可替代的那半只有"配置层独有的规则"，且必须从 `file_engine()` 走过去才成立：
# ① 只含空白但非空的令牌（引擎只查 `is_empty()`，"   " 照收，而它会去匹配一个同样
#    空白出示的串）；② 空白根别名（`SandboxRoot::open` 与 `FileEngine::new` 都不看
#    别名内容）。两条各钉一次，红因必须是配置层的串。
[[expect]]
field = "blank_token_yields_no_engine"
equals = true

[[expect]]
field = "blank_alias_yields_no_engine"
equals = true

[[expect]]
field = "valid_config_launches_engine"
equals = true

# 序列化往返：配置面写出去再读回来，文件段必须原样存在（否则热更新会把模块静默关回默认）。
[[expect]]
field = "files_section_survives_json_round_trip"
equals = true
