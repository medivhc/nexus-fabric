schema_version = 1
id = "product.health-check-real"
title = "健康检查真实定时器：loopback 探测起停驱动 Healthy→Unhealthy→Healthy"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-health-check-real"
carrier = "v9-connectivity"

[given]
probe_interval_ms = 80
timeout_ms = 300
failure_threshold = 2

[when]
command = "cargo run --quiet -p nexus --example health_check_real -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "health-check-real"

# 停 listener 后连续失败达 threshold → 观测到 Unhealthy 事件
[[expect]]
field = "unhealthy_seen"
equals = true

# 重启 listener 后一次成功 → 回到 Healthy 事件
[[expect]]
field = "recovered_to_healthy"
equals = true

# 终态 Healthy
[[expect]]
field = "final_state"
equals = "healthy"
