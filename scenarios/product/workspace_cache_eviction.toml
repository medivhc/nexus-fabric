schema_version = 1
id = "product.workspace-cache-eviction"
title = "Workspace CacheManager：pin 铁律 + 评分驱逐 + 超量拒绝"
evidence_strength = "E4"
requirement = "v9#22"

[given]
# CacheManager 是确定性纯内存结构（逻辑时钟），本场景在任何平台可跑。

[when]
command = "cargo run --quiet -p nexus-workspace --example cache_eviction -- --json"

# 冻结期望：
# 1) pin 住的条目在容量压力下不被驱逐（铁律：DirtyJournal/UniqueReplica/
#    ComputeSnapshot/PendingArtifact/UnreplicatedCommit/ConflictState/Explicit）；
# 2) 驱逐按效用评分从低到高（大体积/低频/低 refetch 成本先被驱逐）；
# 3) 单个对象超过总容量时拒绝写入（TooLarge），不清空已有缓存；
# 4) unpin 后条目重新参与驱逐；
# 5) remove() 拒绝删除被 pin 的条目。
[[expect]]
field = "pinned_survive_pressure"
equals = true

[[expect]]
field = "eviction_order_score_based"
equals = true

[[expect]]
field = "oversize_rejected"
equals = true

[[expect]]
field = "unpinned_becomes_evictable"
equals = true

[[expect]]
field = "remove_refuses_pinned"
equals = true
