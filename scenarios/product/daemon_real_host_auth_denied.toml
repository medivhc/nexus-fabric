schema_version = 1
id = "product.daemon-real-host-auth-denied"
title = "§6 real transport：错误 token 被服务端 AUTH 门控拒绝，客户端透传 AUTH_DENIED（不再抹成 connect 失败）"
evidence_strength = "E4"
requirement = "PRODUCT.md#6-real-transport"

[given]
provider = "host real listener with AUTH gate (token tk-ok)"
client = "wrong token (tk-wrong) real TCP flow"
no_silent_degradation = "explicit AUTH_DENIED code + reason"

[when]
command = "cargo run --quiet -p nexus --example remote_real_host_auth_denied_flow -- --json"

# 冻结期望：服务端拒绝认证；客户端错误码为 AUTH_DENIED 且携带原因；
# 两端错误类型一致（AuthorizationDenied），禁止把认证失败抹成通用 connect 失败。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "client_error.code"
equals = "AUTH_DENIED"

[[expect]]
field = "client_error.reason"
non_empty = true

[[expect]]
field = "server.auth_gate_rejected"
equals = true

[[expect]]
field = "server.error_code"
equals = "AUTH_DENIED"
