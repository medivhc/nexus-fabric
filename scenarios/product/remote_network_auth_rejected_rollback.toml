schema_version = 1
id = "product.remote-network-auth-rejected-rollback"
title = "远程网络会话令牌不匹配时认证门控拒绝并按逆序幂等回滚"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
node_a = "requester"
node_b = "provider"
resource = "internet-access"
auth = "pre-shared-token-mismatch"
transport = "tcp-length-prefix-frame"

# 可执行 E4：组合根驱动远程网络认证门控失败路径并输出 JSON。
[when]
command = "cargo run --quiet -p nexus --example remote_network_auth_rejected_rollback -- --json"

# 冻结期望：认证门控在业务帧前拒绝（W7：未认证帧不得进入业务处理）、
# 逆序幂等回滚（K10）、Owner 唯一提交 Failed(AUTHORIZATION_DENIED)。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "auth.gate"
equals = "blocked_before_authenticated"

[[expect]]
field = "error.code"
equals = "AUTHORIZATION_DENIED"

[[expect]]
field = "rollback.idempotent"
equals = true

[[expect]]
field = "rollback.drained_to_disposed"
equals = true

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Failed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "redundant_commit_rejected"
equals = true

# 失败发生在认证阶段而非解析/规划阶段：Discovery 已解析 Node B 并完成规划。
[[expect]]
field = "plan.provider_id"
equals = "node-b"

[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "discovery.endpoint"
non_empty = true
