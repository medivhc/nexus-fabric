schema_version = 1
id = "product.remote-presence-network-discovery-flow"
title = "Node A 经网络发现协议从 Node B 拉取动态 Presence 并完成远程闭环"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"
carrier = "v9-connectivity"

[given]
requester = "node-a"
provider = "node-b"
resource = "service"
discovery = "network-presence"
auth = "pre-shared-token"
transport = "tcp-length-prefix-frame"

# 可执行 E4：与动态 Presence 同一闭环骨架，但 Discovery 阶段走网络发现协议——
# Node A 经 DiscoveryTransport（组合根 P0 = TCP + 长度前缀帧）发送 Discover 请求帧，
# Node B 的 PresenceServer 查询注册中心并回 Announce 帧，Node A 的 PresenceClient
# 解码并缓存后解析 Endpoint（取代进程内共享注册中心），随后完成完整远程访问。
[when]
command = "cargo run --quiet -p nexus --example remote_presence_network_discovery_flow -- --json"

# 冻结期望：网络发现模式解析 Node B；协议往返 frames = discover -> announce；
# Presence 经网络获取（source=network）且 TTL 有效；全链 7 事件；
# 认证门控在业务帧前通过；Planner 决策 Provider = Node B；Session 双轨 Completed/Disposed
# 且 TerminalOutcome 只提交一次；Service 会话 Active；架构不变量保持。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "discovery.mode"
equals = "network"

[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "discovery.endpoint"
non_empty = true

# 发现协议往返：请求 Discover、响应 Announce（网络化，非进程内 resolve）。
[[expect]]
field = "discovery.frames.0"
equals = "discover"

[[expect]]
field = "discovery.frames.1"
equals = "announce"

# Presence：经网络发现获取（source=network），Node B 已发布、TTL 有效期内可解析。
[[expect]]
field = "presence.source"
equals = "network"

[[expect]]
field = "presence.announced"
equals = true

[[expect]]
field = "presence.ttl_secs"
equals = 60

[[expect]]
field = "events.0"
equals = "presence_discovered"

[[expect]]
field = "events.1"
equals = "remote_provider_resolved"

[[expect]]
field = "events.2"
equals = "plan_selected"

[[expect]]
field = "events.3"
equals = "session_created"

[[expect]]
field = "events.4"
equals = "connectivity_established"

[[expect]]
field = "events.5"
equals = "service_connected"

[[expect]]
field = "events.6"
equals = "remote_access_completed"

[[expect]]
field = "transport.kind"
equals = "tcp-frame"

[[expect]]
field = "auth.gate"
equals = "token_verified"

[[expect]]
field = "auth.principal"
non_empty = true

[[expect]]
field = "plan.provider_id"
equals = "node-b"

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Completed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "service.phase"
equals = "Active"

[[expect]]
field = "architecture.network_depends_on_ingress"
equals = false
