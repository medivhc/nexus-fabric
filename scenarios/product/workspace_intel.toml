schema_version = 1
id = "product.workspace-intel"
title = "Workspace Intelligence（v9 §21）：访问轨迹 → WorkingSet 预测 → Prefetch → 缺失对象走 Planner"
evidence_strength = "E4"
requirement = "v9 §21 Workspace Intelligence"
carrier = "v9-connectivity"

[given]
description = "独立 crate nexus-workspace-intel（可丢失重建，与权威模型物理隔离）：AccessTrace 记访问轨迹；WorkspaceGraph = 静态 containment + 观测共现；WorkingSetEstimator 纯函数打分；PrefetchScheduler 只定预取什么/何时/并发/预算（不选 Provider/Path）；缺失 Object → ResourceDeliveryRequest → Core Planner 取回"

[when]
command = "cargo run --quiet -p nexus --example workspace_intel -- --json"

# 冻结期望（语义来源：v9 §21）：
# - 热点文件（反复访问的 3 个）必须全部进入预测 Top-3
# - 只访问 1 次的冷文件不得进入 Top-3
# - prefetch 总字节 ≤ 预算
# - 已缓存路径不得出现在 prefetch 拉取列表
# - 缺失对象经 ResourceDeliveryRequest → Planner 选中持有副本的 provider，不被拒绝
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "hot_files_covered"
equals = true

[[expect]]
field = "cold_file_not_top"
equals = true

[[expect]]
field = "prefetch_bytes_within_budget"
equals = true

[[expect]]
field = "prefetch_count"
equals = 2

[[expect]]
field = "cached_excluded"
equals = true

[[expect]]
field = "zero_signal_excluded"
equals = true

[[expect]]
field = "missing_object_planned"
equals = true

[[expect]]
field = "planned_provider"
equals = "node-replica"

[[expect]]
field = "planner_rejected"
equals = "none"
