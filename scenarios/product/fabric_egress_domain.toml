schema_version = 1
id = "product.fabric-egress-domain"
title = "域名规则：DNS 嗅探 → 域名命中 Egress{peer}，响应建缓存，后续包继承决策"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6.4"
carrier = "n1-fabric"

[given]
topology = "two Projections (A + B) with MockTun, mock peer link (example binary)"
rules = "A: DOMAIN-SUFFIX blocked.example -> Egress{peer=B}, IP 1.2.3.0/24 -> Egress{peer=B}; B: 0.0.0.0/0 -> Egress{self}"
packets = "deterministic: DNS query for www.blocked.example, DNS response (A 1.2.3.4), UDP to 1.2.3.4:80, DNS query for www.allowed.example, malformed DNS packet"

# 可执行 E4：A 的 DNS 查询包被嗅探出 QNAME=www.blocked.example ->
# 域名规则命中 -> Egress{B} -> B NAT 出口 -> mock 回包 ->
# DNS 响应包被嗅探，A 建缓存 (1.2.3.4 -> www.blocked.example) ->
# 后续发往 1.2.3.4 的包继承域名决策 -> Egress{B} ->
# www.allowed.example 无域名命中 -> 回退 IP 规则 ->
# 畸形 DNS 包嗅探失败 -> 按普通包处理不丢包 -> 输出 JSON。
[when]
command = "cargo run --quiet -p nexus-projection --example egress_domain -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
equals = "PASS"

# DNS 查询包被域名规则路由到 Egress{B}（S16 域名优先）。
[[expect]]
field = "a.route.dns_query_egress_remote"
equals = 1

# DNS 响应包建缓存。
[[expect]]
field = "a.dns.cache_inserted"
equals = 1

# 发往解析 IP (1.2.3.4) 的包继承域名决策 -> Egress{B}（S17）。
[[expect]]
field = "a.route.cached_ip_egress_remote"
equals = 1

# 无域名命中的查询回退到 IP 规则（Egress{self}）。
[[expect]]
field = "a.route.dns_query_fallback_egress_self"
equals = 1

# 畸形 DNS 包不丢包，按普通包处理（S15）。
[[expect]]
field = "a.dns.malformed_not_dropped"
equals = true

# 意图位正确（egress vs mesh）。
[[expect]]
field = "intent.egress_bit_set"
equals = true
