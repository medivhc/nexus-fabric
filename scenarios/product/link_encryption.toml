schema_version = 1
id = "product.link-encryption"
title = "WireGuard 风格链路加密：握手派生会话密钥 -> 数据帧 AEAD 加解密 -> 防重放与错误密钥拒绝闭环"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
topology = "two-peers-in-memory"
algorithm = "ChaCha20Poly1305"
key_exchange = "X25519 ECDH + HKDF-SHA256"

# 可执行 E4：Composition Root 全内存 mock 驱动
# 本地生成两对 KeyPair -> initiator/responder 握手 -> 派生 SessionKey ->
# 加密业务帧 -> 对端解密并经 ReplayWindow 校验 -> 重放帧被拒 -> 错误密钥握手/解密被拒。
[when]
command = "cargo run --quiet -p nexus --example link_encryption -- --json"

# 冻结期望：事件序列与关键事实一次性锁定。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "keypair_generated"

[[expect]]
field = "events.1"
equals = "handshake_completed"

[[expect]]
field = "events.2"
equals = "session_established"

[[expect]]
field = "events.3"
equals = "frame_encrypted"

[[expect]]
field = "events.4"
equals = "frame_decrypted"

[[expect]]
field = "events.5"
equals = "replay_rejected"

[[expect]]
field = "events.6"
equals = "wrong_key_rejected"

[[expect]]
field = "events.7"
equals = "encryption_completed"

[[expect]]
field = "handshake.local_public_key"
non_empty = true

[[expect]]
field = "handshake.peer_public_key"
non_empty = true

[[expect]]
field = "handshake.session_key_established"
equals = true

[[expect]]
field = "handshake.session_key_bytes"
equals = 32

[[expect]]
field = "frame.seq"
non_empty = true

[[expect]]
field = "frame.bytes"
non_empty = true

[[expect]]
field = "frame.nonce_len"
equals = 12

[[expect]]
field = "frame.tag_len"
equals = 16

[[expect]]
field = "replay.rejected"
equals = true

[[expect]]
field = "replay.duplicate_seq"
non_empty = true

[[expect]]
field = "wrong_key.rejected"
equals = true
