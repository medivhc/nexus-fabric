schema_version = 1
id = "product.nexusd-trojan-credential-probe"
title = "nexusd Trojan 凭据探测：密码错误 + fallback 时流被拒绝、fallback 应答零字节到达 TUN（残余 R-5）"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-trojan-credential-probe"
carrier = "n1-fabric"

[given]
topology = "loopback：nexusd 引擎（Dataplane + ProxyEngine + MockTun）+ 本地 TLS Trojan 节点（rcgen 自签，skip_cert_verify）+ TCP echo 目标"
node = "密码正确：探测目标 credential-probe.nexus.invalid:9 立即关闭，其他目标中继到 echo；密码错误：扮演 fallback，读完请求头即回 HTTP/1.1 404，400 ms 后关闭"
cases = "每个用例一个子进程（捕获 stderr 探测行）：wrong_password（探测缺省开启，2 条流）/ right_password（2 条流）/ probe_disabled（credential_probe: false，1 条流）/ wrong_password_lazy_fallback（fallback 读到完整 HTTP 请求才应答，1 条流）/ wrong_password_concurrent（3 条流同时首次拨号，fallback 延迟 500 ms 应答）"
offline = "no public network; std::net + threads"

# 可执行 E4（PRODUCT §11.9.5）。旧实现从不探测，密码错误时把 fallback 的 404 当作隧道
# 数据写回 TUN（fail-open）→ verdict FAIL（Red Evidence）。
[when]
command = "cargo run --quiet -p nexusd --example trojan_credential_probe -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

# 1) 密码错误：一次探测、零流连接，两条流都被 RST，fallback 应答零字节到达 TUN。
[[expect]]
field = "wrong_password.probe_connections"
equals = 1

[[expect]]
field = "wrong_password.probe_target"
equals = "credential-probe.nexus.invalid:9"

[[expect]]
field = "wrong_password.flow_connections"
equals = 0

[[expect]]
field = "wrong_password.all_flows_rst"
equals = true

[[expect]]
field = "wrong_password.downstream_bytes_total"
equals = 0

[[expect]]
field = "wrong_password.fallback_bytes_seen"
equals = false

[[expect]]
field = "wrong_password.tcp_dials_failed"
equals = 2

[[expect]]
field = "wrong_password.probe_results_joined"
equals = "rejected"

[[expect]]
field = "wrong_password.auth_rejected_reported"
equals = true

[[expect]]
field = "wrong_password.probe_connections_before_flows"
equals = 0

[[expect]]
field = "wrong_password.stderr_leaks_password"
equals = false

# 2) 密码正确：一次探测（第二条流用缓存），两条流照常回显。
[[expect]]
field = "right_password.probe_connections"
equals = 1

[[expect]]
field = "right_password.flow_connections"
equals = 2

[[expect]]
field = "right_password.all_flows_echo"
equals = true

[[expect]]
field = "right_password.tcp_dials_failed"
equals = 0

[[expect]]
field = "right_password.probe_results_joined"
equals = "passed"

[[expect]]
field = "right_password.probe_connections_before_flows"
equals = 0

[[expect]]
field = "right_password.stderr_leaks_password"
equals = false

# 3) credential_probe: false：不探测，行为与本节之前相同。
[[expect]]
field = "probe_disabled.probe_connections"
equals = 0

[[expect]]
field = "probe_disabled.flow_connections"
equals = 1

[[expect]]
field = "probe_disabled.all_flows_echo"
equals = true

[[expect]]
field = "probe_disabled.probe_results_joined"
equals = ""

# 4) fallback 只在收到完整 HTTP 请求后才应答：探测附带的 GET 仍能判出 rejected。
[[expect]]
field = "wrong_password_lazy_fallback.probe_connections"
equals = 1

[[expect]]
field = "wrong_password_lazy_fallback.flow_connections"
equals = 0

[[expect]]
field = "wrong_password_lazy_fallback.all_flows_rst"
equals = true

[[expect]]
field = "wrong_password_lazy_fallback.downstream_bytes_total"
equals = 0

# 5) 3 条流同时首次拨号（探测期间）：只探测一次（single-flight），全部被拒、零字节泄漏。
[[expect]]
field = "wrong_password_concurrent.probe_connections"
equals = 1

[[expect]]
field = "wrong_password_concurrent.flow_connections"
equals = 0

[[expect]]
field = "wrong_password_concurrent.all_flows_rst"
equals = true

[[expect]]
field = "wrong_password_concurrent.downstream_bytes_total"
equals = 0

[[expect]]
field = "wrong_password_concurrent.tcp_dials_failed"
equals = 3

[[expect]]
field = "wrong_password_concurrent.probe_results_joined"
equals = "rejected"
