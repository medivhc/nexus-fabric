schema_version = 1
id = "product.proxy-speedtest-http204-bad-status"
title = "proxy speedtest http204 非 204 响应被分类为 unreachable"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"
carrier = "v9-connectivity"

[given]
command = "proxy speedtest"
probe_kind = "http204"
target = "loopback 127.0.0.1 (local HTTP server replying 500)"
probe = "real Http204LatencyProbe (expects 204 status line)"
network = "loopback only (deterministic, offline)"

# 可执行 E4：loopback HTTP 服务返回 500，Http204LatencyProbe 应识别
# 非 204 状态码并记为 unreachable（latency_ms=null），批量测速 verdict 仍 PASS。
[when]
command = "cargo run --quiet -p nexus --example proxy_speedtest_http204_bad_status -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "proxy speedtest"

[[expect]]
field = "probe_kind"
equals = "http204"

[[expect]]
field = "results.0.tag"
equals = "loopback"

[[expect]]
field = "results.0.status"
equals = "unreachable"
