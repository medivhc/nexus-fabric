schema_version = 1
id = "product.proxy-shadowsocks-adapter"
title = "OutboundAdapter 接缝：Shadowsocks AEAD 出站被规则选中并自洽加解密（离线）"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
outbound = "tag=ss-out, kind=shadowsocks, method=chacha20-ietf-poly1305, password=demo"
rule = "rule-ss -> select_outbound ss-out"
offline = "Composition Root 构造 ShadowsocksAdapter，不连真实 SS 服务器"

# 可执行 E4：组合根 example 解析出站配置、构造 ShadowsocksAdapter 并注册为 OutboundAdapter；
# 规则把流量导向 ss-out，断言选中 adapter kind=shadowsocks 且 AEAD encrypt->decrypt 自洽往返。
[when]
command = "cargo run --quiet -p nexus --example proxy_shadowsocks_adapter -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "selected_outbound_kind"
equals = "shadowsocks"

[[expect]]
field = "selected_outbound_tag"
equals = "ss-out"

[[expect]]
field = "method"
equals = "chacha20-ietf-poly1305"

[[expect]]
field = "roundtrip_ok"
equals = true

[[expect]]
field = "ciphertext_nonempty"
equals = true
