schema_version = 1
id = "product.gateway-file-auth-throttle"
title = "网关文件令牌：错误口令拒绝且失败计数有界、达阈值锁定（V1 零节流的反面）"
evidence_strength = "E4"
requirement = "PRODUCT.md#18-gateway-file-service"

[given]
wrong_token_attempts = 6
lockout_after = 5

[when]
command = "cargo run --quiet -p nexus-web-gateway --example gateway_file_contract -- --case auth-throttle --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "case"
equals = "auth-throttle"

[[expect]]
field = "first_denial_code"
equals = "AUTH_DENIED"

# 第 6 次已进锁定态，不再是普通拒绝
[[expect]]
field = "sixth_attempt_code"
equals = "THROTTLED"

[[expect]]
field = "locked_after_attempts"
equals = 6

# 节流状态有界：不随伪造会话数线性增长。口径要看准（评审 r7 §3.3）：探针读的
# `throttle_buckets()` 是**按窗口过滤后的存活行**，不是底层 HashMap 的物理行数；
# 物理行上界由 `record_failure` 的准入行门禁保证，不在本条射程内（那一类由单测
# `expired_locks_are_reclaimed_instead_of_escalating_to_the_global_window` 钉）。
# 杀伤力仍在：把门禁删掉 ⇒ 3073 条存活行 > 1024 ⇒ 红；写成 `>` 的 off-by-one ⇒ 1025 > 1024 ⇒ 也红。
[[expect]]
field = "throttle_entries_bounded"
equals = true

# 正确口令在锁定窗口内也不能绕过
[[expect]]
field = "correct_token_bypasses_lockout"
equals = false

# 评审 r2 NEW-3：节流表被伪造量填满时必须 fail-closed（旧实现只累加私有计数、
# 从不写 locked，令牌比对继续做 ⇒ 轮换 principal 就能买无限次猜测）。
[[expect]]
field = "throttle_full_fail_closed"
equals = true

# 同一判据在产品尺寸的引擎（max_throttle_buckets=1024）上也成立，不只是小表夹具
[[expect]]
field = "product_engine_fails_closed_when_flooded"
equals = true

# 评审 r6 NOTE-4 的裁决：节流键是身份摘要而不是裁剪后的标签。夹具是"同一 128 字节
# 前缀 + 同一总长"的两个身份——旧写法下它们共用一个桶，于是伪造者用 `base+"bbbb"`
# 的 5 条失败就能把一个从未出错的合法主体锁在门外（不需要淹没任何东西的定向锁定）。
[[expect]]
field = "throttle_identity_prefixes_are_separate_buckets"
equals = true

[[expect]]
field = "victim_code_after_forged_prefix"
equals = "ACCEPTED"

# R4-W-6 的裁决：桶按窗口衰减。`flood_armed_before_quiet_window` 的作用**不是**防空转
# （下一条的合成式第一项就是它，r7 R7-N-4 纠正了我上一片的说法），而是让读者能把
# "从未武装"和"武装过又自愈"两种世界分开——只有本条为 true 时下一条才构成"自愈"证据。
[[expect]]
field = "flood_armed_before_quiet_window"
equals = true

[[expect]]
field = "throttle_flood_self_heals_after_quiet_window"
equals = true

# 评审 r7 R7-W-2 → r8 R8-W-2 的落点：会话拆除既不清已武装的锁定，也不清失败计数。
# 射程要写准：本字段只观测**锁定**有没有被拆除抹掉，所以它打得住最早那版 `forget`
# （连锁一起删 ⇒ 这里回 ACCEPTED ⇒ 红），打不住中间那版"清计数不删锁"（锁还在 ⇒
# 本字段仍 true）；后者由单测 `session_teardown_touches_no_throttle_state` 的 (a) 半打。
[[expect]]
field = "lock_survives_session_teardown"
equals = true

[[expect]]
field = "code_after_teardown"
equals = "THROTTLED"

# r7 R7-N-6：长度前缀这条性质原先只有 1 根柱子且在单测里，契约面零期望。
# ("ab","c") 与 ("a","bc") 在无长度前缀的拼接摘要下是同一段字节 ⇒ 后者被前者连坐。
[[expect]]
field = "throttle_pair_concatenation_is_separate"
equals = true

# 不同源不受同一身份的失败牵连（r7 R7-N-5：这条在单测里有两根柱子，但契约面原先
# 零期望；变异"摘要少喂 source 半"在冻结期望上只打得中这一条 ⇒ 现在它是柱子）。
[[expect]]
field = "other_source_still_admitted"
equals = true

# r7 R7-W-1：桶衰减的**聚合侧**代价必须在产品路径上可红——8 行 × 每行
# (lockout_after-1) 条失败 × 3 轮、轮间静置 1.5 个窗口、全程新身份：有衰减时 48 条
# 全 AUTH_DENIED 且零武装；把桶回收改掉（变异 N6）之后行永不空，第 2、3 轮的新身份
# 拿不到行 ⇒ 走溢出计数，每轮白送 2 条 AUTH_DENIED、第 3 条武装全局窗口、其余被短路
# ⇒ 实测 20 拒绝 / 28 锁定 ⇒ 本条红。（机制与数字都由 r8 复核订正：原先写的
# "计数粘住、每行第一条推到阈值、约 16 条"两者皆非。）
# 这条量的是"可记录失败的额度"，不是墙上时钟速率；速率表达式与数值在 MODULE G15。
[[expect]]
field = "throttle_sustainable_failure_budget"
equals = true

# r7 整改清单第 3 条 / r8 R7-N-9：键是按 (主体,源) 对的，所以一个源地址本来可以替
# 任意多个自己并不拥有的主体把整张表的额度池花光。这道限额锁的是**这个地址**：
# 产品尺寸引擎上，一个地址狂灌 2048 条失败也占不满 1024 行，且不会牵连别的地址、
# 也不升级为全体 fail-closed（表满那条大路仍由上面的轮换地址案例证明可达）。
[[expect]]
field = "single_address_cannot_fill_the_table"
equals = true

# 同一道限额在小夹具上的正面观测：6 条失败花完一个地址的额度 ⇒ 只有 1 道源锁、
# 第 6 条报 THROTTLED、同地址的新主体被拒、别的地址照常放行。
[[expect]]
field = "throttle_per_source_budget_scoped_to_address"
equals = true

# r8 R8-W-2 的根因这一半：`close_session` 必须出示与会话相同的传输地址。拒绝时
# 会话还在、别人的 `.part` 还在、预算没被释放，且审计行与"id 不存在"同形
# （否则这条入口自己就是会话枚举的 oracle）。
[[expect]]
field = "foreign_close_refused_and_session_survives"
equals = true

# r1 起挂着的残余现在有了对象：可比较的尝试恰好 +1，锁定短路掉的尝试 +0。
[[expect]]
field = "token_comparisons_short_circuit_when_locked"
equals = true

# r9 R9-N-2：契约里"未知 id 与不属于自己的 id 逐字同形"这句原先**只**由返回值与
# `.part`/会话状态观测，审计面零对象 ⇒ 变异 P5（把审计行写在把会话 insert 回去**之后**，
# 于是 principal 被 record() 回查补成受害者主体名）在 99 条期望上零红。本条读的是
# 两行审计的 action/principal/root/result_code 四格全等且为空 principal、码为 NOT_FOUND。
[[expect]]
field = "foreign_close_audit_shape_is_indistinguishable"
equals = true

# r9 R9-W-2：源锁表原先没有插入门禁，而"账本满 ⇒ 陌生地址第一条就锁"恰是最便宜的
# 内存放大（1 次请求换 1 条表项）。本条同时钉两件事：账本满时陌生地址第一条被锁，
# 以及锁表满时**升级为全局窗口**而不是继续吃表项（`throttle_source_locks()` 仍 ≤ 上界）。
[[expect]]
field = "unknown_source_locked_on_first_failure_when_ledger_full"
equals = true

# r9 R9-W-1：空传输地址若在比较之后才被节流器拒，它就已经用掉一次比较、并在三张以地址
# 为键的表里（归属、单源额度、per-peer 配额）留下一个**退化键**。本条钉的是"短路发生在
# 比较之前"：码为 AUTH_DENIED、比较计数不增、源账本与两层键表都不长。变异 P8（去掉
# `authenticate` 里那道空地址守卫）在本批第一次复测时只有 1 条单测红、契约面零对象，
# 这条期望就是补上的那个对象。
[[expect]]
field = "empty_source_is_refused_before_the_throttle"
equals = true

# r10 R10-N-4：r9 R9-W-1 的处方尾巴（"同一地址两种表示"的退化）在机验面上仍是零对象——
# 全部夹具都用同形字符串。本条把**后果**钉成契约：裸 IPv6 与带方括号+端口各拿一份单源额度
# （两道源锁、账本归零），锁定期内正确令牌也被拒。这不是给归一化背书：将来谁做了归一化，
# 这条会红，G16/PRODUCT/REQ-010 里"引擎不归一化地址"那句必须同步改。
[[expect]]
field = "address_representation_drift_splits_the_source_budget"
equals = true

# r12 R12-W-1：上一条钉的是**机制**（同一摘要键吃不吃地址），这一条钉**数量**——同一 principal
# 用两种写法 ⇒ 落在两个桶 ⇒ pair 侧门槛翻倍。两格必须一起读：交替喂 2×(lockout_after-1) 条
# **不该**武装（左），同总量的单一写法**必须**已武装（右）。若把 identity_key 里喂 source 的那
# 半去掉（"整半不吃"配方），两写法并进同一桶 ⇒ 左格当场红——这就是本条的红对象。
[[expect]]
field = "pair_threshold_doubles_across_address_spellings"
equals = true
