schema_version = 1
id = "product.pipeline-qos"
title = "数据面管线：QoS 令牌桶在隧道出向真实生效（注入逻辑时钟确定性推进）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-dataplane-pipeline"
carrier = "v9-connectivity"

[given]
egress_max_bytes_per_sec = 1000
egress_burst = 1000

[when]
command = "cargo run --quiet -p nexus --example pipeline_qos -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "pipeline-qos"

# t=0 满桶 1000：首包 1000 字节放行
[[expect]]
field = "first_send_allowed"
equals = true

# t=0 令牌已耗尽：再发 200 字节被丢弃
[[expect]]
field = "overflow_send_dropped"
equals = true

# 时钟推进到 1s 后令牌补足：再发 500 字节放行
[[expect]]
field = "after_refill_allowed"
equals = true

# 管线侧记录丢弃字节数 = 200
[[expect]]
field = "qos_dropped_bytes"
equals = 200
