schema_version = 1
id = "product.proxy-transport-trojan-tls"
title = "ProxyTransport：Trojan over TLS（T7）"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#3.5"
carrier = "n1-fabric"

[given]
topology = "self-built minimal trojan-over-TLS server (rcgen self-signed cert, rustls server; parse_request, AuthDenied closes); client does TLS handshake + trojan handshake inside TLS, sends 64KB in 1KB frames, server echoes (T7)"
payload_stream = "64KB deterministic bytes in 1KB frames"

# 可执行 E4：自研最小 trojan-over-TLS server（rcgen 自签证书→rustls
# ServerConfig；客户端 skip-verify；读请求头→parse_request→AuthDenied 则关闭→
# TLS 内回显 2 字节帧）→ 客户端经 TLS trojan 发送 64KB 并校验回显 →
# 输出 stats JSON，断言 proxy_relayed_bytes > 0（T7/T6）且 tls_handshake_ok == 1。
#
# 注：完整 QUIC-over-TLS-trojan（类似明文 T2 E4）后置；本 E4 验证 TLS 握手 +
# trojan 握手 + 双向数据路径。TlsTrojanTransport 已实现 UdpTransport，
# QUIC 集成是 drop-in。
[when]
command = "cargo run --quiet -p nexus-proxy-transport --example proxy_trojan_tls_quic -- --json"

# 冻结期望（T7/T6）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "roundtrip_ok"
equals = true

# 64KB 必须完整走 TLS trojan 隧道（relayed 字节数被实测到）。
[[expect]]
field = "proxy_relayed_bytes"
non_empty = true

# TLS 确实发生了：握手完成计数必须为 1（T7）。
[[expect]]
field = "tls_handshake_ok"
equals = 1
