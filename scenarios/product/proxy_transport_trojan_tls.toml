schema_version = 1
id = "product.proxy-transport-trojan-tls"
title = "ProxyTransport：QUIC over Trojan over TLS（T7）"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#3.5"

[given]
topology = "self-built minimal trojan-over-TLS server (rcgen self-signed cert, rustls server; parse_request, AuthDenied closes); A dials B via TLS trojan handshake; QUIC over length-prefixed TCP inside TLS (T7)"
payload_stream = "64KB deterministic bytes"

# 可执行 E4：自研最小 trojan-over-TLS server（rcgen 自签证书→rustls
# ServerConfig；客户端用 pinned cert 或 skip-verify；读请求头→parse_request→
# AuthDenied 则关闭→TLS 内双向中继到 B）→ A 经 TLS trojan 建 QUIC 到 B →
# 64KB 回显并校验完整 → 输出 stats JSON，断言 proxy_relayed_bytes > 0（T7/T6）
# 且 QUIC 载荷对代理仍是密文（X2；TLS 加密的是传输层，QUIC 载荷 E2E 密文不变）。
[when]
command = "cargo run --quiet -p nexus-proxy-transport --example proxy_trojan_tls_quic -- --json"

# 冻结期望（T7/T6）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "roundtrip_ok"
equals = true

# 64KB 必须完整走 TLS trojan 隧道（relayed 字节数被实测到）。
[[expect]]
field = "proxy_relayed_bytes"
non_empty = true

# 代理看到的 QUIC 载荷是密文：明文载荷匹配次数必须为 0（X2）。
[[expect]]
field = "proxy_saw_plaintext_bytes"
equals = 0

# TLS 确实发生了：握手完成计数必须为 1（T7）。
[[expect]]
field = "tls_handshake_ok"
equals = 1
