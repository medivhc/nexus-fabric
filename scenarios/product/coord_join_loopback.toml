schema_version = 1
id = "product.coord-join-loopback"
title = "协调全链路（E5）：loopback TCP 注册→领号→拉取→建连→互通"
evidence_strength = "E5"
requirement = "PRODUCT.md#12-13-P2.3+P2.4-广域协调核心-自动-IP-分配"

[given]
subnet_cidr = "10.99.0.0/24"
coordinator_endpoint = "127.0.0.1:<random-port>"

# 可执行 E5（真实 loopback TCP + 真实数据面，独立外部观察）：
# 双节点经 127.0.0.1 协调器：announce(peer_id, locator, ttl) →
# allocate（领号）→ peer_list（获得对端动态 locator + vip）→
# 构建 VirtualSubnetTunnel（vip 作本机虚拟 IP，对端 vip+locator add_peer）→
# A→B 与 B→A 双向 IP 包互通（wire 明文，未加密路径留 P3 组合）。
[when]
command = "cargo run --quiet -p nexus --example coord_join_loopback -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "coord join loopback"

[[expect]]
field = "coordinator.listened_loopback"
equals = true

[[expect]]
field = "join.a_allocated_vip"
equals = "10.99.0.1"

[[expect]]
field = "join.b_allocated_vip"
equals = "10.99.0.2"

[[expect]]
field = "join.a_learned_peer_b_locator"
non_empty = true

[[expect]]
field = "join.b_learned_peer_a_locator"
non_empty = true

[[expect]]
field = "join.a_learned_peer_b_vip"
equals = "10.99.0.2"

[[expect]]
field = "join.b_learned_peer_a_vip"
equals = "10.99.0.1"

[[expect]]
field = "join.a_to_b_delivered"
equals = true

[[expect]]
field = "join.b_to_a_delivered"
equals = true

[[expect]]
field = "join.peer_ids_stable"
equals = true
