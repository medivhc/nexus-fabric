schema_version = 1
id = "product.path-fallback-skip"
title = "Fallback 诚实跳过：无代理/TURN 配置时链退化为纯直连，跳过计数可观测"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#3.5"
carrier = "n1-fabric"

[given]
topology = "任意 loopback 可用的环境（无真机依赖）；TCP echo 服务在 127.0.0.1（example 内建）"
chain = "FallbackConfig { proxy: None, turn: None } → 展开为 [Direct]；proxy/turn 跳过并计数（F4）"
connector = "example 内建：Direct 对 127.0.0.1 echo 服务做 TCP 建连 + roundtrip"

# 可执行 E4：无配置 → fallback 链只有 Direct；直连建连成功，数据走通；
# proxy/turn 跳过计数 = 1（各一次），不报错、不重试。
# 断言：候选列表只有 direct；跳过集合为 proxy,turn；roundtrip 走通（F6 零回归）。
[when]
command = "cargo run --quiet -p nexus-path --example path_fallback_skip -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

# F6：无配置时行为 ≡ 纯直连。
[[expect]]
field = "fallback.candidate_kinds"
equals = "direct"

# F4：缺配置的级别诚实跳过并计数。
[[expect]]
field = "fallback.skipped_kinds"
equals = "proxy,turn"

[[expect]]
field = "fallback.roundtrip_ok"
equals = true
