schema_version = 1
id = "product.dataplane-unified"
title = "统一数据面装配：TUN→分类→DNS→QoS→转发全链路（E4）"
evidence_strength = "E4"
requirement = "DAEMON_ARCHITECTURE.md#6"
carrier = "n1-fabric"

[given]
# 可执行 E4（example dataplane_unified --json，进程内闭环，mock TUN）：
# - mock_tun：内存 channel 模拟 TUN，注入包 → dataplane 读取；
# - classify_mesh：目的 IP 在 mesh CIDR → Mesh 分类，mesh_forwarded 计数+1；
# - classify_proxy：目的 IP 在 fake-IP 池 → Proxy 分类，proxy_forwarded 计数+1；
# - classify_direct：目的 IP 在 bypass → Direct 分类，direct_forwarded 计数+1；
# - classify_drop：非 IPv4 包 → Drop 分类，通用 dropped 不增（AC10：0x86DD 只进 ipv6.*）；
# - dns_intercept：UDP dport 53 → DNS 服务（单 owner 线程），dns_answered 计数+1，
#   且 mock TUN 收到 DNS 响应包（源端口 53）；tick 有界直到回包 drain。
# - qos_passthrough：[qos] 禁用时，包直通无整形（qos_bypassed=true）。

[when]
command = "cargo run --quiet -p nexusd --example dataplane_unified -- --json"

[[expect]]
field = "dataplane.mesh_forwarded"
equals = 1

[[expect]]
field = "dataplane.proxy_forwarded"
equals = 1

[[expect]]
field = "dataplane.direct_forwarded"
equals = 1

[[expect]]
field = "dataplane.dropped"
equals = 0

# MSR-r3-plan-ruling-20261028 Q-1 / plan §9 Q-1：注入的 40B 0x86DD 包
# （next_header=0x60 非 6/17 → 不建 flow、按目的分类；dst 非 mesh/bypass → Proxy）。
# 依赖 C18（WP-V6-A）落地 ipv6.* 计数器后才可 PASS。
[[expect]]
field = "dataplane.ipv6.packets"
equals = 1

[[expect]]
field = "dataplane.ipv6.classified_proxy"
equals = 1

[[expect]]
field = "dataplane.ipv6.proxy_dropped"
equals = 1

[[expect]]
field = "dataplane.dns_answered"
equals = 1

[[expect]]
field = "dataplane.dns_response_received"
equals = true

[[expect]]
field = "dataplane.qos_bypassed"
equals = true
