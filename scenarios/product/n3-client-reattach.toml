schema_version = 1
id = "product.n3-client-reattach"
title = "CLI 退出与 Session 断开不结束远端 Task"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "启动长命令，终止请求方 CLI/连接，重开后按 TaskId 从保存的日志 offset 续读。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- client-reattach"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "before.observation"
equals = "PendingVerification"

[[expect]]
field = "after.task_id"
non_empty = true

[[expect]]
field = "after.outcome"
equals = "Completed"

[[expect]]
field = "observed.same_task_id"
equals = true

[[expect]]
field = "observed.command_start_count"
equals = 1

[[expect]]
field = "observed.logs_resumed_at_offset"
equals = true
