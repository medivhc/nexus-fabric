schema_version = 1
id = "product.node-disjoint"
title = "点不交路径：两条除端点外无共享节点"
evidence_strength = "E4"
requirement = "PRODUCT.md#12.55-node-disjoint"

[given]
topology = "diamond: A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms)"
algorithm = "node splitting (v -> v_in -> v_out) + Suurballe edge-disjoint on split graph"
api = "NodeDisjoint::new().compute_paths(topo, src, dst)"

# 可执行 E4：点不交验证
#   two_paths_found    得 2 条路径
#   no_shared_mid_nodes  除 src/dst 外无共享节点
[when]
command = "cargo run --quiet -p nexus --example node_disjoint -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "two_paths_found"

[[expect]]
field = "events.1"
equals = "no_shared_mid_nodes"

[[expect]]
field = "node_disjoint.path_count"
equals = 2
