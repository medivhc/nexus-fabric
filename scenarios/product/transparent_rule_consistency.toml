schema_version = 1
id = "product.transparent-rule-consistency"
title = "同一规则/目的地：TUN 分类与 TPROXY 决策一致（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-tun-transparent-inbound"

[given]
# 可执行 E4（example transparent_rule_consistency --json）：同一 DomainRuleEngine、
# 同一 IPv4/TCP 目的地分别走 PacketClassifier（TUN）与 explain（TPROXY）。

[when]
command = "cargo run --quiet -p nexusd --example transparent_rule_consistency -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "matched_rule"
equals = "proxy-cidr"

[[expect]]
field = "selected_outbound"
equals = "p1"

[[expect]]
field = "egress_hint"
equals = "p1"

[[expect]]
field = "provider_count"
equals = 1

[[expect]]
field = "tun.selected_outbound"
equals = "p1"

[[expect]]
field = "tproxy.selected_outbound"
equals = "p1"

[[expect]]
field = "tun.matched_rule"
equals = "proxy-cidr"

[[expect]]
field = "tproxy.matched_rule"
equals = "proxy-cidr"
