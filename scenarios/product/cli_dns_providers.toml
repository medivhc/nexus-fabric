schema_version = 1
id = "product.cli-dns-providers"
title = "nexus CLI 前端：dns providers 接线到 observability 快照（--json）"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "dns providers ready (upstream addrs + exit rules + server routing)"
cli_frontend = "nexus CLI 前端把全部 17 个观察命令接线到同一 observability 快照"

[when]
command = "cargo run --quiet -p nexus -- dns providers --json"

# 冻结期望：CLI 前端此前对该命令返回 UNSUPPORTED；现输出上游/规则/服务器路由清单。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "dns providers"

[[expect]]
field = "upstream_addrs.0"
non_empty = true

[[expect]]
field = "exit_rules.0"
non_empty = true

[[expect]]
field = "servers.0"
non_empty = true
