schema_version = 1
id = "product.group-isolation"
title = "节点分组隔离：同组互通、跨组默认拒绝与例外规则"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-group-isolation"
carrier = "v9-connectivity"

[given]
mode = "full"
groups = [
  { group_name = "prod", members = ["prod-a", "prod-b"] },
  { group_name = "dev", members = ["dev-a", "dev-b"] },
]
exception = { src_group = "prod", dst_group = "dev" }

[when]
command = "cargo run --quiet -p nexus --example group_isolation -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "group-isolation"

# 同组 prod→prod：Allow
[[expect]]
field = "same_group"
equals = "allow"

# 跨组 prod→dev（默认）：Deny
[[expect]]
field = "cross_group_default"
equals = "deny"

# 登记例外 prod→dev 后 prod→dev：Allow
[[expect]]
field = "cross_group_after_exception"
equals = "allow"

# mode=None：任意节点（含未分配）一律 Allow
[[expect]]
field = "open_mode_allows"
equals = "allow"

# Full 模式下未分配节点：Deny
[[expect]]
field = "unassigned_denied"
equals = "deny"

# 登记的例外条数
[[expect]]
field = "exception_count"
equals = 1

# 空组名构造被拒
[[expect]]
field = "empty_group_rejected"
equals = true

# 把节点划入未声明组被拒
[[expect]]
field = "unknown_group_rejected"
equals = true
