schema_version = 1
id = "product.fabric-projection-basic"
title = "投影层 L3 隧道基本：TUN 包经 fabric 数据报到对端 TUN，字节级一致"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6"
carrier = "n1-fabric"

[given]
topology = "loopback, two Projection instances with MockTun (example binary)"
packets = "100 x IPv4 packets (20B header + variable payload), deterministic"

# 可执行 E4：example 创建双端 Projection（MockTun） ->
# A 端注入 100 个 IP 包 -> 经 fabric 数据报（mock）传到 B 端 ->
# B 端从 TUN 读出 -> 逐包校验字节级一致 -> 输出 JSON。
[when]
command = "cargo run --quiet -p nexus-projection --example basic -- --json"

# 冻结期望（S1/S2/S4/S8）。
[[expect]]
field = "verdict"
equals = "PASS"

# 100 个包全部到达且字节级一致（S1）。
[[expect]]
field = "packets.sent"
equals = 100

[[expect]]
field = "packets.received"
equals = 100

[[expect]]
field = "packets.bytes_match"
equals = true

# 双向对称（S4）：反向也通。
[[expect]]
field = "reverse.bytes_match"
equals = true

# 统计诚实（S8）。
[[expect]]
field = "stats.packets_out"
equals = 100

[[expect]]
field = "stats.packets_in"
equals = 100
