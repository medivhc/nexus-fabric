schema_version = 1
id = "product.bandwidth-qos"
title = "带宽控制 / QoS 令牌桶限流（初始突发 + 平均速率整形 + 按连接统计）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-bandwidth-qos"
carrier = "v9-connectivity"

[given]
rate_bps = 1000
burst_bytes = 1000
clock = "injectable fake clock (explicit Duration; no sleep, no tokio)"
connections = ["conn-a", "conn-b"]

[when]
command = "nexus-harness run bandwidth-qos --json"

# (a) 初始突发 burst_size 字节放行
[[expect]]
field = "burst_allowed"
equals = true

# (b) 突发耗尽后同刻持续发送超过平均速率 -> 后续包被拒
[[expect]]
field = "excess_after_burst_rejected"
equals = true

# (c) 推进时钟 1 秒后令牌恢复，又可发送
[[expect]]
field = "recovered_after_second"
equals = true

# (d) 两个连接独立统计：conn-a up=1000(突发)+500(恢复后)=1500；conn-b up=300，互不影响
[[expect]]
field = "connections.conn_a_up_bytes"
equals = 1500

[[expect]]
field = "connections.conn_b_up_bytes"
equals = 300

# (e) 聚合统计：放行 1000+500+300=1800；被拒 100 计入 dropped 而非 allowed
[[expect]]
field = "bytes_allowed"
equals = 1800

[[expect]]
field = "bytes_dropped"
equals = 100
