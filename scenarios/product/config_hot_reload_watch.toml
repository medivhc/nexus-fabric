schema_version = 1
id = "product.config-hot-reload-watch"
title = "配置热加载真实文件轮询：临时文件修改驱动 revision 前进"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-config-hot-reload-real"

[given]
watch_interval_ms = 50
validate_before_apply = true

[when]
command = "cargo run --quiet -p nexus --example config_hot_reload_watch -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "config-hot-reload-watch"

# 首次 poll 为基线，不报变化
[[expect]]
field = "first_poll_changed"
equals = false

# 修改后 poll 检测到变化 → revision 前进到 1
[[expect]]
field = "after_edit1_changed"
equals = true

[[expect]]
field = "revision1"
equals = 1

# 再次修改 → revision 前进到 2
[[expect]]
field = "after_edit2_changed"
equals = true

[[expect]]
field = "revision2"
equals = 2

# 临时文件用完即删
[[expect]]
field = "temp_file_removed"
equals = true
