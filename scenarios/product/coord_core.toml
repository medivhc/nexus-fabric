schema_version = 1
id = "product.coord-core"
title = "协调核心：自动 IP 分配器 + 协调器纯函数 + 帧编解码（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-10-P2.3+P2.4-广域协调核心-自动-IP-分配"

[given]
subnet_cidr = "10.99.0.0/24"
node_a_peer = "peer-aaaa"
node_b_peer = "peer-bbbb"
node_c_peer = "peer-cccc"

# 可执行 E4（纯函数，显式 now 注入，确定性）：
# - 分配器：顺序分配（a=10.99.0.2, b=10.99.0.3）；同 peer 重复领号幂等；
#   显式保留冲突（c 抢 b 的 IP → NACK）；释放后复用（b 释放 → c 领到原 IP）；
#   小 CIDR 耗尽 → NoAddressAvailable。
# - 协调器：announce → peer_list 未过期；TTL 过期后 resolve → Expired；
#   未 announce → Unknown。
# - 帧编解码：全变体 roundtrip。
[when]
command = "cargo run --quiet -p nexus --example coord_core -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "coord core"

[[expect]]
field = "allocator.a_vip"
equals = "10.99.0.1"

[[expect]]
field = "allocator.b_vip"
equals = "10.99.0.2"

[[expect]]
field = "allocator.re_allocate_same_peer"
equals = "10.99.0.1"

[[expect]]
field = "allocator.specific_conflict"
equals = "AddressInUse"

[[expect]]
field = "allocator.released_reused"
equals = "10.99.0.2"

[[expect]]
field = "allocator.exhausted"
equals = "NoAddressAvailable"

[[expect]]
field = "coordinator.peer_list_count"
equals = 2

[[expect]]
field = "coordinator.expired_peer"
equals = "Expired"

[[expect]]
field = "coordinator.unknown_peer"
equals = "Unknown"

[[expect]]
field = "frames.roundtrip_ok"
equals = true
