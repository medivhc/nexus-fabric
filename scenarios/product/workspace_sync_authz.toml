schema_version = 1
id = "product.workspace-sync-authz"
title = "serve_sync 成员授权：非成员被明确拒绝，不泄露数据"
evidence_strength = "E4"
requirement = "白皮书 §成员与策略权威 + C2-D4（serve_sync 前置成员授权；第一版静态成员列表；未授权返回明确拒绝帧）"
carrier = "n1-fabric"

[given]
description = "B 端 workspace 配置静态成员列表（含 A 的 PeerId，不含 E）；E 建立 fabric 连接（传输层认证通过）后发起 sync；A 发起 sync 作为对照"

[when]
command = "cargo run --quiet -p nexusd --example workspace_sync_e4 -- --scenario authz --json"

# 冻结期望：
# - 非成员 E 的 sync 被明确拒绝（REJECTED 帧，reason 含 not-a-member）；
# - 拒绝发生在任何 commit/object 发送之前（零数据泄露）；
# - 拒绝被审计日志记录；
# - 成员 A 的 sync 正常通过（对照组）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "authz.nonmember_rejected"
equals = true

[[expect]]
field = "authz.reject_reason"
equals = "not-a-member"

[[expect]]
field = "authz.zero_bytes_leaked"
equals = true

[[expect]]
field = "authz.rejection_audited"
equals = true

[[expect]]
field = "authz.member_sync_ok"
equals = true
