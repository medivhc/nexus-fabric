schema_version = 1
id = "product.proxy-outbound-trojan-flow"
title = "节点加密出站数据面：SOCKS5 会话经 Trojan(TLS) 隧道出站（loopback trojan 节点 + echo 目标）"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"
carrier = "v9-connectivity"

[given]
topology = "same-process loopback 127.0.0.1: echo target + local trojan TLS node (rcgen self-signed) + nexus proxy (outbound=trojan-node) + raw SOCKS5 client"
crypto = "rustls ClientConnection skip-cert-verify (skip_cert_verify=true), SNI=localhost, password=demo, trojan header standard"
offline = "no public network; std::net::TcpStream + threads, joined"

# 可执行 E4：nexus proxy 数据面（PRODUCT §11.16）配置 outbound=trojan 指向本地
# trojan TLS 节点；原始 SOCKS5 客户端经 proxy 访问 loopback echo。断言：trojan 节点实际
# 收到 TLS 连接（trojan_server.connected）、request header 目标送达、payload 经 TLS 隧道
# 往返、routing.selected_outbound_tag=trojan-node、routing.outbound_kind=trojan。
# 旧实现（trojan 仍走 ConnectivityEstablishmentFailed 兜底）下 proxy 直接结构化失败 ->
# verdict FAIL（Red Evidence）。
[when]
command = "cargo run --quiet -p nexus --example proxy_outbound_trojan_flow -- --json"

# 冻结期望（Spec-Freeze）：
# 节点型出站必须真实建连、完成 TLS 握手与 trojan 请求头、透明中继（不是直连伪装，
# 也不是静默兜底失败）。direct / shadowsocks 行为由既有场景独立覆盖，本节不改动。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "trojan_server.connected"
equals = true

[[expect]]
field = "trojan_server.target_delivered_ok"
equals = true

[[expect]]
field = "client.auth_ok"
equals = true

[[expect]]
field = "client.connect_ok"
equals = true

[[expect]]
field = "client.payload_roundtrip_ok"
equals = true

[[expect]]
field = "routing.selected_outbound_tag"
equals = "trojan-node"

[[expect]]
field = "routing.outbound_kind"
equals = "trojan"

[[expect]]
field = "bytes.to_upstream"
non_empty = true

[[expect]]
field = "bytes.to_client"
non_empty = true
