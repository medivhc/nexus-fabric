schema_version = 1
id = "product.plugin-obfs-echo"
title = "混淆插件机制：TCP 回显穿过 xor 插件，线字节被混淆且语义正确"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#7"

[given]
topology = "TCP echo server on 127.0.0.1:0 (xc-pc-linux, real TCP loopback); client wraps with xor plugin from PluginRegistry"
packets = "deterministic: client sends N=65536 bytes through wrapped stream; server reads raw wire bytes, then wraps and echoes"

# 可执行 E4：example 在真机跑：
# - registry = PluginRegistry::new()；builtin::register_all(&mut registry)
#   （注册 plain + xor；断言 names() == ["plain","xor"]）
# - server: TcpListener::bind(127.0.0.1:0)；accept 得 raw 流；
#   先从 raw 流读 N 字节 W，断言 W != 明文 P（混淆在线上生效）；
#   再用 xor 插件 wrap 该流，回显收到的解密内容。
# - client: TcpStream::connect(server_addr)；registry.get("xor").wrap(stream, params{key})；
#   发 P（N 字节确定性内容）；经 wrapped 流读回显 E；断言 E == P。
# - 只用公开 API + 可观测输出，无"上帝之手"。
# - TCP loopback 不可用（沙箱）→ {"verdict":"SKIP","reason":"..."}，exit 0。
# PASS 路径的字段由实现者在真机上验证；本 scenario 只门禁"不 FAIL"。
[when]
command = "cargo run --quiet -p nexus-plugin --example obfs_echo -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
one_of = ["PASS", "SKIP"]
