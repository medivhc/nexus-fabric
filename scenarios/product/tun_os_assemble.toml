schema_version = 1
id = "product.tun-os-assemble"
title = "TUN OsAssemble：干跑计划、默认路由与排除项（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-tun-transparent-inbound"
carrier = "n1-fabric"

[given]
# 可执行 E4（example tun_os_assemble --json）：dry_run=true，零 netlink 写；
# 真机 apply/cleanup 由 E5 S4/S7 覆盖。

[when]
command = "cargo run --quiet -p nexusd --example tun_os_assemble -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "os_assemble.state"
equals = "applied"

[[expect]]
field = "os_assemble.default_route"
equals = true

[[expect]]
field = "os_assemble.excludes"
equals = 1

[[expect]]
field = "os_assemble.dry_run"
equals = true
