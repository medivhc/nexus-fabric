schema_version = 1
id = "product.geoip-source-ip2region"
title = "ip2region TXT 源插件：样本 → geoip.nex → roundtrip 解析断言"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
command = "geoip source ip2region"
input_format = "ip2region TXT lines: start_ip|end_ip|country|province|city|isp"
network = "none (offline)"

# 可执行 E4：example 内置确定性 ip2region 样本（中国 1.0.1.0-1.0.3.255、
# 美国 8.8.8.8/32、国家为 0 的跳过行），经 geoip_sources::parse_ip2region_txt
# → geoip_nex::build 生成 → geoip_nex::parse 回读；断言 CN/US 的 CIDR 数量与
# 内容、skipped 计数（roundtrip 完整性，离线确定性）。
[when]
command = "cargo run --quiet -p nexus --example geoip_source_ip2region -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "geoip source ip2region"

[[expect]]
field = "parsed_cn_cidrs"
equals = 2

[[expect]]
field = "parsed_us_cidrs"
equals = 1

[[expect]]
field = "skipped"
equals = 1

[[expect]]
field = "cn_first_cidr"
equals = "1.0.1.0/24"
