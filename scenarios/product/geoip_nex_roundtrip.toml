schema_version = 1
id = "product.geoip-nex-roundtrip"
title = "geoip.nex 二进制格式 roundtrip：构造 → 解析 → 注入 → 路由断言"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
command = "geoip.nex format roundtrip"
format = "magic NXGEOIP\\0 + u32 count + code(2) + cidr_count(4) + base(4)*n + prefix(1)*n"
network = "none (offline)"

# 可执行 E4：example 在内存按 §11.12 格式 v1 构造 geoip.nex 字节（CN/US），
# 经 nexus-proxy::geoip_nex::parse 解析为 RuleData.geoip，注入 RuleEngine：
# CN IP 命中 geoip 规则、US IP 与域名走 MATCH；并断言解析出的 CIDR 数与
# 输入一致（roundtrip 完整性）。
[when]
command = "cargo run --quiet -p nexus --example geoip_nex_roundtrip -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "geoip.nex roundtrip"

[[expect]]
field = "case_cn.matched_rule"
equals = "rule-geoip-cn"

[[expect]]
field = "case_cn.rule_kind"
equals = "geoip"

[[expect]]
field = "case_us.matched_rule"
equals = "rule-match"

[[expect]]
field = "case_domain.matched_rule"
equals = "rule-match"

[[expect]]
field = "parsed_cn_cidrs"
equals = 2

[[expect]]
field = "parsed_us_cidrs"
equals = 1
