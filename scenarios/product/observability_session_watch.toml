schema_version = 1
id = "product.observability-session-watch"
title = "§9 可观察性：session watch 输出 Session 双轨状态（phase/outcome/committed）"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
dual_track = "LifecyclePhase + TerminalOutcome"
sessions = "sess-1(active/completed) sess-2(disposed/failed) sess-3(allocating/unfinished)"

[when]
# CLI 统一重构（01e5114）后观察命令走 daemon LocalAPI；harness 不负责起 daemon，
# 故用 localapi_probe 自包含起临时 daemon 查一次（等价于旧 `nexusd <cmd> --json` 进程内快照）。
command = "cargo run --quiet -p nexusd --example localapi_probe -- --path /localapi/v0/session/watch"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "sessions"
non_empty = true

[[expect]]
field = "sessions.1.outcome"
equals = "failed"

[[expect]]
field = "sessions.2.phase"
equals = "allocating"
