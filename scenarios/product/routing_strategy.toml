schema_version = 1
id = "product.routing-strategy"
title = "[routing] strategy 配置装配：策略枚举 + PathComputer 委托"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-routing-strategy"
carrier = "v9-connectivity"

[given]
config = "[routing] strategy = shortest|ecmp (default shortest); unknown -> CONFIG_ERROR"
api = "RoutingStrategy::parse; impl PathComputer for RoutingStrategy (static dispatch)"
topology = "diamond: A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms); A->D has two 20ms equal-cost paths"

# 可执行 E4：策略解析 + 装配 + 算路
#   parse_ok             "ecmp"/"ECMP"/" shortest " 解析正确
#   parse_err            "k-shortest" 返回 Err
#   strategy_computes    RoutingStrategy::Ecmp 在菱形拓扑上算出 2 条路径，FIB 得 2 条 NextHop
#   strategy_default     缺省配置 -> Shortest，A->D 只有 1 条 NextHop
#   config_toml          含 [routing] strategy="ecmp" 的 TOML 解析出 Ecmp
[when]
command = "cargo run --quiet -p nexus --example routing_strategy -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "parse_ok"

[[expect]]
field = "events.1"
equals = "parse_err"

[[expect]]
field = "events.2"
equals = "strategy_computes"

[[expect]]
field = "events.3"
equals = "strategy_default"

[[expect]]
field = "events.4"
equals = "config_toml"

[[expect]]
field = "strategy.ecmp_next_hops"
equals = 2

[[expect]]
field = "strategy.default_next_hops"
equals = 1
