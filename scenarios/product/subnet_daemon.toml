schema_version = 1
id = "product.subnet-daemon"
title = "nexus 托管 subnet：up → status 读回 → leave 生命周期闭环（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-subnet-daemon"
carrier = "v9-connectivity"

[given]
# 可执行 E4（example subnet_daemon --json，进程内 spawn nexus 子进程）：
# - daemon.up_ok：nexus subnet up 装配成功（一次性命令，打完 JSON 即退出）；
# - daemon.status_read_back_vip / peer_count：nexus subnet status 读回字段一致；
# - daemon.file_encrypted：--encrypt-state 状态文件含格式 magic（NEXSEC1/NEXDP1）；
# - daemon.up_after_leave：leave（删状态文件）后 status → DOWN；
# - daemon.proc_exited：子进程正常退出（exit code 0）。

[when]
command = "cargo run --quiet -p nexus --example subnet_daemon -- --json"

[[expect]]
field = "daemon.up_ok"
equals = true

[[expect]]
field = "daemon.status_read_back_vip"
equals = "10.99.0.1"

[[expect]]
field = "daemon.peer_count"
equals = 2

[[expect]]
field = "daemon.file_encrypted"
equals = true

[[expect]]
field = "daemon.up_after_leave"
equals = false

[[expect]]
field = "daemon.proc_exited"
equals = true
