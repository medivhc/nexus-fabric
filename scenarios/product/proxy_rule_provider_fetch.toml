schema_version = 1
id = "product.proxy-rule-provider-fetch"
title = "rule-providers 在线拉取：mock ProviderFetcher 注入三 behavior 规则集"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"
carrier = "v9-connectivity"

[given]
command = "rule-providers url fetch"
provider_fetcher = "mock ProviderFetcher (fixed content, deterministic)"
network = "none (offline)"

# 可执行 E4：组合根以 mock fetcher 提供三个 provider（domain / ipcidr /
# classical），数据经 ProviderFetcher.load 组装 RuleData 注入 RuleEngine；
# 断言三种 behavior 均命中对应 provider 规则、未覆盖流量走 MATCH、且命中
# 来源 source 可观察（local/cached/online 三值之一）。
[when]
command = "cargo run --quiet -p nexus --example proxy_rule_provider_fetch -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "proxy rule-provider fetch"

[[expect]]
field = "case_domain.matched_rule"
equals = "rule-provider-cn-domains"

[[expect]]
field = "case_domain.rule_kind"
equals = "rule_set"

[[expect]]
field = "case_domain.source"
one_of = ["local", "cached", "online"]

[[expect]]
field = "case_cidr.matched_rule"
equals = "rule-provider-cn-nets"

[[expect]]
field = "case_cidr.rule_kind"
equals = "rule_set"

[[expect]]
field = "case_classical.matched_rule"
equals = "rule-provider-ads"

[[expect]]
field = "case_classical.rule_kind"
equals = "rule_set"

[[expect]]
field = "case_miss.matched_rule"
equals = "rule-match"

[[expect]]
field = "case_miss.rule_kind"
equals = "match"
