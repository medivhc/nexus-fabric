schema_version = 1
id = "product.n3-environment-mismatch"
title = "真实环境不符合契约时拒绝启动"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd
carrier = "n1-fabric"

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "请求固定镜像/架构，提供方实际验证结果不匹配；不得忽略 digest 或裸机降级。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- environment-mismatch"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "error.code"
equals = "ENVIRONMENT_MISMATCH"

[[expect]]
field = "observed.command_start_count"
equals = 0

[[expect]]
field = "observed.fallback_provider_count"
equals = 0
