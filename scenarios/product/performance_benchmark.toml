schema_version = 1
id = "product.performance-benchmark"
title = "加密数据面性能基准：AEAD 帧路径 + 隧道数据面吞吐/延迟（E4）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-perf-benchmark"
carrier = "v9-connectivity"

[given]
payload_bytes = 1024
frames = 2000
network = "none (进程内闭环，无真实网络)"

# 可执行 E4（example perf_bench --json）：
# - aead.frame_roundtrip_us：encrypt_frame+decrypt_frame 单帧往返延迟（µs）
# - aead.throughput_mbps：批量加密吞吐（MB/s）
# - tunnel.throughput_mbps：VirtualSubnetTunnel 加密模式端到端吞吐
# - tunnel.roundtrip_us：端到端往返延迟
# - verdict：example 内部按 Performance Budget（PRODUCT §12.36 预算表）比较
#   baseline 阈值输出 PASS/WARN/FAIL（不锁绝对值，避免 CI 噪声 flaky；
#   baseline 首测固化进 evidence）
# 断言：verdict 字段存在且为 PASS/WARN/FAIL 之一；各指标非空且 > 0；
# 单位字段存在；payload/frames 与 given 一致。

[when]
command = "cargo run --quiet -p nexus --example perf_bench -- --json"

[[expect]]
field = "verdict"
one_of = ["PASS", "WARN", "FAIL"]

[[expect]]
field = "aead.frame_roundtrip_us"
non_empty = true

[[expect]]
field = "aead.throughput_mbps"
non_empty = true

[[expect]]
field = "tunnel.throughput_mbps"
non_empty = true

[[expect]]
field = "tunnel.roundtrip_us"
non_empty = true

[[expect]]
field = "params.payload_bytes"
equals = 1024

[[expect]]
field = "params.frames"
equals = 2000
