# E4: TCP 终结接线（GAP-5）
# 场景：TUN 来的 TCP 包经 smoltcp 终结为 stream，按分类送 N1/proxy。
# 冻结契约：apps/nexusd/MODULE.md §TCP 终结接线（S1-S11）

[scenario]
name = "product.tcp-termination-wireup"
description = "TCP SYN→SYN-ACK→ACK→DATA→FIN 全流程：终结 + STREAM 帧分发"
requires_root = true

# T1: Linux 真机。TUN(nexus0, 10.200.0.0/24) 注入 TCP SYN（目的 = mesh CIDR），
# dataplane 应回 SYN-ACK（S1/S2）；完成握手后 Syn 事件 → STREAM SYN 帧被测试
# N1Sender 捕获（S4）；应用数据 → STREAM DATA 帧（S5）；FIN → STREAM FIN（S6）。
[[steps]]
name = "linux_tcp_full_flow"
kind = "real_device"
host = "xc-pc-linux"
assert = [
  "tun_written >= 1",      # SYN-ACK 写回 TUN（S2）
  "tcp_handshakes == 1",   # 握手完成（S4）
  "mesh_tcp_frames >= 3",  # SYN + DATA + FIN 帧（S4/S5/S6）
  "mesh_tcp_bytes > 0",    # 应用数据送达（S5）
]

# T2: 下行方向。测试 N1Sender 捕获的 STREAM 帧经 inject_stream_frame_from_n1
# 回灌 → terminator → TUN 包（S9）。
[[steps]]
name = "downlink_stream_frame"
kind = "unit"
assert = ["tun_written increases after inject_stream_frame_from_n1"]

# T3: Proxy 分类 TCP 只计数，不进 N1（S4/S5 诚实边界，GAP-1）。
[[steps]]
name = "proxy_tcp_counted"
kind = "unit"
assert = ["proxy_tcp_streams == 1", "proxy_tcp_bytes > 0", "mesh_tcp_frames == 0"]

# T4: Direct 分类的 TCP 永不进终结器（S8 零回归）。
[[steps]]
name = "direct_tcp_untouched"
kind = "unit"
assert = ["direct_forwarded == 1", "tcp_handshakes == 0"]

# T5: Windows 真机（wintun）：SYN→SYN-ACK 可达，Mihomo 不受影响。
[[steps]]
name = "windows_tcp_smoke"
kind = "real_device"
host = "win-pc"
assert = ["syn_ack_received", "mihomo_unaffected"]
