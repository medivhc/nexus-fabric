schema_version = 1
id = "product.fabric-tun-device"
title = "真实 TUN 设备：TunRsDevice 创建、读写、关闭"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6.4"

[given]
topology = "single node, real TUN device via tun-rs v2 (Linux, CAP_NET_ADMIN)"
packets = "deterministic: example crafts one IPv4/UDP packet and writes it to the real device"

# 可执行 E4：example 创建 TunRsDevice("nxstun%d", mtu=1500)：
# - 断言 name() 非空且符合内核命名
# - 构造一个 IPv4/UDP 包（10.200.0.1:4000 -> 10.200.0.2:5000, 载荷 "tun-3c"，共 34 字节）
# - write 到设备成功（内核接受，返回完整长度 34）
# - close（Drop）后设备消失
# - 无特权（CAP_NET_ADMIN 缺失）时输出 {"verdict":"SKIP","reason":"..."} 而非 FAIL
# IP 地址分配/路由/DNS 不在范围（P3.x 后置）。
# PASS 路径的字段（name 非空、write_len=34）由实现者在有特权的真机上验证；
# 本 scenario 只门禁"不 FAIL"（无特权环境允许 SKIP）。
[when]
command = "cargo run --quiet -p nexus-projection --example tun_device -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
one_of = ["PASS", "SKIP"]
