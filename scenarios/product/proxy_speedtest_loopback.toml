schema_version = 1
id = "product.proxy-speedtest-loopback"
title = "proxy speedtest 真实 LatencyProbe 对 loopback TCP 服务测速"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"
carrier = "v9-connectivity"

[given]
command = "proxy speedtest"
probe_kind = "tcp"
target = "loopback 127.0.0.1 (local echo listener)"
probe = "real TcpLatencyProbe (std::net::TcpStream::connect_timeout)"
network = "loopback only (deterministic, offline)"

# 可执行 E4：同一进程内起 loopback TCP echo listener，组合根真实
# `TcpLatencyProbe` 对 127.0.0.1 建连测速；断言 latency_ms 为有值（非 null）、
# status=ok、且低于宽松阈值（本地回环）。进程内 join 回收，不遗留监听。
[when]
command = "cargo run --quiet -p nexus --example proxy_speedtest_loopback -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "proxy speedtest"

[[expect]]
field = "probe_kind"
equals = "tcp"

[[expect]]
field = "results.0.tag"
equals = "loopback"

[[expect]]
field = "results.0.status"
equals = "ok"

[[expect]]
field = "results.0.latency_ms"
one_of = [0, 1, 2, 3, 4, 5]
