schema_version = 1
id = "product.node-tags"
title = "Mesh 节点分组标签：打标、按标签过滤与路由选择"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-node-tags"

[given]
subnet_cidr = "10.0.0.0/24"
nodes = [
  { node_id = "node-us-edge", virtual_ip = "10.0.0.1", tags = ["region:us", "role:edge", "tier:1"] },
  { node_id = "node-eu-edge", virtual_ip = "10.0.0.2", tags = ["region:eu", "role:edge", "tier:1"] },
  { node_id = "node-us-db", virtual_ip = "10.0.0.3", tags = ["region:us", "role:db", "tier:0"] },
  { node_id = "node-eu-db", virtual_ip = "10.0.0.4", tags = ["region:eu", "role:db", "tier:0"] },
  { node_id = "node-cn-relay", virtual_ip = "10.0.0.5", tags = ["region:cn", "role:relay", "tier:2"] },
]
filter_region_us = "region=us"
filter_role_db = "role=db"
filter_tier_zero = "tier=0"
filter_region_and_role = ["region=us", "role=db"]
filter_role_edge = "role=edge"
filter_no_match = "region=xx"

[when]
command = "nexus-harness run node-tags --json"

[[expect]]
field = "tagged_nodes"
equals = 5

# 精确匹配：region=us 应返回 2 个节点
[[expect]]
field = "filter_region_us.count"
equals = 2

# 精确匹配：role=db 应返回 2 个节点
[[expect]]
field = "filter_role_db.count"
equals = 2

# 多标签 AND 匹配：region=us AND role=db 应返回 1 个节点
[[expect]]
field = "filter_region_and_role.count"
equals = 1

# 存在性匹配：只要 tier key 存在即命中（不限值）
[[expect]]
field = "filter_key_exists.count"
equals = 5

# 无匹配结果
[[expect]]
field = "filter_no_match.count"
equals = 0

# 按标签选择下一跳：选 role=edge 且 tier=1 的节点
[[expect]]
field = "next_hop.selected.node_id"
equals = "node-us-edge"

# 标签解析：从字符串 "key=value" 解析为 NodeTag
[[expect]]
field = "parsed_tag.key"
equals = "region"

[[expect]]
field = "parsed_tag.value"
equals = "us"
