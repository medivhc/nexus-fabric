schema_version = 1
id = "product.cli-workspace-cache"
title = "nexus CLI 前端：workspace cache 接线到 observability 快照（--json）"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "content store ready (objects + protected roots + ReachabilityGc)"
cli_frontend = "nexus CLI 前端解析 cache <workspace> 后路由到 observability 快照"

[when]
command = "cargo run --quiet -p nexus -- workspace cache ws1 --json"

# 冻结期望：CLI 前端此前对该命令返回 UNSUPPORTED；现输出缓存快照与 GC 保留语义。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "workspace cache"

[[expect]]
field = "object_count"
equals = 2

[[expect]]
field = "protected_count"
equals = 1

[[expect]]
field = "sweep_collected"
equals = 1

[[expect]]
field = "protected_retained"
equals = true
