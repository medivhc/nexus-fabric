schema_version = 1
id = "product.graceful-exit-real"
title = "优雅退出真实再见帧 wire codec + 真实墙钟宽限期 drain"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-graceful-exit-real"

[given]
grace_period_ms = 500
notify_peers = true
wait_for_drain = true

[when]
command = "cargo run --quiet -p nexus --example graceful_exit_real -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "graceful-exit-real"

# 编码→解码 roundtrip 字段一致
[[expect]]
field = "codec_roundtrip"
equals = true

[[expect]]
field = "decoded_version"
equals = 1

[[expect]]
field = "decoded_peer_id"
equals = "peer-a"

[[expect]]
field = "decoded_reason"
equals = "shutting-down"

# loopback 对端真实收到并解码出再见帧
[[expect]]
field = "wire_received"
equals = true

# drain_real：连接逐步清零后推进到 Exiting
[[expect]]
field = "drain_result"
equals = "exiting"

# 再推进一次到终态 Exited
[[expect]]
field = "final_state"
equals = "exited"
