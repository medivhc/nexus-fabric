schema_version = 1
id = "product.fabric-egress-tcp"
title = "TCP 出口：originator smoltcp 终结，字节流经 fabric 到 egress TcpStream 中继"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6.4"

[given]
topology = "two Projections (A + B) with MockTun, mock peer link; A has TcpEgress terminator (smoltcp); B has TcpEgress relay (real TcpStream)"
rules = "A: 127.0.0.0/8 -> Egress{peer=B} (TCP); B: 0.0.0.0/0 -> Egress{self} + tcp relay enabled"
packets = "deterministic: example crafts TCP SYN -> SYN-ACK -> ACK -> PSH('hello-3b5') -> echo -> PSH back -> FIN -> FIN-ACK via A's MockTun"

# 可执行 E4：example 手工构造 TCP 包走 A 的 MockTun：
# SYN(10.0.0.2:40000 -> 127.0.0.1:<echo_port>) -> A 的 smoltcp 本地握手 ->
# A 的 TUN 读到 SYN-ACK -> 回 ACK -> 发 PSH("hello-3b5") ->
# STREAM 意图帧到 B -> B 的 TcpStream 发往本地 echo 服务器 ->
# echo 回字节 -> STREAM 帧回 A -> A 的 smoltcp 发到 TUN ->
# 读到 PSH("hello-3b5") -> 发 FIN -> 两端清理 -> 输出 JSON。
# 全程无 mock 回包；B 侧是真实 TcpStream。
[when]
command = "cargo run --quiet -p nexus-projection --example egress_tcp -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
equals = "PASS"

# A 侧 smoltcp 完成本地握手（收到 SYN-ACK）。
[[expect]]
field = "a.tcp.handshake_done"
equals = true

# 应用字节完整往返。
[[expect]]
field = "a.tcp.echo_bytes_match"
equals = true

# B 侧真实 TcpStream 发出并收到字节。
[[expect]]
field = "b.tcp.relayed_bytes"
equals = 9

# FIN 双向关闭，两端连接表清理。
[[expect]]
field = "a.tcp.conns_after_close"
equals = 0

[[expect]]
field = "b.tcp.conns_after_close"
equals = 0

# 首包非 SYN 被丢弃（S21）。
[[expect]]
field = "a.tcp.no_conn_dropped"
equals = 1

# 意图位正确（STREAM = 0x02）。
[[expect]]
field = "intent.stream_bit_set"
equals = true
