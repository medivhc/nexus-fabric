schema_version = 1
id = "product.fabric-egress-basic"
title = "统一路由本地出口：TUN 包经规则匹配走 Egress{self} UDP NAT， hồi包正确"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6.4"
carrier = "n1-fabric"

[given]
topology = "single Projection with MockTun + SimpleRuleEngine + EgressNat (example binary)"
rules = "10.0.0.0/8 -> MeshPeer, 0.0.0.0/0 -> Egress{self}"
packets = "50 x UDP packets to internet dst (8.8.8.8:53), deterministic"

# 可执行 E4：example 建 Projection（配 SimpleRuleEngine：互联网走 Egress{self}）->
# 注入 50 个 UDP 包 -> 经本地 NAT 出口 -> mock 对端回包 ->
# 验证回包正确路由回 TUN 且内容一致 -> 输出 JSON。
[when]
command = "cargo run --quiet -p nexus-projection --example egress_basic -- --json"

# 冻结期望（S9/S10/S11/S12）。
[[expect]]
field = "verdict"
equals = "PASS"

# 50 个包全部经 Egress{self} 发出（S9 路由确定性）。
[[expect]]
field = "route.egress_self"
equals = 50

# 虚拟子网包不经过规则引擎（S10）。
[[expect]]
field = "route.mesh_peer"
equals = 10

# NAT 回包全部正确（S11）。
[[expect]]
field = "nat.reply_received"
equals = 50

[[expect]]
field = "nat.reply_bytes_match"
equals = true

# Drop 计数可见（S12）。
[[expect]]
field = "route.dropped"
equals = 5
