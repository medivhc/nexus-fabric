schema_version = 1
id = "product.daemon-real-host-flow"
title = "真实 TCP 交付：host 服务端 AUTH 门控 + 真实帧流 + ECHO 业务往返"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"
carrier = "v9-connectivity"

[given]
delivery = "real-transport"
auth = "server-side-wire-auth"
transport = "tcp-length-prefix-frame"

# 可执行 E4：SDK 真实网络切片在回环地址上驱动真实 TCP 帧流
# （host 线程 + 请求方远程闭环），host 服务端完成 AUTH 门控后执行 ECHO 往返。
[when]
command = "cargo run --quiet -p nexus --example remote_real_host_flow"

# 冻结期望：服务端认证门控（AUTH 帧在业务帧前）；真实帧流建连；
# 业务往返 ECHO 匹配；Session 双轨 Disposed/Completed；TerminalOutcome 恰好一次。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "auth.gate"
equals = "auth_ok"

[[expect]]
field = "transport.kind"
equals = "tcp-frame"

[[expect]]
field = "service.phase"
equals = "Active"

[[expect]]
field = "echo.roundtrip_matched"
equals = true

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Completed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "host.connections_served"
equals = 1
