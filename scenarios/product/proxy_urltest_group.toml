schema_version = 1
id = "product.proxy-urltest-group"
title = "urltest 组按离线确定性 measurement 选延迟最低候选并断言选中 tag"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"
carrier = "v9-connectivity"

[given]
group_kind = "urltest"
candidates = ["relay-slow", "relay-fast", "relay-mid"]
measurement_source = "offline deterministic mock (RTT: slow=320ms fast=85ms mid=150ms)"
selection = "lowest RTT wins"
network = "none (offline mock, no real probe)"

# 可执行 E4：组合根 example 构建 urltest 策略组，注入离线确定性 measurement
# 数据（三个候选的 mock RTT），调用 select() 断言选中 RTT 最低的候选
# relay-fast。全程离线可复现，禁止真实网络。
# 断言确定性字段：verdict、group_type、selected_outbound_tag、
# measurement_source。禁止断言时序/真实 RTT 绝对值。
[when]
command = "cargo run --quiet -p nexus --example proxy_urltest_group -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "group_type"
equals = "urltest"

[[expect]]
field = "selected_outbound_tag"
equals = "relay-fast"

[[expect]]
field = "measurement_source"
equals = "offline-deterministic"

[[expect]]
field = "candidate_count"
equals = 3
