schema_version = 1
id = "product.k-shortest"
title = "K-shortest 路径：Yen 算法求前 K 条无环最短路（主备）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-k-shortest"
carrier = "v9-connectivity"

[given]
topology = "A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms), A-D(35ms direct); K=3"
api = "KShortest::new(k); PathComputer::compute_paths returns up to K ordered paths"
algorithm = "Yen's K-shortest loopless paths; O(K*V*(E log V))"

# 可执行 E4：Yen 算法求 K 条路径
#   k_paths_found    K=3 时 A->D 得 3 条（20ms 经 B、20ms 经 C、35ms 直连）
#   k_ordered        按代价升序排列
#   k_truncated      K=2 时只返回 2 条
#   k_unreachable    孤立节点返回空 Vec
[when]
command = "cargo run --quiet -p nexus --example k_shortest -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "k_paths_found"

[[expect]]
field = "events.1"
equals = "k_ordered"

[[expect]]
field = "events.2"
equals = "k_truncated"

[[expect]]
field = "events.3"
equals = "k_unreachable"

[[expect]]
field = "kshortest.k3_count"
equals = 3

[[expect]]
field = "kshortest.k3_costs.0"
equals = 20
