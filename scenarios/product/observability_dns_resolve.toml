schema_version = 1
id = "product.observability-dns-resolve"
title = "§9 可观察性：dns resolve 输出解析快照"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "dns runtime ready (demo resolver, example.com v6+v4)"
observability = "resolution snapshot with addresses/ttl/exit binding"

[when]
command = "cargo run --quiet -p nexusd -- dns resolve --json"

# 冻结期望：经 DnsRuntime 解析 example.com，输出地址列表、TTL 与 Exit-DNS
# Binding（requirement-change：2026-09-18，由 UNSUPPORTED 转为真实实现）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "dns resolve"

[[expect]]
field = "name"
equals = "example.com"

[[expect]]
field = "addresses.0"
non_empty = true

[[expect]]
field = "addresses.1"
non_empty = true

[[expect]]
field = "exit_binding"
non_empty = true
