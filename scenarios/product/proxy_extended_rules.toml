schema_version = 1
id = "product.proxy-extended-rules"
title = "新增规则类型 src-port/dst-port/process-name 命中 -> 走指定出站"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
inbound = "socks5 (dst-port) + 直接构造 FlowTarget (src-port/process-name)"
rule_table = "static ordered: DST-PORT 8080 -> proxy-a; SRC-PORT 9000-9100 -> proxy-b; PROCESS-NAME chrome* -> proxy-c; MATCH -> fallback"
flow = "三组独立目标分别命中三类新规则"
matching = "first-match wins; 端口范围闭区间；进程名大小写敏感前缀通配"

# 可执行 E4：组合根 example 驱动三组 FlowTarget，经 RuleEngine 执行顺序匹配；
# dst-port 从 SOCKS5 目的地解析，src-port/process-name 由调用方直接设置。
# 断言确定性字段：verdict、matched_rule、rule_kind（三种新 kind 各一次）。
# 禁止断言时序/外部资源/真实网络探测。
[when]
command = "cargo run --quiet -p nexus --example proxy_extended_rules -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "dst_port_rule"
equals = "rule-dst-port"

[[expect]]
field = "dst_port_kind"
equals = "dst_port"

[[expect]]
field = "src_port_rule"
equals = "rule-src-port"

[[expect]]
field = "src_port_kind"
equals = "src_port"

[[expect]]
field = "process_rule"
equals = "rule-process"

[[expect]]
field = "process_kind"
equals = "process_name"
