schema_version = 1
id = "product.n3-idempotency"
title = "并发重复提交且重启后保持同一 Task"
evidence_strength = "E4"
requirement = "PRODUCT.md#17-n3-task"

# N3 contract-first: future verifier, not a delivered runtime.
# Modules: nexus-domain nexus-compute nexus-workspace nexus-storage
# nexus-session nexus-control-api apps/nexus apps/nexusd

[given]
topology = "separate requester/provider processes; local E4, not Windows/Linux E5"
steps = "同 workspace/principal/provider/key 并发提交相同请求；关闭重开提供方后在 TTL 内再次提交。"

[when]
command = "cargo run --locked --quiet -p nexusd --example n3_task_e4 -- idempotency"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "observed.same_task_id"
equals = true

[[expect]]
field = "observed.accepted_task_count"
equals = 1

[[expect]]
field = "observed.command_start_count"
equals = 1

[[expect]]
field = "observed.key_reloaded"
equals = true
