schema_version = 1
id = "platform.windows-system-proxy"
title = "WinINET 系统代理接管：HKCU 读写 + InternetSetOption 广播 + 自清理恢复"
evidence_strength = "E4"
requirement = "PRODUCT.md#13-system-proxy"
carrier = "n1-fabric"

[given]
platform = "windows"
backend = "wininet-registry"
adapter_api = "nexus-platform-windows"
test_proxy = "127.0.0.1:7898"

# 自清理闭环：e2e 子命令在单次进程内 snapshot 原值 -> set 7898 -> 读回校验
# -> 无条件恢复原值 -> 广播刷新 -> 读回校验一致。结束后注册表必须与进入时一致。
[when]
command = "cargo run --quiet -p nexusd -- system-proxy e2e --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "proxy.after_set.enabled"
equals = true

[[expect]]
field = "proxy.after_set.server"
equals = "127.0.0.1:7898"

[[expect]]
field = "restore_consistent"
equals = true
