schema_version = 1
id = "platform.virtual-packet-interface"
title = "Windows VPI 能力声明满足统一 Packet Semantics（wintun 窄 FFI 后端）"
evidence_strength = "E4"
requirement = "PRODUCT.md#cross-platform"

[given]
platform = "windows"
backend = "wintun"
adapter_api = "nexus-platform-windows"

# 可执行 E4：组合根（apps/nexus-platform-host）暴露只读能力声明（不创建驱动
# 对象），harness 按路径求值。真实驱动收发由部署环境可选 smoke 验证。
[when]
command = "cargo run --quiet -p nexus-platform-host --features platform-windows -- vpi-capabilities --json"

[[expect]]
field = "backend"
equals = "wintun"

[[expect]]
field = "portable_consumer"
equals = "nexus-ingress"

[[expect]]
field = "capabilities.packet_ingress"
equals = true

[[expect]]
field = "capabilities.packet_injection"
equals = true

[[expect]]
field = "capabilities.ipv4"
equals = true

[[expect]]
field = "capabilities.ipv6"
equals = true

[[expect]]
field = "capabilities.mtu_configurable"
equals = true

[[expect]]
field = "capabilities.route_include"
equals = true

[[expect]]
field = "mtu"
equals = 1420

[[expect]]
field = "adapter_api"
equals = "nexus-platform-windows"
