schema_version = 1
id = "platform.win-ip-route"
title = "Windows IP 配置与路由管理（netsh/route 命令构造）"
evidence_strength = "E4"
requirement = "docs/WINDOWS_TUN_DESIGN.md#5"
carrier = "n1-fabric"

[given]
platform = "windows"
module = "nexus-platform-windows::netcfg"

# E4：命令构造单元测试（mock 执行器，不真执行）。
# 真机执行在 win-pc 上独立验证。

[when]
command = "cargo test --quiet -p nexus-platform-windows netcfg"

[[expect]]
field = "assign_ip_command"
equals = "netsh interface ip set address \"nexus\" static 10.200.0.5 255.255.255.0"

[[expect]]
field = "add_route_command"
equals = "route add 10.200.0.0 mask 255.255.255.0 192.168.1.1 metric 10"

[[expect]]
field = "exclude_ip_command"
equals = "route add 1.2.3.4 mask 255.255.255.255 192.168.1.1 metric 1"

[[expect]]
field = "invalid_prefix_rejected"
equals = true
