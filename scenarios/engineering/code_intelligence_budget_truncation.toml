schema_version = 1
id = "engineering.code-intelligence-budget-truncation"
title = "命中超过 max_results 时必须显式 truncated 并给出 refinement hint（提案 §5/§16.6）"
evidence_strength = "E4"
requirement = "docs/SEMANTIC-CODE-INTELLIGENCE-PROPOSAL.md#5-context-budget"

# 同一位置（Egress::send 声明）的 references 命中数 > 2，因此 --max-results 2
# 必然触发截断；count 报告截断前的完整命中数。
[given]
repository = "initialized"
network = "none (本地 language server 子进程)"

[when]
command = "nexus-harness code references engineering/nexus-harness/fixtures/code-intel/src/transport.rs:9:8 --workspace engineering/nexus-harness/fixtures/code-intel --max-results 2 --json"

[[expect]]
field = "command"
equals = "code references"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "budget.max_results"
equals = 2

[[expect]]
field = "budget.truncated"
equals = true

[[expect]]
field = "results"
non_empty = true

[[expect]]
field = "count"
non_empty = true

[[expect]]
field = "continuation.refinement_hint"
non_empty = true

[[expect]]
field = "authority"
equals = "advisory"
