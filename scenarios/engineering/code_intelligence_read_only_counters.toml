schema_version = 1
id = "engineering.code-intelligence-read-only-counters"
title = "只读查询不得产生任何写请求；diagnostics 为 PASS 时仍只是 advisory 证据（提案 §14/§16.4/§16.10）"
evidence_strength = "E4"
requirement = "docs/SEMANTIC-CODE-INTELLIGENCE-PROPOSAL.md#14-security-and-resource-control"

# 比 code_intelligence_diagnostics_advisory 更严：verdict 必须是 PASS（不是
# one_of[PASS,FAIL] 那种永为真的断言），并机器化验证"写请求拒绝计数为 0"——
# 未识别请求计数已与之分离，因此该字段为 0 才真正说明 provider 没被诱导写。
carrier = "engineering"
[given]
repository = "initialized"
network = "none (本地 language server 子进程)"

[when]
command = "nexus-harness code diagnostics engineering/nexus-harness/fixtures/code-intel/src/lib.rs --workspace engineering/nexus-harness/fixtures/code-intel --json"

[[expect]]
field = "schema_version"
equals = 1

[[expect]]
field = "command"
equals = "code diagnostics"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "authority"
equals = "advisory"

[[expect]]
field = "provider.write_requests_refused"
equals = 0

[[expect]]
field = "provider.ready"
equals = true

[[expect]]
field = "snapshot.workspace_root"
non_empty = true

[[expect]]
field = "snapshot.source_revision"
non_empty = true
