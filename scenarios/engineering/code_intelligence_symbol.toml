schema_version = 1
id = "engineering.code-intelligence-symbol"
title = "nexus-harness code symbol 经 rust-analyzer 在夹具 workspace 内解析 trait 符号（提案 §4/§16.1）"
evidence_strength = "E4"
requirement = "docs/SEMANTIC-CODE-INTELLIGENCE-PROPOSAL.md#4-agent-facing-api"

[given]
repository = "initialized"
network = "none (本地 language server 子进程)"

[when]
command = "nexus-harness code symbol Egress --workspace engineering/nexus-harness/fixtures/code-intel --json"

[[expect]]
field = "schema_version"
equals = 1

[[expect]]
field = "command"
equals = "code symbol"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "authority"
equals = "advisory"

[[expect]]
field = "provider.kind"
equals = "rust-analyzer"

[[expect]]
field = "results"
non_empty = true

[[expect]]
field = "snapshot.source_revision"
non_empty = true

[[expect]]
field = "snapshot.working_tree_digest"
non_empty = true

[[expect]]
field = "budget.workspace_scope"
non_empty = true
