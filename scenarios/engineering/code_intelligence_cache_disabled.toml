schema_version = 1
id = "engineering.code-intelligence-cache-disabled"
title = "--no-cache 时结果层不读也不写，但语义结果与键绑定都还在：tier=miss、disabled=true、verdict=PASS（MODULE.md 两层缓存之②）"
evidence_strength = "E4"
requirement = "engineering/nexus-harness/MODULE.md#provider-daemon--result-cache"

# 最该被这条场景抓住的假绿是"关掉缓存顺手把查询也打死了"（verdict=FAIL、results 空）——
# 所以这里直接钉 PASS + results 非空（与 code_intelligence_symbol.toml 同一环境前提、同一口径），
# 而不是给 verdict 一个 one_of 容忍区间：one_of 里放进 FAIL 等于放弃断言，
# 排除 BLOCKED 又会在没有 rust-analyzer 的宿主上把环境问题报成性质红。
carrier = "engineering"

[given]
repository = "initialized"
network = "none (本地 rust-analyzer 子进程)"

[when]
command = "nexus-harness code symbol Egress --workspace engineering/nexus-harness/fixtures/code-intel --no-cache --json"

[[expect]]
field = "command"
equals = "code symbol"

[[expect]]
field = "schema_version"
equals = 1

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "results"
non_empty = true

[[expect]]
field = "authority"
equals = "advisory"

[[expect]]
field = "cache.disabled"
equals = true

# 关掉之后不存在第二种可能。
[[expect]]
field = "cache.tier"
equals = "miss"

# 键绑定不因为关掉缓存而消失：仍要说清这次查询绑在哪个指纹上。
[[expect]]
field = "cache.key_digest"
non_empty = true

[[expect]]
field = "snapshot.working_tree_digest"
non_empty = true
