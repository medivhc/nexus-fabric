schema_version = 1
id = "engineering.code-intelligence-daemon-lifecycle"
title = "provider daemon 的显式生命周期、跨命令复用与两层缓存：逐条钉契约字段的值（MODULE.md「Provider Daemon & Result Cache」selftest 字段清单）"
evidence_strength = "E4"
requirement = "engineering/nexus-harness/MODULE.md#provider-daemon--result-cache"
# 授权门槛的旁证（不是行为期望的来源）：docs/SEMANTIC-CODE-INTELLIGENCE-PROPOSAL.md §11 只说
# cold start 成为瓶颈时可加持久索引、且不得另造第二套 Agent API；daemon 的每条行为期望
# 都只来自 MODULE.md，本行不改加载行为（requirement 不被加载器读取），仅为人读锚点。

# 期望值逐条镜像 MODULE.md 的字段清单：契约改名/改值而实现与场景没跟上，这里就红。
# 探针语义（每个 true 具体断言什么）也写在契约里，不是由实现自己解释。
# 必须显式 --workspace：契约规定 selftest 没有缺省作用域，缺省即环境依赖。
# 独立性与隔离：selftest 用**自己那份每次运行唯一的**租约/缓存命名空间，作用域是契约指定的
# 仓库内夹具且**只读不写**（round 3 否决了"复制成 temp scratch 再操作"：`--workspace` 归一化后
# 必须仍在仓库内，仓库外副本让 verdict=PASS 永不可达；仓库内可写副本会造出运行期 dirty，并在
# 默认并行调度下把别的 code_* 场景打成 SNAPSHOT_STALE）。因此既不碰开发者真实在跑的 daemon，
# 也不在工作树里造文件（dirty_after_lifecycle=0 钉这条）。
# 命名空间**每次运行唯一**：否则第二次跑会读到上一次的缓存条目，default_path_* 与
# cache_second_run_tier 的含义就随运行次数漂移（契约「作用域与隔离」②）。
# 本场景只钉"清单里 23 枚字段"，**其余同名性质改由点名单测承载**（求值器没有"字段缺席"算子，
# 把自身输出形状塞进清单只会多出自证布尔）：daemon_decline_omits_absent_fields、
# daemon_unavailable_carries_structured_reason、cache_key_misses_when_digest_differs、
# cache_hit_restamps_run_metadata、cache_refuses_entries_beyond_cap、cache_stores_only_result_fields、
# session_reuse_key_rejects_changed_digest、wire_refuses_non_whitelist、
# daemon_selftest_field_list_matches_contract。
# 另两条硬性排除也在这里被兜住：mcp selftest --with-query 与 daemon selftest 强制不读不写缓存
# （否则 Phase 4 复用判据可由回放满足）；selftest 对仓库内夹具只读不写（不复制成 temp scratch，
# 那会撞冻结的 containment 不变量）。
# 诚实边界：second_process_* / cache_second_run_tier / stale_fallback_verdict 要求宿主有可解析的
# rust-analyzer；没有 RA 的宿主上本场景如实变红（与 provider_override_honored 同一口径）。

[given]
repository = "initialized"
network = "none (只监听 127.0.0.1 的本地子进程)"

[when]
command = "nexus-harness daemon selftest --workspace engineering/nexus-harness/fixtures/code-intel --json"

[[expect]]
field = "command"
equals = "daemon"

[[expect]]
field = "schema_version"
equals = 1

[[expect]]
field = "verdict"
equals = "PASS"

# daemon 与缓存都不拥有最终 PASS。
[[expect]]
field = "authority"
equals = "advisory"

# 探针条数 = 契约清单条数；实现少跑一条就红（§N 那类"记错条数"不能靠人复查）。
[[expect]]
field = "probe_count"
equals = 23

[[expect]]
field = "start_verdict"
equals = "PASS"

[[expect]]
field = "status_running_after_start"
equals = true

[[expect]]
field = "already_running"
equals = true

[[expect]]
field = "default_path_session_source"
equals = "in-process"

[[expect]]
field = "default_path_lease_absent"
equals = true

[[expect]]
field = "second_process_session_source"
equals = "daemon"

[[expect]]
field = "reuse_provider_sessions"
equals = 1

[[expect]]
field = "stale_lease_detected"
equals = true

[[expect]]
field = "stale_fallback_verdict"
equals = "PASS"

[[expect]]
field = "stale_fallback_session_source"
equals = "in-process"

[[expect]]
field = "wrong_token_rejected"
equals = true

[[expect]]
field = "idle_self_exit_observed"
equals = true

[[expect]]
field = "lease_removed_on_idle"
equals = true

[[expect]]
field = "stop_absent_verdict"
equals = "UNKNOWN"

[[expect]]
field = "sessions_after_stop"
equals = 0

[[expect]]
field = "lru_provider_sessions_at_capacity"
equals = 1

[[expect]]
field = "cache_second_run_tier"
equals = "disk"

[[expect]]
field = "cache_default_enabled"
equals = true

[[expect]]
field = "cache_disableable"
equals = true

[[expect]]
field = "commands_surface_lists_daemon"
equals = true

[[expect]]
field = "unknown_flag_blocked"
equals = true

# 未运行时的字段可得性必须是"不出现"，不是 null/0 占位（只在散文里规定等于没规定）。
# daemon_unavailable 出现时原因必非空且结构化（回落可见，不是静默降级）。
[[expect]]
field = "defaults_idle_secs"
equals = 900

[[expect]]
field = "dirty_after_lifecycle"
equals = 0

[[expect]]
field = "snapshot.source_revision"
non_empty = true
