schema_version = 1
id = "engineering.code-intelligence-implementations"
title = "trait 方法声明位置得到恰好 3 个实现（夹具 TcpEgress/UdpEgress/RelayEgress，提案 §16.2）"
evidence_strength = "E4"
requirement = "docs/SEMANTIC-CODE-INTELLIGENCE-PROPOSAL.md#16-acceptance-criteria"

# 冻结锚点：fixtures/code-intel/src/transport.rs:9:8 = `Egress::send` 声明处
# （1-based 行/列）。夹具行号属契约，改动必须重走契约阶段。
carrier = "engineering"
[given]
repository = "initialized"
network = "none (本地 language server 子进程)"

[when]
command = "nexus-harness code implementations engineering/nexus-harness/fixtures/code-intel/src/transport.rs:9:8 --workspace engineering/nexus-harness/fixtures/code-intel --json"

[[expect]]
field = "command"
equals = "code implementations"

[[expect]]
