equals = "PASS"

[[expect]]
field = "authority"
equals = "advisory"

[[expect]]
field = "count"
equals = 3

[[expect]]
field = "results.0.path"
non_empty = true

[[expect]]
field = "results.0.kind"
non_empty = true

[[expect]]
field = "provider.ready"
equals = true
