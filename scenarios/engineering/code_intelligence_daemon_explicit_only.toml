schema_version = 1
id = "engineering.code-intelligence-daemon-explicit-only"
title = "--no-daemon 完全不问 daemon：会话来源 in-process、cache 默认可用、查询照常 PASS（MODULE.md Provider Daemon & Result Cache）"
evidence_strength = "E4"
requirement = "engineering/nexus-harness/MODULE.md#provider-daemon--result-cache"

# --no-daemon 是"契约授权的确定化口径"：环境里有没有人手工起过 daemon 都不影响本场景。
# 它**不**用来证明"默认路径不自动 spawn" —— 那是同义反复；那条性质由 daemon selftest 的
# default_path_session_source / default_path_lease_absent 两枚值断言钉（selftest 控制起始状态）。
# 本场景不钉 cache.tier：默认允许缓存时 tier 取决于是否已有同指纹条目，属环境既有状态，
# 拿 one_of 容忍它不是断言。命中条件与真实命中由 selftest 的 cache_second_run_tier="disk" 负责。

[given]
repository = "initialized"
network = "none (本地 rust-analyzer 子进程)"

[when]
command = "nexus-harness code symbol Egress --workspace engineering/nexus-harness/fixtures/code-intel --no-daemon --json"

[[expect]]
field = "command"
equals = "code symbol"

[[expect]]
field = "schema_version"
equals = 1

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "results"
non_empty = true

[[expect]]
field = "authority"
equals = "advisory"

[[expect]]
field = "daemon.running"
equals = false

[[expect]]
field = "daemon.session_source"
equals = "in-process"

# 默认路径：缓存是开的（契约"默认值都是允许"必须有机器对应物）。
[[expect]]
field = "cache.disabled"
equals = false

[[expect]]
field = "cache.key_digest"
non_empty = true

[[expect]]
field = "snapshot.working_tree_digest"
non_empty = true
