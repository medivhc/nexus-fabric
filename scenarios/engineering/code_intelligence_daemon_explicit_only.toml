schema_version = 1
id = "engineering.code-intelligence-daemon-explicit-only"
title = "--no-daemon --no-cache 完全不问 daemon、不碰缓存：会话来源 in-process、查询照常 PASS（MODULE.md Provider Daemon & Result Cache）"
evidence_strength = "E4"
requirement = "engineering/nexus-harness/MODULE.md#provider-daemon--result-cache"

# --no-daemon 是"契约授权的确定化口径"：环境里有没有人手工起过 daemon 都不影响本场景。
# 它**不**用来证明"默认路径不自动 spawn" —— 那是同义反复；那条性质由 daemon selftest 的
# default_path_session_source / default_path_lease_absent 两枚值断言钉（selftest 控制起始状态）。
# 契约把 daemon.running 定义为"本次查询经由 daemon"（不是"机器上有没有 daemon"），
# 所以 running=false 在本场景里与环境里是否有别人的 daemon 无关；"有没有"另由 daemon.detected 暴露。
#
# 为什么这里必须同时给 --no-cache（实现时才发现原写法不自洽）：本场景钉
# daemon.session_source="in-process"，而命中缓存条目时该值是 "cache"（契约「命中形状」②——
# 命中既没问 daemon 也没起 provider，写 in-process 就是把没做的事说成做过）。有没有条目
# 属环境既有状态，与下面这段原话对 cache.tier 的判断是同一回事：
#   "默认允许缓存时 tier 取决于是否已有同指纹条目，属环境既有状态，拿 one_of 容忍它不是断言。"
# 既然 tier 因该状态被排除，由同一状态派生的 session_source 就不能留着缓存开。
# "默认为允许"这个承诺另有机器对应物：selftest 的 cache_default_enabled=true 与
# cache_disableable=true（生命周期场景逐条钉值），不由本场景承担。
carrier = "engineering"

[given]
repository = "initialized"
network = "none (本地 rust-analyzer 子进程)"

[when]
command = "nexus-harness code symbol Egress --workspace engineering/nexus-harness/fixtures/code-intel --no-daemon --no-cache --json"

[[expect]]
field = "command"
equals = "code symbol"

[[expect]]
field = "schema_version"
equals = 1

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "results"
non_empty = true

[[expect]]
field = "authority"
equals = "advisory"

[[expect]]
field = "daemon.running"
equals = false

[[expect]]
field = "daemon.session_source"
equals = "in-process"

# 显式关闭的口径由本场景自己给出；"默认是开的"由 selftest 的 cache_default_enabled 钉。
[[expect]]
field = "cache.disabled"
equals = true

[[expect]]
field = "cache.key_digest"
non_empty = true

[[expect]]
field = "snapshot.working_tree_digest"
non_empty = true
