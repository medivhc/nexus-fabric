schema_version = 1
id = "engineering.code-intelligence-callers"
title = "callers 支持一层按需展开：dispatch_dyn 的唯一调用者是 Scheduler::tick（提案 §16.3）"
evidence_strength = "E4"
requirement = "docs/SEMANTIC-CODE-INTELLIGENCE-PROPOSAL.md#16-acceptance-criteria"

# 锚点：fixtures/code-intel/src/transport.rs:64:8 = `pub fn dispatch_dyn`。
# 调用点唯一：src/lib.rs 的 Scheduler::tick 内 `transport::dispatch_dyn(...)`。
[given]
repository = "initialized"
network = "none (本地 language server 子进程)"

[when]
command = "nexus-harness code callers engineering/nexus-harness/fixtures/code-intel/src/transport.rs:64:8 --workspace engineering/nexus-harness/fixtures/code-intel --json"

[[expect]]
field = "command"
equals = "code callers"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "count"
equals = 1

[[expect]]
field = "results.0.path"
equals = "engineering/nexus-harness/fixtures/code-intel/src/lib.rs"

[[expect]]
field = "results.0.qualified_name"
non_empty = true

[[expect]]
field = "provider.kind"
equals = "rust-analyzer"
