schema_version = 1
id = "engineering.code-intelligence-daemon-command-surface"
title = "daemon 的未知子命令与未知参数一律 BLOCKED，且命令清单里必须包含 daemon 自己（MODULE.md Public API：未知命令不静默忽略）"
evidence_strength = "E4"
requirement = "docs/SEMANTIC-CODE-INTELLIGENCE-PROPOSAL.md#12-failure-semantics"

# 这条盯的是命令面而不是会话面。理由有历史依据：同一个模块里已经犯过两次
# "参数被接受但不生效"（--provider-binary 被整个丢掉）与"命令清单硬编码漏项"，
# 而 daemon 新增了 4 个子命令 + 3 个参数，是这类漂移最可能发生的地方。
# 期望值全部来自契约，不来自实现行为：契约写了 `daemon start|stop|status|selftest`
# 与 `--workspace/--idle-secs/--max-workspaces`，所以未知者必须 BLOCKED；
# 兜底消息必须自述完整（含 daemon），否则帮助与行为互相矛盾。

[given]
repository = "initialized"
network = "none (不启动任何 language server，也不启动 daemon)"

[when]
command = "nexus-harness daemon bogus-subcommand --json"

[[expect]]
field = "command"
equals = "daemon"

[[expect]]
field = "verdict"
equals = "BLOCKED"

# 拒绝原因必须说清支持什么，且包含 daemon 自己（硬编码清单漏项就是这条要抓的）。
[[expect]]
field = "message"
non_empty = true

# BLOCKED 不拥有任何结论，也不该假装启动过什么。
[[expect]]
field = "daemon.running"
equals = false

[[expect]]
field = "authority"
equals = "advisory"
