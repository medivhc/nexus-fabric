schema_version = 1

[third_party]
default_features_policy = "prefer-disabled"
allow_unpinned_git = false
allow_path_outside_workspace = false
require_declared_reason_for_default_features = true
require_architecture_layer_review = true
require_os_transitive_dependency_review = true
require_portability_review_for_portable_crates = true

[licenses]
policy = "allowlist"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib"
]

[security]
advisory_gate = "deny-known-vulnerabilities"
recommended_tool = "cargo-deny"
# Machine enforcement: policies/deny.toml is the cargo-deny executor config
# (same license allowlist, advisories always fail, yanked denied, sources
# restricted to crates.io). Executed by the harness `dependency-governance`
# gate via `cargo deny --config policies/deny.toml check advisories licenses
# bans sources`; cargo-deny missing makes the gate UNKNOWN, never silent PASS.

[supply_chain]
lockfile_required = true
review_new_direct_dependencies = true
review_feature_expansion = true

[dependency_reviews]
note = "Six-aspect review required by [supply_chain].review_new_direct_dependencies = true. Recorded here so the review is machine-visible."

[[dependency_reviews.direct]]
consumer = "engineering/nexus-harness"
crate = "serde_json"
version = "1"
default_features = false
features = ["std"]
architecture_layer = "engineering tooling (outside crates/ portable core; no new architecture edge)"
feature_scope = "std feature only; no alloc/raw parsing features enabled"
license = "MIT OR Apache-2.0 (allowlisted)"
security = "no known advisories in allowlist; cargo-deny recommended for CI"
portability = "pure Rust, no OS-specific API"
supply_chain = "version pinned by Cargo.lock (lockfile_required)"
approved = true
approved_date = "2026-09-15"

[[dependency_reviews.direct]]
consumer = "engineering/nexus-harness"
crate = "toml"
version = "0.8"
default_features = false
features = ["parse"]
architecture_layer = "engineering tooling (outside crates/ portable core; no new architecture edge)"
feature_scope = "parse feature only; serde/display features not enabled"
license = "MIT OR Apache-2.0 (allowlisted)"
security = "no known advisories in allowlist; cargo-deny recommended for CI"
portability = "pure Rust, no OS-specific API"
supply_chain = "version pinned by Cargo.lock (lockfile_required)"
approved = true
approved_date = "2026-09-15"

[[dependency_reviews.direct]]
consumer = "apps/nexus"
crate = "serde_json"
version = "1"
default_features = false
features = ["std"]
architecture_layer = "composition-root app host (not a crates/ member; portable-core crates stay dependency-free)"
feature_scope = "std feature only; used to render the E4 flow report JSON at the app boundary"
license = "MIT OR Apache-2.0 (allowlisted); already used and reviewed for engineering/nexus-harness"
security = "no known advisories in allowlist; cargo-deny recommended for CI"
portability = "pure Rust, no OS-specific API; app is not on the portable-core WASI list"
supply_chain = "already present in Cargo.lock, no lockfile change required"
approved = true
approved_date = "2026-09-15"
