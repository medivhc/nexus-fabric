schema_version = 1

[third_party]
default_features_policy = "prefer-disabled"
allow_unpinned_git = false
allow_path_outside_workspace = false
require_declared_reason_for_default_features = true
require_architecture_layer_review = true
require_os_transitive_dependency_review = true
require_portability_review_for_portable_crates = true

[licenses]
policy = "allowlist"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib"
]

[security]
advisory_gate = "deny-known-vulnerabilities"
recommended_tool = "cargo-deny"
# Machine enforcement: policies/deny.toml is the cargo-deny executor config
# (same license allowlist, advisories always fail, yanked denied, sources
# restricted to crates.io). Executed by the harness `dependency-governance`
# gate via `cargo deny --config policies/deny.toml check advisories licenses
# bans sources`; cargo-deny missing makes the gate UNKNOWN, never silent PASS.

[supply_chain]
lockfile_required = true
review_new_direct_dependencies = true
review_feature_expansion = true

[dependency_reviews]
note = "Six-aspect review required by [supply_chain].review_new_direct_dependencies = true. Recorded here so the review is machine-visible."

[[dependency_reviews.direct]]
consumer = "engineering/nexus-harness"
crate = "serde_json"
version = "1"
default_features = false
features = ["std"]
architecture_layer = "engineering tooling (outside crates/ portable core; no new architecture edge)"
feature_scope = "std feature only; no alloc/raw parsing features enabled"
license = "MIT OR Apache-2.0 (allowlisted)"
security = "no known advisories in allowlist; cargo-deny recommended for CI"
portability = "pure Rust, no OS-specific API"
supply_chain = "version pinned by Cargo.lock (lockfile_required)"
approved = true
approved_date = "2026-09-15"

[[dependency_reviews.direct]]
consumer = "engineering/nexus-harness"
crate = "toml"
version = "0.8"
default_features = false
features = ["parse"]
architecture_layer = "engineering tooling (outside crates/ portable core; no new architecture edge)"
feature_scope = "parse feature only; serde/display features not enabled"
license = "MIT OR Apache-2.0 (allowlisted)"
security = "no known advisories in allowlist; cargo-deny recommended for CI"
portability = "pure Rust, no OS-specific API"
supply_chain = "version pinned by Cargo.lock (lockfile_required)"
approved = true
approved_date = "2026-09-15"

[[dependency_reviews.direct]]
consumer = "apps/nexus"
crate = "serde_json"
version = "1"
default_features = false
features = ["std"]
architecture_layer = "composition-root app host (not a crates/ member; portable-core crates stay dependency-free)"
feature_scope = "std feature only; used to render the E4 flow report JSON at the app boundary"
license = "MIT OR Apache-2.0 (allowlisted); already used and reviewed for engineering/nexus-harness"
security = "no known advisories in allowlist; cargo-deny recommended for CI"
portability = "pure Rust, no OS-specific API; app is not on the portable-core WASI list"
supply_chain = "already present in Cargo.lock, no lockfile change required"
approved = true
approved_date = "2026-09-15"

[[dependency_reviews.direct]]
consumer = "crates/nexus-connectivity"
crate = "ring"
version = "0.17"
default_features = false
features = ["std"]
architecture_layer = "delivery layer; only used by new `encryption` module (X25519/HKDF/AEAD), no new internal edge"
feature_scope = "std feature only (alloc implied); no pem/test/dev features enabled"
license = "Apache-2.0 AND ISC (allowlisted)"
security = "no known advisories; already compiled in workspace via rustls 0.23"
portability = "crate portable=false; BoringSSL C code already built on all supported host targets"
supply_chain = "0.17.14 already pinned in Cargo.lock; no lockfile churn expected"
approved = true
approved_date = "2026-09-20"

[[dependency_reviews.direct]]
consumer = "crates/nexus-platform"
crate = "ring"
version = "0.17"
default_features = false
features = ["std"]
architecture_layer = "platform-abstraction layer; SecureStore 平台无关核心 (PRODUCT §12.30) 使用 HKDF-SHA256 + ChaCha20-Poly1305 AEAD, 与 nexus-connectivity 共享同一锁版本"
feature_scope = "std feature only; no pem/test/dev features enabled"
license = "Apache-2.0 AND ISC (allowlisted; 同 nexus-connectivity 已审条目)"
security = "no known advisories; workspace 已编译验证"
portability = "nexus-platform 不在 harness.toml [portable_core] WASI 清单 (portable=false); ring 的 BoringSSL C 代码在 host 目标已构建"
supply_chain = "0.17.14 已在 Cargo.lock, 无锁文件膨胀"
approved = true
approved_date = "2026-09-21"

[[dependency_reviews.direct]]
consumer = "crates/nexus-connectivity"
crate = "x25519-dalek"
version = "2"
default_features = false
features = ["static_secrets", "zeroize"]
architecture_layer = "delivery layer; P4.1 §12.39 身份密钥 (IdentityKeyPair) 需私钥可序列化 (ring EphemeralPrivateKey 不暴露私钥导出)，仅用于 encryption 模块长期身份，无新内部架构边"
feature_scope = "static_secrets (StaticSecret to/from seed 支持身份持久化) + zeroize (私钥落零) 两个 feature；default-features=false 排除 alloc/std 不需要路径"
license = "BSD-3-Clause (allowlisted)"
security = "X25519 公钥密码学标准实现 (curve25519-dalek 2 系)，无已知 advisories; 混合 DH 仅作 KDF 输入，不直接输出"
portability = "纯 Rust (curve25519-dalek/fiat-crypto/subtle)，无 C 代码、无 OS-specific API；nexus-connectivity 不在 portable_core WASI 清单 (portable=false)"
supply_chain = "2.0.1 已由 Cargo.lock 锁定；传递依赖全为纯 Rust (curve25519-dalek/fiat-crypto/subtle/rand_chacha/ppv-lite86)"
approved = true
approved_date = "2026-09-25"

[[dependency_reviews.direct]]
consumer = "crates/nexus-connectivity"
crate = "rand"
version = "0.8"
default_features = false
features = ["std", "getrandom"]
architecture_layer = "delivery layer; x25519-dalek StaticSecret::random_from_rng 的 CSPRNG 来源 (OsRng)，仅 encryption 模块使用，无新架构边"
feature_scope = "std + getrandom (OsRng 系统熵)；不启用 small_rng/thread_rng 等非安全生成器"
license = "MIT OR Apache-2.0 (allowlisted)"
security = "rand_core 0.6 系成熟 CSPRNG 生态；OsRng 走 getrandom 系统熵源"
portability = "纯 Rust；getrandom 在 Windows 走 RtlGenRandom，无需额外依赖"
supply_chain = "0.8.5 已由 Cargo.lock 锁定；传递依赖 rand_core/rand_chacha/ppv-lite86 纯 Rust"
approved = true
approved_date = "2026-09-25"