feature_scope = "std+proto-ipv4+socket-tcp+medium-ip only; ipv6/udp/icmp/dns/mqtt/ethernet explicitly disabled for P0"
license = "0BSD (allowlisted 2026-09-30; OSI-approved, more permissive than MIT; cargo-deny PASS)"
security = "RustSec DB to be checked at implementation time via harness gate"
portability = "pure Rust, no_std capable; not in portable_core (projection is platform-side)"
supply_chain = "version pinned by Cargo.lock (lockfile_required); zero transitive deps with this feature set"
os_transitive_deps = "none"
approved = true
approved_date = "2026-09-30"
review_basis = "2026-09-30 foundation decision: userspace TCP stack = smoltcp (MEMORY.md); live build eval on 2026-09-30 (no-default-features set compiles)"

