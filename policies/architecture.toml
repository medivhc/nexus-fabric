schema_version = 1
arrow_semantics = "A --> B means A depends on B"
unlisted_internal_dependencies = "deny"

[repository]
authoritative_policy_root = "policies"
authoritative_scenario_root = "scenarios"
evidence_root = ".evidence"
engineering_tools_root = "engineering"

[global]
production_depends_on_engineering = false
network_depends_on_ingress = false
platform_adapters_depend_on_domain_runtimes = false
delivery_depends_on_workspace_or_compute = false

[[crate]]
name = "nexus-domain"
allowed_internal_dependencies = []
portable = true
layer = "portable-core"

[[crate]]
name = "nexus-control-api"
allowed_internal_dependencies = ["nexus-domain", "nexus-proto"]
portable = false
layer = "portable-core"

[[crate]]
name = "nexus-registry"
allowed_internal_dependencies = ["nexus-domain"]
portable = true
layer = "portable-core"

[[crate]]
