# ---------------------------------------------------------------------------
# N2 资源类型中立门禁（P0-6，完成标志 #6；综合规划 D5 bunny 架构门禁）
#
# PRODUCT §16.4-6 规定的四 crate：`nexus-registry` / `nexus-planner` /
# `nexus-session` / `nexus-auth` 不得出现资源类型（service/network/workspace/
# compute/device）专属分支：禁止按资源类型分叉行为的 match 分支 / 条件逻辑。
# 类型化 extension 字段本身（如 ServicePlanExtension）允许——禁的是"按类型分叉
# 行为"，不是"提到类型"。
#
# N2 P1-5：此前本节声明的是 `nexus-domain` 而非契约要求的 `nexus-auth`
# （四 crate 集合与 PRODUCT §16.4-6 不一致，`nexus-auth` 侥幸无命中）；
# 现已与契约对齐。
#
# 集合与 PRODUCT.md §16.4-6 的"四 crate"契约一致（policy↔PRODUCT 一致性由
# `nexus-harness` 单测 `policy_crates_match_product_contract` 机器校验）。
#
# 机器检查：harness gate `resource-type-neutrality`（verify --fast 可跑）；
# 扫描四 crate `src/**/*.rs`，flag 同时含"变体引用"（`ResourceKind::V` /
# `Self::V`）与"分支 token"（`=>` / `matches!` / `if`＋`==`/`!=`）的**逻辑行**
# （跨行拼接的逻辑行同样命中——N2 P1-6）；
# 命中 [[resource_kind_neutrality.allow]] 的除外（allow 必须精确到 file/line/contains/reason，
# 缺字段即 gate FAIL；P1-6：line 把 allow 钉到具体行，文件+子串会让同子串新分支被静默放行）。
# fail-closed：本节缺失 / allow 条目缺字段 / crate 源码目录不存在 / crate 下
# 零 *.rs → FAIL，不静默放过。
# ---------------------------------------------------------------------------
[resource_kind_neutrality]
crates = ["nexus-registry", "nexus-planner", "nexus-session", "nexus-auth"]
variants = ["Network", "Service", "Workspace", "Compute", "Device"]

# 允许的特化点（穷举；当前为空 = 四 crate 零豁免，P1-5 已删除此前指向
# nexus-domain 的 5 条死 allow）。新增需评审＋更新本 policy，且条目必须同时
# 给出 file / line / contains / reason（P1-6），缺字段即 gate FAIL。

# ---------------------------------------------------------------------------
# Q6 依赖边门禁：冻结演进面（run dual-stack-convergence §2.6.2）
#
# `frozen_crates` 是冻结演进、只修缺陷/安全/崩溃一致性的 v9 CLI 运行时 crate
# （`nexus-connectivity`，划界见 ARCHITECTURE.md §6 与
# docs/adr/0001-dual-stack-boundary.md）。它们的**直接依赖方集合**是收敛成果，
# 由 harness gate 强制：实际直接依赖方（全部工作区包，含 app/engineering 宿主，
# normal 依赖）必须**集合相等**于 `allowed_dependents ∪ {allow.crate}` —— 多一个
# 是回归（新栈又反向依赖旧栈），少一个同样 FAIL（policy 与实际脱节）。
#
# 例外条目必须同时给出非空 `reason` 与合法、未过期的 `review_by`
# （YYYY-MM-DD，以运行当日为准；缺失/非法/过期一律 FAIL，不是 WARN）。
#
# 机器检查：harness gate `architecture-policy`（full）与 `architecture-delta`
# （fast）共用同一实现，两档都拦；策略见 §2.6.1（`actual − allowed` 非空即 FAIL）。
# ---------------------------------------------------------------------------
[dual_stack]
# 冻结演进的 v9 运行时 crate（当前仅一个）。
frozen_crates = ["nexus-connectivity"]
# 收敛后的直接依赖方闭集（集合相等判据；P1/P1'/P2/P3 全绿后才写目标值）。
allowed_dependents = ["nexus", "nexus-harness", "nexus-proxy"]

# 例外条目：必须同时给 reason 与 review_by；过期即 FAIL。当前无例外
# （P2 的 R2 v1.4 追认已完成，故走目标值路径，不写 allow）。
# [[dual_stack.allow]]
# crate = "<dependent>"
# reason = "<为什么暂时保留这条边 + 关联 Red Evidence/issue>"
# review_by = "YYYY-MM-DD"
