schema_version = 1
id = "product.fabric-projection-roam"
title = "投影层漫游：路径切换时 TUN 包流不中断、不丢包"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6"

[given]
topology = "loopback, Projection + MockTun + mock PathManager event (example binary)"
flow = "1000 IP packets, path switch simulated mid-stream"

# 可执行 E4：example 建双端 Projection -> 持续发包 ->
# 中途模拟路径切换事件（mock PathManager Switched） ->
# 验证切换后包流继续、总数一致、无重复 -> 输出 JSON。
[when]
command = "cargo run --quiet -p nexus-projection --example roam -- --json"

# 冻结期望（S1/S3/S4）。
[[expect]]
field = "verdict"
equals = "PASS"

# 切换前后包总数一致（S3 尽力语义下，mock 传输不应丢包）。
[[expect]]
field = "packets.sent"
equals = 1000

[[expect]]
field = "packets.received"
equals = 1000

# 包内容一致（S1）。
[[expect]]
field = "packets.bytes_match"
equals = true

# 确实发生了路径切换。
[[expect]]
field = "path.switched"
equals = true
