schema_version = 1
id = "product.remote-connectivity-failure-rollback"
title = "远程建连失败时按逆序幂等回滚到 Disposed 且 Owner 唯一提交 Failed"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
node_a = "requester"
node_b = "provider"
resource = "service"
endpoint = "node-b.invalid:9443"
auth = "pre-shared-token"

# 可执行 E4：组合根驱动远程建连失败路径并输出 JSON。
[when]
command = "cargo run --quiet -p nexus --example remote_connectivity_failure_rollback -- --json"

# 冻结期望：建连失败（CONNECTIVITY_ESTABLISHMENT_FAILED）、
# 逆序幂等回滚（K10）、Owner 唯一提交 Failed（PRODUCT §6/§7）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "connectivity.state"
equals = "Failed"

[[expect]]
field = "error.code"
equals = "CONNECTIVITY_ESTABLISHMENT_FAILED"

[[expect]]
field = "rollback.idempotent"
equals = true

[[expect]]
field = "rollback.drained_to_disposed"
equals = true

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Failed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "redundant_commit_rejected"
equals = true

# 失败发生在建连阶段而非解析阶段：Discovery 已解析出 Node B 并完成规划。
[[expect]]
field = "plan.provider_id"
equals = "node-b"

[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "discovery.endpoint"
non_empty = true
