schema_version = 1
id = "product.proxy-outbound-shadowsocks-flow"
title = "节点加密出站数据面：SOCKS5 会话经 Shadowsocks 隧道出站（loopback SS server + echo 目标）"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
topology = "same-process loopback 127.0.0.1: echo target + local SS server + nexus proxy (outbound=ss-node) + raw SOCKS5 client"
crypto = "method=chacha20-ietf-poly1305, password=demo, SsStream Role::Client/Server"
offline = "no public network; std::net::TcpStream + threads, joined"

# 可执行 E4：nexus proxy 数据面（PRODUCT §11.16）配置 outbound=shadowsocks 指向本地
# SS server；原始 SOCKS5 客户端经 proxy 访问 loopback echo。断言：SS server 实际收到
# 加密连接（server_connected）、request header 目标送达、payload 经加密隧道往返、
# routing.selected_outbound_tag=ss-node、routing.outbound_kind=shadowsocks。
# 旧实现（数据面直连出口）下 SS server 不会被连接 -> verdict FAIL（Red Evidence）。
[when]
command = "cargo run --quiet -p nexus --example proxy_outbound_shadowsocks_flow -- --json"

# 冻结期望（Spec-Freeze）：
# 节点型出站必须真实建连并完成加密隧道（不是直连伪装）；direct 行为由
# daemon_real_socks_proxy_flow 独立覆盖，本节不改动。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "ss_server.connected"
equals = true

[[expect]]
field = "ss_server.target_delivered_ok"
equals = true

[[expect]]
field = "client.auth_ok"
equals = true

[[expect]]
field = "client.connect_ok"
equals = true

[[expect]]
field = "client.payload_roundtrip_ok"
equals = true

[[expect]]
field = "routing.selected_outbound_tag"
equals = "ss-node"

[[expect]]
field = "routing.outbound_kind"
equals = "shadowsocks"

[[expect]]
field = "bytes.to_upstream"
non_empty = true

[[expect]]
field = "bytes.to_client"
non_empty = true
