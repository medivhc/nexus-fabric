schema_version = 1
id = "product.fabric-path-rebind"
title = "路径真实联动：PathManager 切换决策驱动 FabricConn::rebind()，传输不中断"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#4"

[given]
topology = "two nodes A and B, real QUIC FabricConn over UDP loopback (xc-pc-linux)"
packets = "deterministic: A sends N bytes over a bi stream while a path switch is triggered mid-transfer"

# 可执行 E4：example 在真机跑：
# - B: FabricListener::bind(127.0.0.1:0)；A: FabricConn::connect 真实 QUIC 建连
# - A 建 PathLink（PathManager + 两个候选路径 + peer→conn 映射）
# - A 开双向流，B 回显；A 分块发送 N=262144 字节
# - 传到一半：remove_candidate(当前活跃路径) → PathManager 发出 Switched
#   → 生产 PathLink::pump() → FabricConn::rebind()（新本地 UDP socket =
#   新源端口，模拟 WiFi→蜂窝地址变化；QUIC path validation 迁移，CID 不变）
# - 断言：B 收到总字节 == N（传输不中断）；conn.id() 切换前后不变；
#   B 侧观测到对端源端口变化（QUIC 迁移真实发生，非纯逻辑切换）
# - 沙箱 UDP EPERM 时输出 {"verdict":"SKIP","reason":"..."} 而非 FAIL
# - 只用公开 API + 可观测输出；禁止手动调 rebind() 冒充联动（必须走 pump()）
# PASS 路径的字段由实现者在真机上验证；本 scenario 只门禁"不 FAIL"
# （沙箱无 UDP 时允许 SKIP）。
[when]
command = "cargo run --quiet -p nexus-projection --example path_rebind -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
one_of = ["PASS", "SKIP"]
