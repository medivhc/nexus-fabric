schema_version = 1
id = "product.cli-run-command"
title = "nexus CLI run 命令：执行远程资源访问"
evidence_strength = "E4"
requirement = "PRODUCT.md#cli"

[given]
resource = "service"
peer = "node-b"

[when]
command = "cargo run --quiet -p nexus -- run service --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "run.resource"
equals = "service"

[[expect]]
field = "run.session_id"
non_empty = true

[[expect]]
field = "run.connectivity.status"
equals = "Connected"

[[expect]]
field = "run.outcome"
equals = "Completed"
