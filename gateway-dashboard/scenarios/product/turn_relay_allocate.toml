schema_version = 1
id = "product.turn-relay-allocate"
title = "TURN 中继分配：RFC5766 编解码 + 401 长期凭证重发 -> Allocated（离线 E4；真实公网 TURN P3）"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-turn"

# 真实性审计：与 nat-hole-punching 同诚实边界。本 E4 冻结期望为**可离线确定性验证**的
# 编解码正确性与分配状态机：Allocate Request 构造 + XOR-RELAYED-ADDRESS 解析 +
# MESSAGE-INTEGRITY（HMAC-SHA1）往返 + MockTurnTransport 驱动 401 挑战 -> 凭证重发 ->
# Allocated。真实公网 TURN 服务器 Allocate 与中继数据转发 pump 冻结在 P3（E5 外部观察）。

[given]
resource = "p2p-turn-relay"
turn_server = "turn.example.org:3478"
username = "nexus-node-a"
password = "secret-credential"
lifetime_secs = 600

# 可执行 E4：组合根驱动 TURN codec 自检 + MockTransport 分配闭环，输出 JSON。
[when]
command = "cargo run --quiet -p nexus --example turn_relay_allocate -- --json"

# 冻结期望：
# - codec 自检三项全 true（请求构造 / 响应解析 / 消息完整性往返）；
# - 401 挑战被捕获并提取 realm/nonce；
# - 分配状态 allocated，relayed_address 固定为 Mock 合成值 192.0.2.1:54320，expires=600；
# - 事件序列完整（allocate_sent -> auth_challenge_received -> allocate_success）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "codec.allocate_request_build_ok"
equals = true

[[expect]]
field = "codec.allocate_response_parse_ok"
equals = true

[[expect]]
field = "codec.message_integrity_ok"
equals = true

[[expect]]
field = "auth.challenge_received"
equals = true

[[expect]]
field = "auth.realm"
non_empty = true

[[expect]]
field = "auth.nonce"
non_empty = true

[[expect]]
field = "allocation.state"
equals = "allocated"

[[expect]]
field = "allocation.relayed_address"
equals = "192.0.2.1:54320"

[[expect]]
field = "allocation.expires_secs"
equals = 600

[[expect]]
field = "events.0"
equals = "allocate_sent"

[[expect]]
field = "events.1"
equals = "auth_challenge_received"

[[expect]]
field = "events.2"
equals = "allocate_success"
