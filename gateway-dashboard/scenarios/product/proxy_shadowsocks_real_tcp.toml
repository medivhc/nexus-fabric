schema_version = 1
id = "product.proxy-shadowsocks-real-tcp"
title = "Shadowsocks 真实 TCP 会话闭环：loopback server+client，AEAD 握手+目标地址送达+payload 往返"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
topology = "same-process loopback 127.0.0.1: echo target + SS server + SS client"
crypto = "method=chacha20-ietf-poly1305, password=demo, c2s/s2c keys via HKDF info"
offline = "no public network; std::net::TcpStream + threads, joined"

# Executable E4: example starts a loopback echo target + an SS server, then an SS client.
# Client seals an encrypted request header (target = echo) and a payload; server decrypts,
# connects to the echo target, relays, re-encrypts back; client decrypts and compares.
[when]
command = "cargo run --quiet -p nexus --example proxy_shadowsocks_real_tcp -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "method"
equals = "chacha20-ietf-poly1305"

[[expect]]
field = "handshake_ok"
equals = true

[[expect]]
field = "target_delivered_ok"
equals = true

[[expect]]
field = "payload_roundtrip_ok"
equals = true
