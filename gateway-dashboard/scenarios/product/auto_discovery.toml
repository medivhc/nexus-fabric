schema_version = 1
id = "product.auto-discovery"
title = "自动节点发现：引导注册 + 对等节点发现 + Direct/Relay 建连回退"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
bootstrap_nodes = "bootstrap-1,bootstrap-2"
self_node = "node-a"

# 可执行 E4：组合根驱动 引导注册自身 -> 对等发现 node-b/node-c ->
# 对每个 peer Direct 打洞失败回退 Relay 建连，输出 JSON。
[when]
command = "cargo run --quiet -p nexus --example auto_discovery -- --json"

# 冻结期望：最终 PASS；引导注册成功；节点状态 connected；发现 2 个 peer；事件序列非空。
# 语法说明：严格 TOML 不允许 [[expect]] 表头后同行续写键值，故展开为多行，
# 与仓库现有 product 场景（relay_fallback.toml / nat_hole_punching.toml）风格一致。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "bootstrap.registered"
equals = true

[[expect]]
field = "node.state"
equals = "connected"

[[expect]]
field = "discovered.count"
equals = 2

[[expect]]
field = "events"
non_empty = true
