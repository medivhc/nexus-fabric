schema_version = 1
id = "product.smart-retry-real"
title = "智能重试真实执行：真实指数退避循环，2 次可重试失败后第 3 次成功"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-smart-retry-real"

[given]
max_attempts = 5
initial_delay_ms = 20
backoff_factor = 2
failure_threshold = 2
circuit_open_ms = 200

[when]
command = "cargo run --quiet -p nexus --example smart_retry_real -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "command"
equals = "smart-retry-real"

# op 第 3 次成功，返回 42
[[expect]]
field = "result"
equals = 42

# 实际尝试 3 次
[[expect]]
field = "attempts"
equals = 3

# 成功后熔断器回到 closed
[[expect]]
field = "circuit_state"
equals = "closed"
