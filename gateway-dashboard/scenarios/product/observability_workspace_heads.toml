schema_version = 1
id = "product.observability-workspace-heads"
title = "§9 可观察性：nexus CLI thin-client 下 workspace heads 无路由 → 显式 UNSUPPORTED"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "workspace dag ready (init + two offline commits)"
observability = "head set snapshot via nexus-workspace DAG"

# requirement-change 2026-10-02（用户已批准）：2026-10-01 CLI 统一（01e5114）后 nexus
# 是 thin-client，不再在进程内执行观察命令；workspace heads 暂无 LocalAPI 路由，
# CLI 本地合成显式 UNSUPPORTED（PRODUCT §9 禁止静默降级；heads 需 <workspace> 参数）。
[when]
command = "cargo run --quiet -p nexus -- workspace heads ws1 --json"

# 冻结期望（2026-10-02）：无路由命令输出结构化 UNSUPPORTED FAIL JSON
#（与 nexusd 兜底同形；verdict=FAIL + error.code=UNSUPPORTED + error.command）。
[[expect]]
field = "verdict"
equals = "FAIL"

[[expect]]
field = "error.code"
equals = "UNSUPPORTED"

[[expect]]
field = "error.command"
equals = "workspace heads"
