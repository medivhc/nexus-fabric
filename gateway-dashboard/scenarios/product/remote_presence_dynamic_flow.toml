schema_version = 1
id = "product.remote-presence-dynamic-flow"
title = "Node B 发布动态 Presence，Node A 经动态发现解析后完成远程闭环"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
requester = "node-a"
provider = "node-b"
resource = "service"
discovery = "dynamic-presence"
auth = "pre-shared-token"
transport = "tcp-length-prefix-frame"

# 可执行 E4：与 Service/InternetAccess/Compute/Workspace 同一闭环骨架，但 Discovery 阶段
# 改为动态 Presence：Node B 向 PresenceRegistry announce（peer + endpoint + TTL），
# Node A 经 resolve 动态解析获得 Endpoint（取代静态表注入），随后完成完整远程访问。
[when]
command = "cargo run --quiet -p nexus --example remote_presence_dynamic_flow -- --json"

# 冻结期望：动态发现模式解析 Node B；Presence 已发布且 TTL 有效；全链 6 事件；
# 认证门控在业务帧前通过；Planner 决策 Provider = Node B；Session 双轨 Completed/Disposed 且
# TerminalOutcome 只提交一次；Service 会话 Active；架构不变量保持。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "discovery.mode"
equals = "dynamic"

[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "discovery.endpoint"
non_empty = true

# Presence：Node B 已发布、TTL 有效期内可解析。
[[expect]]
field = "presence.announced"
equals = true

[[expect]]
field = "presence.ttl_secs"
equals = 60

[[expect]]
field = "events.0"
equals = "remote_provider_resolved"

[[expect]]
field = "events.1"
equals = "plan_selected"

[[expect]]
field = "events.2"
equals = "session_created"

[[expect]]
field = "events.3"
equals = "connectivity_established"

[[expect]]
field = "events.4"
equals = "service_connected"

[[expect]]
field = "events.5"
equals = "remote_access_completed"

[[expect]]
field = "transport.kind"
equals = "tcp-frame"

[[expect]]
field = "auth.gate"
equals = "token_verified"

[[expect]]
field = "auth.principal"
non_empty = true

[[expect]]
field = "plan.provider_id"
equals = "node-b"

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Completed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "service.phase"
equals = "Active"

[[expect]]
field = "architecture.network_depends_on_ingress"
equals = false
