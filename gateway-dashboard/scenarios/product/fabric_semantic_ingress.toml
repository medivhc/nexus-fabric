schema_version = 1
id = "product.fabric-semantic-ingress"
title = "语义入口：SOCKS5/HTTP CONNECT 经统一路由走 fabric STREAM"
evidence_strength = "E4"
requirement = "docs/foundation/DESIGN.md#6.2"

[given]
topology = "two nodes A (ingress+originator) and B (egress), linked via MockTransport link_peer (E4)"
packets = "deterministic: in-process SOCKS5 and HTTP CONNECT clients"

# 可执行 E4：example 在本机跑：
# - echo TCP server 监听 127.0.0.1:PORT_E（回显任意字节）
# - 节点 A：SemanticIngress bind 127.0.0.1:0，UnifiedRouter 规则：
#   域名 localhost -> Egress{peer=B}（S16 域名优先）
# - 节点 B：egress TCP 中继（S22，支持 S25 域名形式 SYN）
# - client1：SOCKS5 握手（无认证）+ CONNECT localhost:PORT_E，
#   期望 0x00 成功；发送 "hello-3d"（8 字节），期望完整回显
# - client2：HTTP "CONNECT localhost:PORT_E HTTP/1.1"，
#   期望 "HTTP/1.1 200"；发送 "hello-3d-http"（12 字节），期望完整回显
# - 全程只用 "localhost" 域名（走 S25 域名形式 SYN，egress 侧解析），
#   不依赖外部 DNS；只用公开 API + 可观测输出，无"上帝之手"。
[when]
command = "cargo run --quiet -p nexus-projection --example semantic_ingress -- --json"

# 冻结期望。
[[expect]]
field = "verdict"
equals = "PASS"

# SOCKS5 CONNECT 往返成功。
[[expect]]
field = "socks5.roundtrip_ok"
equals = true

# HTTP CONNECT 往返成功。
[[expect]]
field = "http.roundtrip_ok"
equals = true

# 两条流的中继字节数（8 + 12 = 20）。
[[expect]]
field = "relayed_bytes"
equals = 20
