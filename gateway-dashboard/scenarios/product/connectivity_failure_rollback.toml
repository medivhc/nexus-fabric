schema_version = 1
id = "product.connectivity-failure-rollback"
title = "Connectivity 建连失败时按逆序幂等回滚到 Disposed"
evidence_strength = "E4"
requirement = "PRODUCT.md#session"

[given]
resource = "internet-access"
locator = "relay-b.exit"
require_authenticated = true

# 可执行 E4：组合根驱动认证门控失败路径并输出 JSON。
[when]
command = "cargo run --quiet -p nexus --example connectivity_failure_rollback -- --json"

# 冻结期望：认证门控失败（W12）、逆序幂等回滚、Owner 唯一提交 Failed。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "connectivity.state"
equals = "Failed"

[[expect]]
field = "rollback.idempotent"
equals = true

[[expect]]
field = "rollback.drained_to_disposed"
equals = true

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Failed"

[[expect]]
field = "plan.provider_id"
equals = "provider-relay-b"
