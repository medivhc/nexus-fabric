schema_version = 1
id = "product.subnet-punch-status"
title = "打洞状态观察通道：punch 结果持久化 → subnet status 复查 subnet.punch"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-punch-cli"

[given]
delivery = "real-udp-loopback"
punch = "observability-channel"
transport = "udp-datagram"

# 可执行 E4：与 subnet-punch-cli 同一 example——打洞成功后 status_recheck 反映
# 状态文件中的 subnet.punch（跨进程复查，不依赖 daemon 常驻）。
[when]
command = "cargo run --quiet -p nexus --example subnet_punch_cli"

# 冻结期望：打洞成功后 `subnet status` 输出 subnet.punch（state=Connected、
# succeeded=true、peer_vip 正确）——即打洞事件经状态文件可观察。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "status_recheck.verdict"
equals = "PASS"

[[expect]]
field = "status_recheck.subnet.punch.state"
equals = "Connected"

[[expect]]
field = "status_recheck.subnet.punch.succeeded"
equals = true

[[expect]]
field = "status_recheck.subnet.punch.peer_vip"
equals = "10.0.0.2"
