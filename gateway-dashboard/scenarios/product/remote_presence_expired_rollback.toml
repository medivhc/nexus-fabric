schema_version = 1
id = "product.remote-presence-expired-rollback"
title = "Node B 的 Presence 过期后 Node A 动态解析失败并回滚"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
requester = "node-a"
provider = "node-b"
resource = "service"
discovery = "dynamic-presence"
ttl = "expired"
expectation = "structured-rejection"

# 可执行 E4：Node B 以 TTL=0 发布 Presence（立即过期），Node A 动态解析失败
# （PeerExpired）——失败发生在 Discovery 阶段（未到 Plan/Session/Connectivity），
# 流程输出结构化拒绝（PEER_EXPIRED），不进入资源访问。
[when]
command = "cargo run --quiet -p nexus --example remote_presence_expired_rollback -- --json"

# 冻结期望：动态发现模式；解析失败事件；错误码 PEER_EXPIRED（不得返回过期 Endpoint）。
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "discovery.mode"
equals = "dynamic"

[[expect]]
field = "discovery.peer_id"
equals = "node-b"

[[expect]]
field = "events.0"
equals = "presence_resolution_failed"

[[expect]]
field = "error.code"
equals = "PEER_EXPIRED"

[[expect]]
field = "presence.announced"
equals = true

[[expect]]
field = "presence.expired"
equals = true
