schema_version = 1
id = "product.strategy-watcher"
title = "策略热加载 watcher：真实 TOML 文件变更驱动热切换"
evidence_strength = "E4"
requirement = "PRODUCT.md#12.58-strategy-hot-reload"

[given]
topology = "diamond: A-B(10ms), B-D(10ms), A-C(10ms), C-D(10ms)"
config = "temp TOML file with [routing] strategy"
watcher = "StrategyWatcher polls file, mtime + FNV-1a content hash"
fail_closed = "invalid strategy content -> ParseFailed event, FIB unchanged"

# 可执行 E4：watcher 真实文件驱动验证
#   initial_shortest         初始 Shortest：A->D 1 条下一跳
#   watcher_started          watcher 启动并运行
#   watcher_reloaded_to_ecmp 文件改为 ecmp → watcher 检测 → FIB 重算为 2 条下一跳，generation 1->2
#   invalid_kept_old_strategy 非法内容 → ParseFailed 事件，FIB 保持 ECMP，generation 不变
#   stopped_clean            stop() 后线程回收，事件缓冲可查询
[when]
command = "cargo run --quiet -p nexus --example strategy_watcher -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "initial_shortest"

[[expect]]
field = "events.1"
equals = "watcher_started"

[[expect]]
field = "events.2"
equals = "watcher_reloaded_to_ecmp"

[[expect]]
field = "events.3"
equals = "invalid_kept_old_strategy"

[[expect]]
field = "events.4"
equals = "stopped_clean"

[[expect]]
field = "watcher.generation"
equals = 2

[[expect]]
field = "watcher.next_hops"
equals = 2
