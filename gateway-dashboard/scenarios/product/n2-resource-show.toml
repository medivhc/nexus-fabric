schema_version = 1
id = "product.n2-resource-show"
title = "nexus resource show <name>：资源详情（含双层授权字段与可用状态）"
evidence_strength = "E4"
requirement = "PRODUCT.md#16-n2-resource-access"

[given]
# P0-0 契约冻结（2026-10-03）：`nexus resource show` 在 P0-2/P0-4 实现，
# 此处先冻结期望。
# requirement-change 注释：本场景为新契约（contract-first）；当前实现尚无
# `resource` 子命令，预期 Red（FAIL：unknown command，exit 2，无 JSON 输出）。
# D2：Registry 契约三件套——discoverable_by vs use_grants 双层授权字段；
# 三种不可用原因（ProviderOffline / HealthDegraded / NotAcceptingWork）的
# 结构化区分；过期广告拒绝（AdvertisementExpired）。
# kind 不进地址（目录属性）；ResourceRef{workspace, name}。
# E4 前置：node-b 已注册 Service 资源 dev-svc。
[when]
command = "cargo run --quiet -p nexus -- resource show dev-svc --json"

# 冻结期望（实现后必须满足）：
# - verdict=PASS；resource.name=dev-svc；resource.kind=service（目录属性）
# - resource.provider 非空（当前提供方）
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "resource.name"
equals = "dev-svc"

[[expect]]
field = "resource.kind"
equals = "service"

[[expect]]
field = "resource.provider"
non_empty = true
