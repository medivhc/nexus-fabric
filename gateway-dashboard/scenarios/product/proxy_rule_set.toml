schema_version = 1
id = "product.proxy-rule-set"
title = "rule-providers：domain / ipcidr / classical 三种行为规则集引用"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
command = "proxy route"
rule_kind = "rule_set"
data = "injected providers (cn-domains:domain, cn-nets:ipcidr, ads:classical)"
network = "none (offline data injection)"

# 可执行 E4：组合根注入三个 rule-provider（domain 域名清单 / ipcidr 网段 /
# classical 规则行），SOCKS5 CONNECT 四目标分别命中对应 provider 内的规则；
# 未命中任何 provider 的流量走 MATCH。
[when]
command = "cargo run --quiet -p nexus --example proxy_rule_set -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "case_domain.rule_kind"
equals = "rule_set"

[[expect]]
field = "case_domain.matched_rule"
equals = "rule-provider-cn-domains"

[[expect]]
field = "case_cidr.rule_kind"
equals = "rule_set"

[[expect]]
field = "case_cidr.matched_rule"
equals = "rule-provider-cn-nets"

[[expect]]
field = "case_classical.rule_kind"
equals = "rule_set"

[[expect]]
field = "case_classical.matched_rule"
equals = "rule-provider-ads"

[[expect]]
field = "case_miss.rule_kind"
equals = "match"
