schema_version = 1
id = "product.observability-workspace-conflicts"
title = "§9 可观察性：nexus CLI thin-client 下 workspace conflicts 无路由 → 显式 UNSUPPORTED"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "workspace dag ready (two heads diverge on same path)"
observability = "merge conflict snapshot via nexus-workspace merge_heads"

# requirement-change 2026-10-02（用户已批准）：2026-10-01 CLI 统一（01e5114）后 nexus
# 是 thin-client，不再在进程内执行观察命令；workspace conflicts 暂无 LocalAPI 路由，
# CLI 本地合成显式 UNSUPPORTED（PRODUCT §9 禁止静默降级）。
# 与 2026-09-20 冻结的 cli_workspace_conflicts.toml 合同一致。
[when]
command = "cargo run --quiet -p nexus -- workspace conflicts ws1 --json"

# 冻结期望（2026-10-02）：无路由命令输出结构化 UNSUPPORTED FAIL JSON。
[[expect]]
field = "verdict"
equals = "FAIL"

[[expect]]
field = "error.code"
equals = "UNSUPPORTED"

[[expect]]
field = "error.command"
equals = "workspace conflicts"
