schema_version = 1
id = "product.fib-manager"
title = "FIB 管理器：LSDB 指纹触发重算、代际管理"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-fib-manager"

[given]
api = "FibManager::new/maybe_recompute/fib/generation/select"
fingerprint = "FNV-1a 64 over (node_id, incarnation, seq, neighbors) of all LSAs"
topology = "diamond A-B/C-D; then add node E"

# 可执行 E4：FIB 管理器生命周期
#   initial_computed       new 后 FIB 可用，generation=1
#   no_change_no_recompute 无变化时返回 false，generation 不变
#   topo_change_recomputes  新增节点后返回 true，generation=2，FIB 含 E
#   select_via_manager     经 select 按流哈希选下一跳
[when]
command = "cargo run --quiet -p nexus --example fib_manager -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "events.0"
equals = "initial_computed"

[[expect]]
field = "events.1"
equals = "no_change_no_recompute"

[[expect]]
field = "events.2"
equals = "topo_change_recomputes"

[[expect]]
field = "events.3"
equals = "select_via_manager"

[[expect]]
field = "manager.initial_generation"
equals = 1

[[expect]]
field = "manager.after_change_generation"
equals = 2
