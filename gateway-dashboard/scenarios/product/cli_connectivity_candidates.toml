# 无 daemon 路由的命令输出结构化 UNSUPPORTED FAIL JSON（与 nexusd 兜底同形）。
# Red Evidence：verify-e003ba88e02b（旧期望 PASS 数据在 thin-client 实现上 9/9 FAIL）。
