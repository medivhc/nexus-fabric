schema_version = 1
id = "product.cli-connectivity-candidates"
title = "nexus CLI thin-client：connectivity candidates 无 daemon 路由 → 显式 UNSUPPORTED（--json）"
evidence_strength = "E4"
requirement = "PRODUCT.md#9-observability"

[given]
domain_state = "link candidates ready (direct + relay by LinkKind)"
cli_frontend = "nexus CLI 为 thin-client：connectivity candidates 暂无 LocalAPI 路由，CLI 本地合成显式 UNSUPPORTED（不回退进程内 observability，PRODUCT §9 禁止静默降级）"

[when]
command = "cargo run --quiet -p nexus -- connectivity candidates --json"

