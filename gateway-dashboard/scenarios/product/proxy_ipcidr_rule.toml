schema_version = 1
id = "product.proxy-ipcidr-rule-match"
title = "目的为 IP literal 命中 IP-CIDR 规则 -> 走指定 relay 策略组"
evidence_strength = "E4"
requirement = "PRODUCT.md#11-proxy-kernel"

[given]
inbound = "socks5 (reuse nexus-ingress Socks5Handshake)"
rule_table = "static ordered: IP-CIDR 10.0.0.0/8 -> relay-group; MATCH -> fallback"
flow = "CONNECT 10.1.2.3:8080"
matching = "first-match wins; IP literal not domain"

# 可执行 E4：组合根 example 驱动 SOCKS5 握手完成（目的为 IPv4 literal），
# 经 RuleEngine 执行顺序匹配；10.1.2.3 落在 10.0.0.0/8 网段，命中 IP-CIDR
# 规则，动作链首动作 SELECT_OUTBOUND 指向 relay-group 策略组。
# 断言确定性字段：verdict、flow_origin、matched_rule、rule_kind、
# selected_group_tag。禁止断言时序/外部资源/真实网络探测。
[when]
command = "cargo run --quiet -p nexus --example proxy_ipcidr_rule -- --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "flow_origin"
equals = "socks5"

[[expect]]
field = "matched_rule"
equals = "rule-internal-cidr"

[[expect]]
field = "rule_kind"
equals = "ip_cidr"

[[expect]]
field = "selected_group_tag"
equals = "relay-group"

[[expect]]
field = "first_action"
equals = "select_outbound"
