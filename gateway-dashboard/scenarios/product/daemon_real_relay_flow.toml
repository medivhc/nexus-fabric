schema_version = 1
id = "product.daemon-real-relay-flow"
title = "真实 TCP 交付：直连不可达回退真实 relay 字节中继"
evidence_strength = "E4"
requirement = "PRODUCT.md#remote"

[given]
delivery = "real-transport"
direct = "unreachable"
fallback = "real-relay-byte-forwarding"

# 可执行 E4：SDK 真实网络切片——直连候选为未监听地址（与 NAT 外部探测失败同构），
# 请求方回退到真实 relay（DIAL + 双向字节中继）后完成线上认证与 ECHO 往返。
[when]
command = "cargo run --quiet -p nexus --example remote_real_relay_flow"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "link.direct_attempted"
equals = true

[[expect]]
field = "link.relay_used"
equals = true

[[expect]]
field = "auth.gate"
equals = "auth_ok"

[[expect]]
field = "echo.roundtrip_matched"
equals = true

[[expect]]
field = "session.phase"
equals = "Disposed"

[[expect]]
field = "session.outcome"
equals = "Completed"

[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "relay.sessions"
equals = 1
