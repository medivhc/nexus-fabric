schema_version = 1
id = "product.health-check"
title = "节点健康检查：连续失败计数与三态健康转移"
evidence_strength = "E4"
requirement = "PRODUCT.md#12-health-check"

[given]
probe_interval_ms = 1000
timeout_ms = 500
failure_threshold = 3

[when]
command = "cargo run --quiet -p nexus --example health_check -- --json"

# 新节点首次探测成功 → 初始 Healthy
[[expect]]
field = "initial_node_state"
equals = "healthy"

# 连续失败 1 次（consecutive=1 < threshold=3）→ Degraded
[[expect]]
field = "after_one_failure"
equals = "degraded"

# 连续失败 2 次（consecutive=2 < 3）→ 仍为 Degraded（到达 threshold 前）
[[expect]]
field = "after_two_failures"
equals = "degraded"

# 连续失败 3 次（consecutive=3 >= 3）→ Unhealthy
[[expect]]
field = "at_threshold_failure"
equals = "unhealthy"

# 一次成功立即恢复 → Healthy
[[expect]]
field = "after_recovery"
equals = "healthy"

# 对从未记录的节点查询状态 → UnknownNode 错误路径
[[expect]]
field = "unknown_node_error"
equals = "unknown_node"
