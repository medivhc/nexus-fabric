schema_version = 1
id = "product.workspace-gc"
title = "Workspace 存储治理（v9 §20）：Reachability GC 两阶段回收"
evidence_strength = "E4"
requirement = "v9 §20 Workspace DAG Compaction、Shallow Sync 与 CAS GC"

[given]
description = "填满 CAS（可达对象 + 孤儿对象 + 历史 state 对象）→ plan_gc 计算可达闭包 → tombstone 两阶段 → sweep；Protected Roots 存活，孤儿对象被清，pin 阻止删除"

[when]
command = "cargo run --quiet -p nexus-workspace --example workspace_gc -- --json"

# 冻结期望（语义来源：v9 §20）：
# - 可达对象（manifest 引用的内容、当前 state_root）永不删除
# - 不可达孤儿对象经 tombstone 后被物理删除
# - active pin 阻止删除（即使不可达）
# - 先生成 Tombstone/Deletion Intent，再物理删除（两阶段）
# - 不删除仍可达或未合并的数据（AGENTS.md §25 Stop Conditions）
[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "protected_survived"
equals = true

[[expect]]
field = "old_orphan_swept"
equals = true

[[expect]]
field = "pinned_orphan_survived"
equals = true

[[expect]]
field = "tombstones_created"
equals = 5

[[expect]]
field = "swept_total"
equals = 5

[[expect]]
field = "reachable_count"
equals = 7
