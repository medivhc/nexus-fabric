schema_version = 1
id = "engineering.harness-verify-fast-evidence"
title = "绿色仓库中 nexus-harness verify --fast 产生绑定 revision 的 PASS Evidence"
evidence_strength = "E4"
requirement = "DEVELOPMENT.md#6"

[given]
workspace = "green"
working_tree = "clean"
has_commit = true

[when]
command = "nexus-harness verify --fast --json"

[[expect]]
field = "verdict"
equals = "PASS"

[[expect]]
field = "evidence.verdict"
equals = "PASS"

[[expect]]
field = "evidence.bindings.source_revision"
non_empty = true

[[expect]]
field = "evidence.bindings.working_tree_digest"
non_empty = true

[[expect]]
field = "evidence.bindings.configuration_digest"
non_empty = true
