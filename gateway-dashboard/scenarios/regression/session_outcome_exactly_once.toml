schema_version = 1
id = "regression.session-outcome-exactly-once"
title = "取消、成功、断链竞争时 TerminalOutcome 只提交一次"
evidence_strength = "E3"

[given]
race = ["worker_success", "cancel_requested", "network_disconnect"]

# 可执行 E3：nexus-session 的 example 模拟多次竞争（worker_success /
# cancel_requested / network_disconnect 三种源竞争提交 TerminalOutcome），
# 输出单个 JSON 对象供 harness 按路径求值。
[when]
command = "cargo run --quiet -p nexus-session --example session_outcome_exactly_once -- --json"

# 冻结期望（与初版静态契约同语义，转为可机检路径）：
# 竞争下 TerminalOutcome 只提交一次；竞争结束后生命周期到达 Disposed。
[[expect]]
field = "terminal_outcome_commit_count"
equals = 1

[[expect]]
field = "lifecycle_phase"
equals = "Disposed"
