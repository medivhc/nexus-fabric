[package]
name = "nexus-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexus-domain = { path = "../nexus-domain" }

# 跨 crate 并发测试统一放在仓库根 tests/concurrency/（见 tests/README.md），
# 通过显式 target 挂到被测 crate，使虚拟工作区根目录可用 `cargo test --test <name>`。
[[test]]
name = "session_outcome_race"
path = "../../tests/concurrency/session_outcome_race.rs"

[[test]]
name = "cancellation_shutdown_race"
path = "../../tests/concurrency/cancellation_shutdown_race.rs"
