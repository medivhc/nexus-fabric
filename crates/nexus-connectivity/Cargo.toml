[package]
name = "nexus-connectivity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexus-delivery = { path = "../nexus-delivery" }
nexus-platform = { path = "../nexus-platform" }
# 链路加密基元（X25519 身份密钥 / HKDF-SHA256 / ChaCha20Poly1305 AEAD）。
# P4.1 §12.39：ring 0.17 不公开私钥序列化，长期身份密钥改用 x25519-dalek
# （纯 Rust、no_std 兼容、Apache-2.0/MIT，WireGuard/Noise 生态标准实现）；
# HKDF 与 AEAD 继续使用 ring（已在 workspace 依赖树，此处仅声明直接使用）。
ring = { version = "0.17", default-features = false, features = ["std"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
# 数据面真实压缩（PRODUCT §12.41）：gzip 用 flate2 的纯 Rust 后端（不依赖系统 zlib，
# 保持 portable）；lz4 用 lz4_flex（纯 Rust、no_std 兼容）。均 default-features=false。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.11", default-features = false }
