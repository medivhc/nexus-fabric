[package]
name = "nexus-proxy-transport"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "QUIC over SOCKS5 CONNECT: length-prefixed framing over TCP, implements nexus-fabric UdpTransport (DESIGN §3.5)"

[dependencies]
nexus-fabric = { path = "../nexus-fabric" }
# T 期：仅复用密码学/握手原语与配置结构（T3/T4）；零新增第三方依赖。
nexus-outbound-shadowsocks = { path = "../nexus-outbound-shadowsocks" }
nexus-outbound-trojan = { path = "../nexus-outbound-trojan" }
nexus-proxy-config = { path = "../nexus-proxy-config" }

[dev-dependencies]

[[example]]
name = "proxy_quic"
path = "examples/proxy_quic.rs"

[[example]]
name = "proxy_ss_quic"
path = "examples/proxy_ss_quic.rs"

[[example]]
name = "proxy_trojan_quic"
path = "examples/proxy_trojan_quic.rs"
