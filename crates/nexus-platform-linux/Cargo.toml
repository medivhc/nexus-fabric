[package]
name = "nexus-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexus-platform = { path = "../nexus-platform" }
# fuser: pure-Rust FUSE (no libfuse link); mount via fusermount(1) or /dev/fuse.
# Linux-only adapter (v9 §22 D4=A); other platforms get their own adapters.
fuser = "0.18"
# TPROXY capture: socket2 for sockaddr/inspection, libc for IP_TRANSPARENT /
# IP_RECVORIGDSTADDR / IP_PKTINFO setsockopt + ancillary cmsg (spec §9.1).
# Both are Linux-only adapter dependencies; portable core never sees them.
socket2 = { version = "0.6", default-features = false }
libc = "0.2"

[dev-dependencies]
# E4 example only: build a real workspace to project through FUSE.
# Production code never depends on nexus-workspace (v9 §4 edge rule).
nexus-workspace = { path = "../nexus-workspace" }
nexus-storage = { path = "../nexus-storage" }
