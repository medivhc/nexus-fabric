[package]
name = "nexus-web-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser zero-install WebRTC gateway: HTTPS/WSS signaling + node-side WebRTC endpoint + SSH TCP forward"

[lints]
workspace = true

[dependencies]
# str0m: sans-IO WebRTC stack (no async runtime, fits the repository's std-only
# posture). rust-crypto backend = pure Rust, no C build. MIT/Apache-2.0.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
# tungstenite: sync WebSocket protocol (server + client), works over any
# Read+Write stream (rustls StreamOwned). No tokio. MIT/Apache-2.0.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# rustls: TLS 1.3 server/client for HTTPS + WSS + mesh WSS client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# rcgen: local CA self-signed certificates (node signs its LAN/VPN IPs).
# ring backend matches the workspace's rustls/ring provider.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
# serde/serde_json: JSON protocol messages and config.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# sha1 + base64: RFC 6455 Sec-WebSocket-Accept computation.
sha1 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
# tracing: structured logs (already in the workspace tree via str0m/nexus crates).
tracing = { version = "0.1", default-features = false, features = ["std"] }
# ssh2: node-side real SSH client (libssh2). The node speaks the SSH protocol
# to the target sshd and authenticates with the browser's form credentials;
# the browser DataChannel carries only the terminal byte stream (pty layer).
ssh2 = { version = "0.9", default-features = false }