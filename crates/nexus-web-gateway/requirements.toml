[[req]]
id = "REQ-014"
title = "文件面配置接线与 kill switch（files 段进 GatewayConfig）"
status = "doing"
priority = "P0"
acceptance = '`files` 段缺省存在且 `enabled=false`（升级二进制前写过的配置不得因新功能报错——absent_section_is_disabled）；关断不是免责：数值自洽性（含 G12 全部交叉约束与两侧时长界）在 enabled=false 时同样被拒（disabled_still_rejects_*，r2 W-7 与 r9 R9-W-2 的"开关不当检验豁免"口径）；enabled=true 时令牌、根、别名非空且不重名（enabled_without_*/*_root_alias_*）；`GatewayConfig::file_engine()` 是从配置起引擎的唯一入口（边界按 r13 W-2 写明：FileEngine::new 本身仍是 pub，lib.rs:20 公开 file_service，探针与引擎单测直接调它，所以这句只约束"从配置构造"这条路），先 validate 再逐根 SandboxRoot::open，关断时返回 None 即"没有可寻址的引擎"而不是"有引擎但每次记得查标志"（disabled_yields_no_engine/valid_config_launches_engine）；数值镜像逐字段精确、时长按秒换算成引擎 Duration（limits_round_trip_is_exact/durations_map_to_engine_units）；JSON 往返不丢这一段（files_section_survives_json_round_trip）。缝上不可替代的那半由两条只存在于配置层的规则钉住（r13 W-1：数值表那条红是词法的，因为 FileEngine::new 第一句就复检 limits，删掉缝里那句它照样拒）：只含空白但非空的令牌（引擎只查 is_empty）与空白根别名（SandboxRoot::open 和 FileEngine::new 都不看别名内容）——blank_token_yields_no_engine/blank_alias_yields_no_engine。承载体：product.gateway-file-config（25 条期望，E4）+ config.rs 的 12 条单测；变异表 MC01–MC20（20 条配方，唯一口径 = 可达提交 8b07af8，git branch --contains 实测非空；r13 W-4 与 r14 W-2 前后各踩过一次：口径树 fa2f81d 与提交前树 046c39e 都是 stash 形态、推下去就不可取）入库两处：脚本 crates/nexus-web-gateway/tools/mutation-gateway-file-config.py 与原始输出 .agents/mutation-log-gateway-file-config.txt，第三方不靠我的 Linux 机也能重算。覆盖率实数：25 个 field 里 23 个是断言（verdict/case 是元信息与形参），这 23 条每一个都至少被一条配方以翻自己那一格的方式打过，20 条配方无一零杀伤；上一版（18 条配方、0dbc1d2 口径）是 19 条，旧数保留不抹，因为它是那张表的实数——其中 MC07（删掉缝里那句先 validate）在第一版对象集上实测 0 红 0 翻转，invalid_table_yields_no_engine 是补上去才有对象的；MC01/MC02 也一样，只断言 is_err() 时零杀伤，改成断言错误串带层标签才各自 1 红 1 翻转。**尚未证的那半**：Gateway::start 还没消费 file_engine()，线上也没有文件动词分发，所以"拒启动"当前成立在构造缝上而非进程路径上，M2 接线时必须补"关断时动词到不了"的对象（G12/M2 残差）（G12；product.gateway-file-config）'
created = "2026-10-14"
