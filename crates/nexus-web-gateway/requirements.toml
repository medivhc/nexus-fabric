[[req]]
id = "REQ-010"
title = "文件令牌鉴权与失败节流锁定"
status = "doing"
priority = "P0"
acceptance = '独立于页面登录的配置令牌 + 常数时间比较，且短路发生在比较之前（token_comparisons 计数可证：可比较的尝试恰好 +1，锁定/源锁短路的尝试 +0）；失败按（主体+源）成对键（定长 SHA-256 摘要，两半带长度前缀）节流，达阈值锁定，锁定窗口内正确口令也不绕过；计数与表项有界（行由准入行门禁有界、锁由 locked ≤ buckets ≤ max 有界且两侧各有读侧观测，键定长 32 字节），桶与溢出计数按 lockout_window 衰减 ⇒ 洪水不永久占位、停止注入一个窗口内自愈；单地址每窗口失败受 max_failures_per_source 限额：源锁表还有位置时只锁这个地址、不牵连他人也不升级为全体拒服务，而源账本与源锁表各自也受 max_throttle_buckets 门禁（锁表满时与两层键同形，升级为全局窗口——不留无界表项）；空 source 在认证处即拒（它不能当归属凭证），且引擎不归一化地址：认证与终止两处必须由同一供给点给出同一字符串，否则合法所有者关不掉自己的会话，两种写法还各拿一份单源额度（r11 R11-W-2：这条字符串实际有**五个**消费点——(主体,源) 摘要键的一半、源账本、源锁、per-peer 配额、close_session 归属；只数"四处"的旧写法已作废）。这两格都有机验对象：把地址差异从源摘要里去掉 ⇒ 最终复验树实测 6 条单测红 + 6 条期望翻转（70 条单测那棵树是 5 + 6，多的那条正是后来新增的源锁过期回收测试）。**pair 侧那一半也一样有对象**（r12 R12-W-1：先前只钉住"摘要吃不吃地址"这个机制，没钉"门槛翻倍"这个数量后果）：单测 `same_principal_with_two_address_spellings_doubles_the_pair_threshold` 与同名冻结期望 `pair_threshold_doubles_across_address_spellings` 断言"交替喂 2×(lockout_after-1) 条不武装、同总量的单一写法必须已武装、且桶数恰为 2"，把 `identity_key` 里喂 source 的那半整块去掉即打红它（配方与红数记在案卷《第十一片》的 r12 段）；M2 接线时按这份五点清单逐处核；close_session 必须出示与会话相同的传输地址（未知与不属于自己在返回值与审计行四格上逐字同形），被拒时不终止会话、不删他人 .part、不释放其预算；close_session 与闲置回收都不清节流状态，计数只由成功认证与窗口衰减清理；归属检查目前只覆盖 close_session，abort_upload 等按 id 删除的动词保留同一残余到 M2（G15/G16；product.gateway-file-auth-throttle）'
created = "2026-10-11"

