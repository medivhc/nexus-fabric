[package]
name = "nexus-outbound-hysteria2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hysteria2 outbound adapter: QUIC (quinn-proto sans-IO) + minimal HTTP/3 auth + TCP/UDP proxy frames + Salamander obfuscation (clean-room)"

[lints]
workspace = true

[dependencies]
nexus-proxy-config = { path = "../nexus-proxy-config" }
# QUIC：复用 workspace 已有的 quinn-proto 0.11（vendor patch），sans-IO + 自写同步 driver；
# 不引入 quiche（见 MODULE.md QUIC 选型结论）。
quinn-proto = { version = "0.11", default-features = false, features = ["rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
ring = "0.17"
rcgen = "0.13"
sha2 = "0.10.9"
blake2 = { version = "0.10", default-features = false }
bytes = "1"
