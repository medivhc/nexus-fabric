name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FAILED=0
          for SHA in $(git rev-list "$BASE..$HEAD"); do
            MSG=$(git log --format=%s -n 1 "$SHA")
            # Project convention: type(scope): summary
            # type: feature|bugfix|refactor|test|docs|performance|dependency|requirement-change
            if ! echo "$MSG" | grep -Eq '^(feature|bugfix|refactor|test|docs|performance|dependency|requirement-change)(\([a-z0-9-]+\))?: .{1,100}$'; then
              echo "❌ $SHA: $MSG"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "See CONTRIBUTING.md for commit message format"
            exit 1
          fi
          echo "✅ All commit messages valid"
