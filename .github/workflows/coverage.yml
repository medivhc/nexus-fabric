name: coverage

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXUS_COVERAGE_MIN_LINES: "60"
    steps:
      - uses: actions/checkout@v4

      # Toolchain is locked by rust-toolchain.toml (1.98.1, components
      # include llvm-tools-preview). Do NOT pass an explicit
      # `toolchain: stable` here: that makes this step install the floating
      # stable toolchain, splitting the job across two toolchains — test
      # binaries get built by newer stable while cargo-llvm-cov merges
      # profiles with the pinned toolchain's llvm-profdata, which then
      # rejects the newer profraw encoding ("unrecognized instrumentation
      # profile encoding format" / "no profile can be merged").
      # Shape mirrors ci-verify.yml.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run workspace coverage gate
        run: bash scripts/coverage.sh

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: warn
          retention-days: 14
