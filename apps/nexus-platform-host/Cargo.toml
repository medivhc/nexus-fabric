[package]
name = "nexus-platform-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexus-platform = { path = "../../crates/nexus-platform" }
nexus-platform-linux = { path = "../../crates/nexus-platform-linux", optional = true }
nexus-platform-windows = { path = "../../crates/nexus-platform-windows", optional = true }
nexus-platform-macos = { path = "../../crates/nexus-platform-macos", optional = true }
nexus-platform-android = { path = "../../crates/nexus-platform-android", optional = true }
nexus-platform-ios = { path = "../../crates/nexus-platform-ios", optional = true }

[features]
default = []
platform-linux = ["dep:nexus-platform-linux"]
platform-windows = ["dep:nexus-platform-windows"]
platform-macos = ["dep:nexus-platform-macos"]
platform-android = ["dep:nexus-platform-android"]
platform-ios = ["dep:nexus-platform-ios"]
