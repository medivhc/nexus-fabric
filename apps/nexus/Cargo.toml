[package]
name = "nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexus-control-api = { path = "../../crates/nexus-control-api" }
# Composition Root：仅 app 允许把各 portable-core 纵切装配到一起（crates 之间的
# 依赖边仍由 policies/architecture.toml 约束，app 不在该约束的 crates/ 集合内）。
nexus-domain = { path = "../../crates/nexus-domain" }
nexus-ingress = { path = "../../crates/nexus-ingress" }
nexus-policy = { path = "../../crates/nexus-policy" }
nexus-registry = { path = "../../crates/nexus-registry" }
nexus-measurement = { path = "../../crates/nexus-measurement" }
nexus-planner = { path = "../../crates/nexus-planner" }
nexus-session = { path = "../../crates/nexus-session" }
nexus-connectivity = { path = "../../crates/nexus-connectivity" }
nexus-discovery = { path = "../../crates/nexus-discovery" }
nexus-transport = { path = "../../crates/nexus-transport" }
nexus-auth = { path = "../../crates/nexus-auth" }
nexus-service = { path = "../../crates/nexus-service" }
nexus-platform = { path = "../../crates/nexus-platform" }
serde_json = { version = "1", default-features = false, features = ["std"] }
