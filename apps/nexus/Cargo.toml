[package]
name = "nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nexus-control-api = { path = "../../crates/nexus-control-api" }
# Composition Root：仅 app 允许把各 portable-core 纵切装配到一起（crates 之间的
# 依赖边仍由 policies/architecture.toml 约束，app 不在该约束的 crates/ 集合内）。
nexus-domain = { path = "../../crates/nexus-domain" }
nexus-ingress = { path = "../../crates/nexus-ingress" }
nexus-proxy-config = { path = "../../crates/nexus-proxy-config" }
nexus-proxy = { path = "../../crates/nexus-proxy" }
nexus-projection = { path = "../../crates/nexus-projection" }
nexus-policy = { path = "../../crates/nexus-policy" }
nexus-registry = { path = "../../crates/nexus-registry" }
nexus-measurement = { path = "../../crates/nexus-measurement" }
nexus-planner = { path = "../../crates/nexus-planner" }
nexus-scheduler = { path = "../../crates/nexus-scheduler" }
nexus-session = { path = "../../crates/nexus-session" }
nexus-connectivity = { path = "../../crates/nexus-connectivity" }
nexus-turn = { path = "../../crates/nexus-turn" }
nexus-discovery = { path = "../../crates/nexus-discovery" }
nexus-transport = { path = "../../crates/nexus-transport" }
nexus-auth = { path = "../../crates/nexus-auth" }
nexus-service = { path = "../../crates/nexus-service" }
nexus-network = { path = "../../crates/nexus-network" }
# N1 装配（M6）：Composition Root 经注入 trait 消费 fabric/path。
nexus-fabric = { path = "../../crates/nexus-fabric" }
nexus-path = { path = "../../crates/nexus-path" }
nexus-proxy-transport = { path = "../../crates/nexus-proxy-transport" }
nexus-compute = { path = "../../crates/nexus-compute" }
nexus-workspace = { path = "../../crates/nexus-workspace" }
nexus-workspace-intel = { path = "../../crates/nexus-workspace-intel" }
nexus-dns = { path = "../../crates/nexus-dns" }
nexus-outbound-shadowsocks = { path = "../../crates/nexus-outbound-shadowsocks" }
nexus-outbound-vmess = { path = "../../crates/nexus-outbound-vmess" }
nexus-outbound-trojan = { path = "../../crates/nexus-outbound-trojan" }
nexus-outbound-anytls = { path = "../../crates/nexus-outbound-anytls" }
nexus-outbound-vless = { path = "../../crates/nexus-outbound-vless" }
nexus-outbound-hysteria2 = { path = "../../crates/nexus-outbound-hysteria2" }
# Hysteria2 装配需要 quinn-proto::StreamId（pump helper 签名）；版本与
# nexus-outbound-hysteria2 一致，走 workspace [patch.crates-io] 的 vendor 版。
quinn-proto = { version = "0.11", default-features = false, features = ["rustls", "ring"] }
nexus-plugin = { path = "../../crates/nexus-plugin" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = { version = "0.8", default-features = false }
nexus-storage = { path = "../../crates/nexus-storage" }
nexus-platform = { path = "../../crates/nexus-platform" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# D8：LocalAPI bearer token 生成（32 随机字节）；纯随机源，无其他用途。
getrandom = { version = "0.2", default-features = false }
# N2 P0-4 D6：ed25519 授权身份密钥对（ring 已在树内：nexus-discovery 配对协议、
# nexus-fabric PeerId-pinning 在用；此处仅用 Ed25519KeyPair::from_seed_unchecked）。
ring = { version = "0.17", default-features = false }
toml = "0.8"
# mDNS 组合根 socket 装配（bind 5353 + SO_REUSEADDR + 加入组播组）；
# std 无法设置 SO_REUSEADDR。D-D-1 评审批准，仅限组合根（apps/nexus）使用，
# nexus-discovery 保持零第三方依赖、零 I/O。
socket2 = { version = "0.6", default-features = false }

[dev-dependencies]
# 仅示例/测试：本地 TLS server 自签证书（§11.14 E5 离线确定性闭环）。
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[target.'cfg(windows)'.dependencies]
nexus-platform-windows = { path = "../../crates/nexus-platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
nexus-platform-linux = { path = "../../crates/nexus-platform-linux" }
