# 真实 trojan 节点形态样例（PRODUCT §11.9.3）。
#
# 用法参考：把这两个节点并入你自己的 Nexus 配置的 `outbounds:` 段，再在 rules/groups
# 里引用 tag。**密码一律占位 CHANGE_ME，请勿把真实凭据提交进仓库。**
#
# server 域名/端口/ALPN/skip-cert-verify 为真实公开值；password 必须替换。
# trojan 出站当前无 UDP 路径（产品入口 + 出站均未实现，见 MATRIX `UdpEcho` 格）；
# 配置中出现的 `udp` 键当前不生效。

schema_version: 1

inbounds:
  - tag: socks5-in
    kind: socks5
    listen: 127.0.0.1:1080

outbounds:
  - tag: direct
    kind: direct
    locator: ""

  - tag: 日本-TY-3
    kind: trojan
    locator: ty-3.tr202613.com:443
    password: CHANGE_ME            # TODO: 替换为真实 trojan 密码，勿入库
    alpn: [h2, http/1.1]
    skip_cert_verify: true
    header_format: singbox          # sing-box 系服务器要求 0x01 命令字节

  - tag: 日本-OS-3
    kind: trojan
    locator: os-3.tr202613.com:443
    password: CHANGE_ME            # TODO: 替换为真实 trojan 密码，勿入库
    alpn: [h2, http/1.1]
    skip_cert_verify: true
    header_format: singbox

groups:
  - tag: trojan-auto
    kind: urltest
    candidates: [日本-TY-3, 日本-OS-3]

rules:
  - tag: proxy-all
    kind: match
    match: ""
    action:
      - kind: select_outbound
        tag: trojan-auto
